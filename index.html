.field label .req{font-size:9.5px;font-weight:800;color:#d6336c;background:#fdf0f4;border-radius:6px;padding:2px 5px;margin-left:3px;vertical-align:1px}
.field label .opt{font-size:9.5px;font-weight:800;color:var(--ink3);background:#f2f4f9;border-radius:6px;padding:2px 5px;margin-left:3px;vertical-align:1px}
.rt-starbtn{display:flex;gap:2px;align-items:center;margin-top:2px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.rt-star{position:relative;flex:1;height:46px;display:flex;align-items:center;justify-content:center;font-size:33px;line-height:1;color:#dde1ea;touch-action:none;user-select:none;-webkit-user-select:none}
.rt-star .g{position:relative;display:inline-block;pointer-events:none}
.rt-star .gf{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#f5a524}
.rt-half{position:absolute;top:0;bottom:0;width:50%;background:transparent;border:0;padding:0;-webkit-tap-highlight-color:transparent}
.rt-half.l{left:0;border-radius:10px 0 0 10px}
.rt-half.r{right:0;border-radius:0 10px 10px 0}
.rt-half:active{background:rgba(47,107,246,.07)}
.rt-starbtn.dragging .rt-half:active{background:transparent}   /* 드래그 중에는 누른 칸 강조를 끔 */
#rtStarHint{font-size:12px;font-weight:800;color:var(--ink2)}
/* 반 별 — 채움 비율만큼 잘라 보여줍니다 */
.st5{position:relative;display:inline-block;white-space:nowrap;line-height:1;color:#d8dde8;letter-spacing:.4px;vertical-align:-1px}
.st5-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#f5a524}
.rt-noresult{text-align:center;font-size:11.5px;color:var(--ink3);padding:10px;line-height:1.6}
.rt-h2ico{display:inline-flex;align-items:center;color:var(--brand);vertical-align:-3px;margin-right:6px}
.rt-filter{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 9px;margin:0 -1px;scrollbar-width:none}
.rt-filter::-webkit-scrollbar{display:none}
.rt-filter button{
  flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:6px 10px;white-space:nowrap;
}
.rt-filter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rt-map .leaflet-container,.rt-pick .leaflet-container{border-radius:12px}
.kakao-pop{padding:2px 4px 2px 2px}
.rt-cand{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:9px 11px;margin-top:6px;line-height:1.45;
}
.rt-cand:active{background:#f4f7fc}
.rt-cand b{display:block;font-size:13px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.rt-cand span{display:block;font-size:11px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-cand i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);margin-top:1px}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ================= BOOT (로그인 상태 확인) ================= -->
  <section class="screen active" id="scr-boot">
    <div class="boot-wrap">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="17.1" cy="8.9" r="2.6" fill="#FFFFFF" opacity=".62"/>
          <path d="M16.4 14.5c2.9.25 5.05 2.35 5.05 5.2" fill="none" stroke="#FFFFFF" stroke-width="2.15" stroke-linecap="round" opacity=".62"/>
          <circle cx="9.1" cy="7.9" r="3.5" fill="#FFFFFF"/>
          <path d="M2.4 19.7c0-3.6 3-5.95 6.7-5.95s6.7 2.35 6.7 5.95" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="boot-txt">
        <b>우리팀 허브</b>
        <span id="bootMsg">로그인 상태 확인 중…</span>
      </div>
      <div class="boot-spin" id="bootSpin" aria-hidden="true"></div>
      <div class="boot-retry hidden" id="bootRetry">
        <p id="bootRetryMsg"></p>
        <button class="btn" id="bootRetryBtn" type="button">다시 시도</button>
        <button class="btn-link" id="bootLoginBtn" type="button">로그인 화면으로</button>
      </div>
    </div>
  </section>

  <!-- ================= AUTH ================= -->
  <section class="screen" id="scr-auth">
    <div class="auth-wrap">
      <div class="auth-brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <!-- 뒷사람 -->
            <circle cx="17.1" cy="8.9" r="2.6" fill="#FFFFFF" opacity=".62"/>
            <path d="M16.4 14.5c2.9.25 5.05 2.35 5.05 5.2" fill="none" stroke="#FFFFFF" stroke-width="2.15" stroke-linecap="round" opacity=".62"/>
            <!-- 앞사람 -->
            <circle cx="9.1" cy="7.9" r="3.5" fill="#FFFFFF"/>
            <path d="M2.4 19.7c0-3.6 3-5.95 6.7-5.95s6.7 2.35 6.7 5.95" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>우리팀 허브</h1>
        <p>공지 · 당직 · 사진 · 맛집 · 대화를 한 곳에서</p>
      </div>

      <div class="auth-form">
        <div class="seg" id="authSeg">
          <button class="on" data-mode="login">로그인</button>
          <button data-mode="signup">회원가입</button>
        </div>

        <form id="formLogin">
          <div class="field">
            <label>사번</label>
            <input type="text" id="liEmp" inputmode="numeric" autocomplete="username" placeholder="사번 (예: 1001)">
          </div>
          <div class="field">
            <label>비밀번호</label>
            <input type="password" id="liPw" autocomplete="current-password" placeholder="4자 이상">
          </div>
          <button class="btn" type="submit" id="btnLogin">로그인</button>
          <div id="loginErr" class="field hint" style="color:var(--danger);text-align:center;margin-top:8px"></div>
        </form>

        <form id="formSignup" class="hidden">
          <div class="field">
            <label>이름</label>
            <input type="text" id="suName" autocomplete="name" placeholder="홍길동">
          </div>
          <div class="field">
            <label>사번</label>
            <input type="text" id="suEmp" inputmode="numeric" autocomplete="off" placeholder="예: 1001">
          </div>
          <div class="field">
            <label>비밀번호</label>
            <input type="password" id="suPw" autocomplete="new-password" placeholder="4자 이상">
            <div class="hint">비밀번호는 4자 이상이면 돼요. 가입 후 관리자 승인을 받아야 입장할 수 있어요.</div>
          </div>
          <button class="btn" type="submit" id="btnSignup">가입 신청하기</button>
          <div id="signupErr" class="field hint" style="color:var(--danger);text-align:center;margin-top:8px"></div>
        </form>

        <div class="demo-box hidden" id="demoBox">
          <h4>⚡ 체험(미리보기) 모드 <span class="badge" style="margin-left:auto">둘러보기용</span></h4>
          <p>실제 팀 데이터와는 별개로, 이 폰에만 저장되는 둘러보기 모드예요. 버튼 한 번으로 화면과 승인 흐름을 모두 볼 수 있어요.</p>
          <div class="demo-btns">
            <button type="button" data-demo="admin"><span>👑</span>관리자 체험</button>
            <button type="button" data-demo="member"><span>🙋</span>팀원 체험</button>
            <button type="button" data-demo="pending"><span>⏳</span>승인 대기</button>
          </div>
        </div>

        <button class="btn-link hidden" id="openCfgFromAuth" type="button">Firebase 연결 설정</button>
      </div>

      <!-- 체험 모드 안내는 개발·테스트용이라 기본은 숨김(applyModeUI 가 ?demo=1 로 들어온 경우에만 표시) -->
      <div class="auth-foot hidden" id="authFoot"></div>
    </div>
  </section>

  <!-- ================= PENDING ================= -->
  <section class="screen" id="scr-pending">
    <div class="pending-card">
      <div class="pending-ico">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>
        </svg>
      </div>
      <h2>승인 대기 중</h2>
      <p>가입 신청이 접수됐어요.<br>관리자가 승인하면 바로 입장할 수 있어요.</p>
      <div class="pending-who" id="pendingWho"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" id="btnCheckApproval">승인 상태 확인</button>
        <button class="btn ghost hidden" id="btnPendingAdmin">👑 관리자 계정으로 전환해 승인하기</button>
        <button class="btn ghost-line" id="btnLogout2">로그아웃</button>
      </div>
      <div class="pending-note">승인 전에는 공지·사진·대화 내용을 볼 수 없어요.</div>
    </div>
  </section>

  <!-- ================= MAIN ================= -->
  <main class="screen" id="scr-main">
    <header class="hdr">
      <div class="hdr-logo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 20v-1.6a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3.4"/>
          <path d="M22 20v-1.6a4 4 0 0 0-3-3.85"/><path d="M16 3.7a3.4 3.4 0 0 1 0 6.6"/>
        </svg>
      </div>
      <div class="hdr-txt">
        <b>우리팀 허브</b>
        <span id="hdrSub">행정지원팀</span>
      </div>
      <span class="badge" id="modeBadge">미리보기 모드</span>
      <button id="btnProfile" aria-label="팀원관리 · 내 프로필" style="display:flex;align-items:center;gap:6px">
        <span class="avatar" id="myAvatar">김</span>
        <span id="avatarPendingDot" class="hidden">0</span>
      </button>
    </header>

    <div class="views">
      <section class="view active" id="view-notices"></section>
      <section class="view" id="view-duty"></section>
      <section class="view" id="view-photos"></section>
      <section class="view" id="view-rest"></section>
      <section class="view chat" id="view-chat"></section>
      <section class="view" id="view-team"></section>
    </div>

    <nav class="tabbar" id="tabbar">
      <button data-tab="notices" class="on">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5a1.5 1.5 0 0 0 1.5 1.5H8l5.5 4V5.5L8 9.5H5.5A1.5 1.5 0 0 0 4 11z"/><path d="M17.5 9a4.2 4.2 0 0 1 0 6"/></svg>
        <span class="tl">공지</span>
        <span class="dotn hidden" id="dotNotices">0</span>
      </button>
      <button data-tab="duty">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3.2v3.6M16 3.2v3.6M3.5 10h17"/></svg>
        <span class="tl">당직</span>
      </button>
      <button data-tab="photos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="8.8" cy="9.8" r="1.6"/><path d="m4.5 17 4.7-4.4a1.8 1.8 0 0 1 2.4 0l5.2 4.7"/><path d="m14.6 15 1.4-1.3a1.8 1.8 0 0 1 2.4 0l1.8 1.6"/></svg>
        <span class="tl">사진</span>
      </button>
      <button data-tab="rest">
        <svg width="23" height="23" viewBox="-1.5 -1.5 27 27" fill="currentColor" stroke="none" overflow="visible"><rect x="4.1" y="2.8" width="2" height="7.4" rx="1"/><rect x="7" y="2.8" width="2" height="7.4" rx="1"/><rect x="9.9" y="2.8" width="2" height="7.4" rx="1"/><path d="M4.1 8.6h7.8v1.4a3.9 3.9 0 0 1-7.8 0z"/><rect x="6.9" y="13.2" width="2.2" height="8" rx="1.1"/><path d="M19.4 3c-3.2 2.2-4.8 4.9-4.8 7.7 0 1.9 1.1 3.3 3.1 3.8V21h2.3V3z"/></svg>
        <span class="tl">맛집</span>
      </button>
      <button data-tab="chat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8a8 8 0 0 1-11.7 7.1L4 20.5l1.6-4.7a8 8 0 1 1 14.9-4z"/><path d="M8.6 11.5h.01M12 11.5h.01M15.4 11.5h.01"/></svg>
        <span class="tl">대화</span>
        <span class="dotn hidden" id="dotChat">0</span>
      </button>
    </nav>
  </main>
</div>

<div id="layer"></div>
<div class="toast" id="toast"></div>
<div id="printSheet"></div>
<script>

/* 검색어 강조 — esc 로 안전하게 바꾼 뒤 일치 부분만 <mark> 로 감싼다 */
function hlQ(text, q) {
  const t = esc(text);
  const k = String(q == null ? "" : q).trim();
  if (!k) return t;
  const pat = esc(k).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try { return t.replace(new RegExp("(" + pat + ")", "gi"), '<mark class="hl">$1</mark>'); }
  catch (e) { return t; }
}

function fmtClock(ms) { const d = new Date(ms); const h = d.getHours(); return (h < 12 ? "오전 " : "오후 ") + (h % 12 === 0 ? 12 : h % 12) + ":" + pad2(d.getMinutes()); }
function fmtDay(ms) {
  const d = new Date(ms), t = new Date();
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (sameDay(d, t)) return "오늘";
  const y = new Date(t.getTime() - 86400000);
  if (sameDay(d, y)) return "어제";
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + days[d.getDay()] + ")";
}
function fmtRel(ms) {
  if (!ms) return "방금";
  const diff = Date.now() - ms;
  if (diff < 60000) return "방금";
  if (diff < 3600000) return Math.floor(diff / 60000) + "분 전";
  if (diff < 86400000) return Math.floor(diff / 3600000) + "시간 전";
  if (diff < 604800000) return Math.floor(diff / 86400000) + "일 전";
  const d = new Date(ms);
  return (d.getMonth() + 1) + "/" + d.getDate();
}

function memberAvatar(id, name) {
  let m = null;
  if (id) m = S.members.filter(x => x.uid === id)[0] || null;
  if (!m && name) m = S.members.filter(x => x.name === name)[0] || null;
  let v = m ? m.avatarData : "";
  if (!v && S.user && ((id && S.user.uid === id) || (!id && name && S.user.name === name))) v = S.user.avatarData;
  return String(v || "");
}
function avatarHtml(name, cls, id) {
  return avatarHtmlValue(memberAvatar(id, name), name, cls);
}
/* 값 하나를 그대로 그립니다 — 미리보기(저장 전)에도 씁니다. */
function avatarHtmlValue(v, name, cls) {
  const val = String(v || "");
  const cl = ("avatar " + (cls || "")).trim();
  if (val.indexOf("data:image") === 0) return '<span class="' + cl + ' photo"><img src="' + esc(val) + '" alt="" loading="lazy"></span>';
  if (val.indexOf("emoji:") === 0) return '<span class="' + cl + ' emo">' + esc(val.slice(6)) + "</span>";
  return '<span class="' + cl + '" style="background:' + colorOf(name) + '">' + esc(initial(name)) + "</span>";
}

/* 기본(내장) 설정이 완전할 때는 저장값이 비어 있어도 이 설정으로 연결합니다.
   예전에 미리보기 모드로 열어 둔 브라우저에 빈 설정이 남아 있어도
   데모에 갇히지 않고 실시간 로그인 화면으로 바로 이어지도록 하기 위함입니다. */
const CFG_FIELDS = ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"];
const DEMO_TRY_KEY = "teamhub.trydemo";   /* '1' 이면 이번 탭에서만 체험 모드 */
function cfgComplete(c) {
  if (!c) return false;
  return CFG_FIELDS.every(k => String(c[k] == null ? "" : c[k]).trim().length > 0);
}
function loadConfig() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch (e) { saved = null; }
  let cfg;
  if (cfgComplete(saved)) cfg = Object.assign({}, FIREBASE_CONFIG, saved);   /* 직접 저장한 완전한 설정 */
  else {
    cfg = Object.assign({}, FIREBASE_CONFIG);
    if (saved) { try { localStorage.removeItem(CFG_KEY); } catch (e) {} }   /* 지난 빈/데모 설정 청소 */
  }
  let wantDemo = false;
  try { wantDemo = sessionStorage.getItem(DEMO_TRY_KEY) === "1"; } catch (e) {}
  /* 개발·테스트용 체험 모드: 주소 끝에 ?demo=1 을 붙인 경우에만 열립니다.
     로그인 화면에는 체험 모드로 들어가는 링크를 두지 않습니다(일반 팀원 노출 방지). */
  let demoParam = false;
  try { demoParam = new URLSearchParams(location.search || "").get("demo") === "1"; } catch (e) { demoParam = false; }
  if (demoParam) {
    wantDemo = true;
    try { sessionStorage.setItem(DEMO_TRY_KEY, "1"); } catch (e) {}
    /* 주소창에 남은 ?demo=1 은 지워서, 새로고침·재방문 때 일반 화면으로 돌아가게 */
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }
  const live = cfgComplete(cfg) && !wantDemo;
  let team = "행정지원팀";
  try { team = localStorage.getItem(TEAM_KEY) || team; } catch (e) {}
  return { cfg: cfg, live: live, team: team, demoOverride: wantDemo };
}
function saveConfig(cfg, team) {
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  if (team) localStorage.setItem(TEAM_KEY, team);
}

/* 로그인 유지 — 저장소를 하나만 쓰지 않고 localStorage 를 우선, IndexedDB 를 다음으로 둡니다.
   · Firebase 는 클라이언트 버전 때문에 persistence 배열에서 '쓸 수 있는 첫 번째'를 쓰지만,
     다른 저장소에 이미 세션이 남아 있으면 그 세션을 읽어 새 저장소로 옮겨 줍니다.
     그래서 기존에 IndexedDB 에 저장돼 있던 로그인도 다시 로그인하지 않고 그대로 이어집니다.
   · iOS Safari·홈 화면 웹앱은 IndexedDB 를 비우는 일이 잦고, firebase 10.14.1 의 getAuth 기본값이
     [IndexedDB, localStorage, sessionStorage] 라서 IndexedDB 가 살아 있는 동안에는 계속 IndexedDB 에만
     저장됐습니다 → IndexedDB 가 비워지는 순간 로그인이 풀렸습니다.
   · initializeAuth 는 이미 초기화된 경우 auth/already-initialized 로 거절하므로, 그때는 getAuth 로 받아
     localStorage 로 고정합니다. */
function initAuth(authMod, app) {
  const useLocal = localStoreOk();
  const chain = useLocal
    ? [authMod.browserLocalPersistence, authMod.indexedDBLocalPersistence]
    : [authMod.indexedDBLocalPersistence, authMod.browserLocalPersistence];
  try {
    const auth = authMod.initializeAuth(app, { persistence: chain });
    FB.persist = useLocal ? "local+idb" : "idb+local";
    return auth;
  } catch (e) {
    const auth = authMod.getAuth(app);
    FB.persist = "fallback";
    if (useLocal) {
      try { Promise.resolve(authMod.setPersistence(auth, authMod.browserLocalPersistence)).catch(() => {}); }
      catch (err) {}
    }
    return auth;
  }
}
/* localStorage 에 로그인 정보(약 1.5KB)를 쓸 여유가 있는지 먼저 확인합니다.
   꽉 찼거나 막힌 브라우저라면 IndexedDB 를 먼저 쓰도록 순서를 바꿉니다. */
function localStoreOk() {
  try {
    const k = "__th_probe__";
    const v = "0".repeat(4096);
    localStorage.setItem(k, v);
    const ok = localStorage.getItem(k) === v;
    localStorage.removeItem(k);
    return ok;
  } catch (e) { return false; }
}

function isWeekendDs(ds) { const wd = new Date(ds + "T00:00:00").getDay(); return wd === 0 || wd === 6; }

function isDutyDay(ds) { return !isWeekendDs(ds) && !holidayName(ds) && !eventOf(ds); }

function holidaysInYear(y) {
  const pre = String(y) + "-";
  const out = {};
  Object.keys(HOLIDAY_TABLE).forEach(ds => { if (ds.indexOf(pre) === 0) out[ds] = HOLIDAY_TABLE[ds]; });
  Object.keys(HOL.map).forEach(ds => { if (ds.indexOf(pre) === 0 && !out[ds]) out[ds] = HOL.map[ds]; });
  return Object.keys(out).sort();
}
function holidayOnline(y) {
  const c = holCacheRead();
  return !!(HOL.api[String(y)] || (c.years[String(y)] && c.years[String(y)].at));
}
function holidayNoteHtml(y) {
  const n = holidaysInYear(y).length;
  const online = holidayOnline(y);
  if (HOL.st === "loading" && !n) return "🌐 " + y + "년 공휴일 불러오는 중…";
  return "🌐 공휴일 연동 · " + y + "년 " + n + "일" + (online ? " · 온라인" : " · 내장 표") +
    (HOL.st === "error" ? " (오프라인)" : "");
}

/* 연도별 공휴일 불러오기 — 성공하면 캐시 저장 후 화면을 다시 그립니다 */
async function loadHolidays(year) {
  const y = String(year);
  HOL.st = "loading";
  try {
    const r = await fetch("https://date.nager.at/api/v3/PublicHolidays/" + y + "/KR", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const arr = await r.json();
    if (!Array.isArray(arr) || !arr.length) throw new Error("빈 응답");
    const d = {};
    arr.forEach(h => {
      if (!h || !h.date || !/^\d{4}-\d{2}-\d{2}$/.test(h.date)) return;
      const nm = String(h.localName || h.name || "공휴일").trim();
      if (nm && !d[h.date]) d[h.date] = nm;
    });
    const c = holCacheRead();
    c.years[y] = { at: Date.now(), api: "date.nager.at", d: d };
    holCacheWrite(c);
    holApplyCache(c);
    HOL.api[y] = 1;
    HOL.st = "ready";
    HOL.err = "";
  } catch (e) {
    holApplyCache(holCacheRead());
    HOL.st = "error";
    HOL.err = (e && e.message) || "불러오기 실패";
    console.warn("공휴일 자동 연동 실패:", HOL.err);
  }
  if (S.tab === "duty" && S.user) renderDuty();
}
function ensureHolidays(year) {
  const y = String(year);
  if (HOL.asked[y]) return;
  HOL.asked[y] = 1;
  const c = holCacheRead();
  const rec = c.years[y];
  if (rec && rec.at && Date.now() - rec.at < HOL_TTL) { holApplyCache(c); return; }
  loadHolidays(y);
}

/* 당직 명단 — 승인 팀원 + 직접 추가한 이름을 가나다순으로 */
function customMembers() {
  const list = (S.roster && Array.isArray(S.roster.customMembers)) ? S.roster.customMembers : [];
  return list.filter(c => c && c.id && c.name).map(c => ({ id: c.id, name: String(c.name) }));
}
function rosterAll() {
  const list = approved().map(m => ({ uid: m.uid, name: m.name, position: m.position || "", custom: false }));
  customMembers().forEach(c => list.push({ uid: c.id, name: c.name, position: "", custom: true }));
  return list.sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
}
function rosterMember(id) { return rosterAll().filter(m => m.uid === id)[0] || null; }
function excludedList() { return (S.roster && Array.isArray(S.roster.excluded)) ? S.roster.excluded : []; }
function rosterMembers() {
  const ex = excludedList();
  return rosterAll().filter(m => ex.indexOf(m.uid) < 0);
}

/* 배정 계획 -------------------------------------------------------------- */
function lastDutyBefore(ds) {
  const list = S.duty.filter(e => e.type === "duty" && entryStart(e) < ds)
    .sort((a, b) => entryStart(a) < entryStart(b) ? 1 : entryStart(a) > entryStart(b) ? -1 : 0);
  return list[0] || null;
}
/* fromDs~toDs 평일 배정 계획.
   startUid 를 주면 그 사람부터, 안 주면 12월 1일은 명단 처음부터·그 외에는 직전 당직자 다음 사람부터 */
function buildDutyPlan(fromDs, toDs, startUid) {
  const roster = rosterMembers();
  if (!roster.length) return { rows: [], roster: roster };
  let idx = 0;
  const si = startUid ? roster.findIndex(m => m.uid === startUid) : -1;
  if (si >= 0) {
    idx = si;
  } else if (fromDs.slice(5) !== "12-01") {
    const last = lastDutyBefore(fromDs);
    if (last) {
      const i = roster.findIndex(m => m.uid === last.memberId);
      idx = i >= 0 ? i + 1 : 0;
    }
  }
  const rows = [];
  let ds = fromDs, guard = 0;
  while (ds <= toDs && guard++ < 400) {
    if (isDutyDay(ds)) {
      const m = roster[idx % roster.length];
      rows.push({ ds: ds, uid: m.uid, name: m.name });
      idx++;
    }
    ds = addDays(ds, 1);
  }
  return { rows: rows, roster: roster };
}

/* 재배정 기본 시작 담당자 — 그날 기존 당직자 → 직전 당직 다음 사람 → 명단 첫 사람 */
function defaultStartUid(fromDs) {
  const roster = rosterMembers();
  if (!roster.length) return "";
  const on = S.duty.filter(e => e.type === "duty" && entryStart(e) === fromDs)[0];
  if (on && roster.some(m => m.uid === on.memberId)) return on.memberId;
  const last = lastDutyBefore(fromDs);
  if (last) {
    const i = roster.findIndex(m => m.uid === last.memberId);
    if (i >= 0) return roster[(i + 1) % roster.length].uid;
  }
  return roster[0].uid;
}

/* 계획 적용 — onlyEmpty: 이미 등록된 날짜는 건드리지 않음(다음 달 생성) */
async function applyDutyPlan(rows, onlyEmpty) {
  let created = 0, replaced = 0, kept = 0;
  for (const r of rows) {
    const existing = S.duty.filter(e => e.type === "duty" && entryStart(e) === r.ds);
    if (existing.some(e => e.memberId === r.uid)) { kept++; continue; }
    if (existing.length && onlyEmpty) { kept++; continue; }
    for (const e of existing) await dbDeleteEntry(e.id);
    await dbSaveEntry({ startDate: r.ds, endDate: r.ds, type: "duty", memberId: r.uid, memberName: r.name, memo: "" });
    existing.length ? replaced++ : created++;
  }
  return { created: created, replaced: replaced, kept: kept };
}

/* 한국 시간(KST) 기준 시각 — 기기 시간대와 무관하게 24일 00:00을 판단 */
function kstNow() {
  const t = new Date();
  return new Date(t.getTime() + t.getTimezoneOffset() * 60000 + 9 * 3600000);
}

function nextMonthInfo() {
  const now = kstNow();
  const d = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const from = ymd(d), to = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  const duties = S.duty.filter(e => e.type === "duty" && entryStart(e) >= from && entryStart(e) <= to);
  return {
    y: d.getFullYear(), m: d.getMonth(), label: (d.getMonth() + 1) + "월",
    from: from, to: to, count: duties.length, roster: rosterMembers().length,
    day: now.getDate(), due: now.getDate() >= 24
  };
}

/* 당직 자동 배정 — 매월 24일 00:00(KST) 이후 앱을 열면 다음 달 당직을 한 번 만든다.
   · 다음 달 일정이 하나도 없을 때만, 한 달에 한 번만(로컬 플래그) 실행
   · 규칙은 재배정과 같음: 가나다순, 주말·공휴일·행사일 제외,
     12월은 명단 처음부터 · 1월 이후는 전달 마지막 담당자 다음 사람부터 */
const AUTODUTY_KEY = "teamhub.autoduty.v1";
const AUTO_DUTY_TRIED = {};
let autoDutyBusy = false;
function autoDutySeen(ds) {
  try {
    const m = JSON.parse(localStorage.getItem(AUTODUTY_KEY) || "{}") || {};
    return !!m[ds];
  } catch (e) { return false; }
}
function autoDutyMark(ds) {
  try {
    const m = JSON.parse(localStorage.getItem(AUTODUTY_KEY) || "{}") || {};
    m[ds] = Date.now();
    const ks = Object.keys(m).sort();
    while (ks.length > 24) delete m[ks.shift()];
    localStorage.setItem(AUTODUTY_KEY, JSON.stringify(m));
  } catch (e) {}
}

async function autoAssignNextMonth() {
  if (autoDutyBusy) return;
  if (!S.user || S.user.status !== "approved" || !canManageDuty()) return;
  if (!LOADED.members || !LOADED.duty || !LOADED.roster) return;
  const info = nextMonthInfo();
  if (!info.due) return;                       /* 24일 00:00(KST) 이전에는 만들지 않음 */
  if (AUTO_DUTY_TRIED[info.from]) return;
  if (autoDutySeen(info.from)) return;          /* 이미 이 달은 자동 배정함 */
  if (info.count) { AUTO_DUTY_TRIED[info.from] = 1; return; }  /* 이미 일정이 있으면 손대지 않음 */
  if (!info.roster) return;                     /* 명단이 비어 있으면 다음 접속 때 */
  AUTO_DUTY_TRIED[info.from] = 1;
  autoDutyBusy = true;
  try {
    if (!holidayOnline(info.y)) { try { await loadHolidays(info.y); } catch (e) {} }
    const plan = buildDutyPlan(info.from, info.to);
    if (!plan.rows.length) return;
    const r = await applyDutyPlan(plan.rows, true);
    autoDutyMark(info.from);
    const n = r.created + r.replaced;
    if (!n) return;
    S.cursor = new Date(info.y, info.m, 1);
    if (S.tab === "duty") renderDuty();
    toast(info.label + " 당직 " + n + "건을 자동 배정했어요");
  } catch (e) {
    console.warn("당직 자동 배정 실패:", (e && e.message) || e);
  } finally { autoDutyBusy = false; }
}

  active.forEach((m, i) => { order[m.uid] = i + 1; });

    if (admin && editId && editId === m.uid) {
      return '<div class="rrow editing">' +
        '<span class="no">✏️</span>' +

        '<button class="ok" id="rmSave">저장</button>' +

      "</div>";
    }

      '<span class="no">' + no + "</span>" +
      avatarHtml(m.name, "sm", m.uid) +
      '<div class="nm"><b>' + esc(m.name) + (m.custom ? ' <span class="cf">직접</span>' : "") + "</b><p>" + esc(meta) + "</p></div>" +
      (admin ? '<div class="racts">' +
        (m.custom ? '<button class="ico" data-ren="' + m.uid + '" aria-label="이름 수정">' + ICON.pencil + "</button>" +
                    '<button class="ico danger" data-rm="' + m.uid + '" data-nm="' + esc(m.name) + '" aria-label="명단에서 삭제">' + ICON.trash + "</button>" : "") +
        '<button class="tog' + (off ? " on" : "") + '" data-ex="' + m.uid + '" data-off="' + (off ? "0" : "1") + '">' + (off ? "포함" : "제외") + "</button>" +
        "</div>" : "") +

  const addHtml = admin
    ? '<div class="sec-title" style="margin:15px 0 6px">회원이 아닌 사람 추가</div>' +
      '<div class="radd"><input type="text" id="rmName" maxlength="12" placeholder="이름 (예: 김의진)" autocomplete="off"><button id="rmAdd">추가</button></div>' +
      '<div class="hint" style="margin:6px 2px 0">가입하지 않은 직원도 이름만 넣으면 당직 순번에 포함됩니다.</div>'
    : "";

  openSheet({
    title: "당직 명단",
    body:
      '<div class="notice-bar">승인된 팀원과 직접 추가한 이름이 <b>가나다순</b>으로 순번이 정해집니다. [제외]를 누르면 순번에서 빠지고, 직접 추가한 이름은 수정·삭제할 수 있어요.</div>' +
      '<div class="sec-title" style="margin-top:0">🏢 명단 ' + active.length + "명" + (ex.length ? " · 제외 " + ex.length + "명" : "") + "</div>" +
      (rows || '<div class="empty"><span>👥</span>승인된 팀원이 없습니다.</div>') + addHtml +
      '<div class="notice-bar" style="margin-top:12px;background:#f2f5fb;border-color:#e3e9f4;color:var(--ink2)">명단을 바꾼 뒤에는 달력의 <b>재배정</b>으로 원하는 날짜부터 순번을 다시 돌려 주세요.</div>',
    onMount: root => {
      const again = msg => { closeSheet(); openRosterSheet(); if (S.tab === "duty") renderDuty(); if (msg) toast(msg); };
      $$("[data-ex]", root).forEach(b => b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          await dbSetExcluded(b.dataset.ex, b.dataset.off === "1");
          again(b.dataset.off === "1" ? "명단에서 제외했어요" : "명단에 다시 포함했어요");
        } catch (e) { b.disabled = false; toast(fbErrMsg(e)); }
      }));
      $$("[data-ren]", root).forEach(b => b.addEventListener("click", () => openRosterSheet(b.dataset.ren)));
      $$("[data-rm]", root).forEach(b => b.addEventListener("click", async () => {
        if (!confirm("'" + b.dataset.nm + "' 님을 당직 명단에서 삭제할까요?\n이미 배정된 당직 일정은 그대로 남습니다.")) return;
        b.disabled = true;
        try { await dbRemoveCustomMember(b.dataset.rm); again("명단에서 삭제했어요"); }

          saveBtn.disabled = true;
          try {
            const ok = await dbRenameCustomMember(editId, nm);
            if (ok) again("이름을 수정했어요"); else saveBtn.disabled = false;
          } catch (e) { saveBtn.disabled = false; toast(fbErrMsg(e)); }

        saveBtn.addEventListener("click", doSave);
        editInp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doSave(); } });

      const addBtn = $("#rmAdd", root), addInp = $("#rmName", root);

          addBtn.disabled = true;
          try {
            const ok = await dbAddCustomMember(nm);
            if (ok) again(nm + " 님을 명단에 추가했어요"); else addBtn.disabled = false;
          } catch (e) { addBtn.disabled = false; toast(fbErrMsg(e)); }
        };
        addBtn.addEventListener("click", doAdd);
        addInp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doAdd(); } });
      }
    }
  });
}

/* 재배정 시트 — 시작일 지정 → 기존/변경 비교 → 적용 ------------------------ */
function openRebalanceSheet() {
  const info = nextMonthInfo();
  const lastDutyDs = S.duty.filter(e => e.type === "duty").map(entryStart).sort().pop() || "";
  const endOfMonth = ds => { const d = new Date(ds + "T00:00:00"); return ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
  let start = info.from;
  let end = (lastDutyDs && lastDutyDs > start) ? endOfMonth(lastDutyDs) : info.to;
  let startUid = defaultStartUid(start);

  const whoOptions = () => {
    const roster = rosterMembers();
    if (!roster.length) return '<option value="">당직 명단 없음</option>';
    return roster.map(m => '<option value="' + esc(m.uid) + '"' + (m.uid === startUid ? " selected" : "") + ">" +
      esc(m.name) + (m.position ? " · " + esc(m.position) : "") + "</option>").join("");
  };

  const build = () => {
    const plan = buildDutyPlan(start, end, startUid);
    const changes = [];
    plan.rows.forEach(r => {
      const cur = S.duty.filter(e => e.type === "duty" && entryStart(e) === r.ds)[0];
      if (!cur || cur.memberId !== r.uid) changes.push({ ds: r.ds, old: cur ? cur.memberName : "", name: r.name });
    });
    return { plan: plan, changes: changes };
  };
  let cur = build();

  const preview = () => {
    if (!cur.plan.roster.length) return '<div class="empty" style="padding:22px"><span>👥</span>당직 명단이 비어 있습니다.</div>';
    if (!cur.changes.length) return '<div class="empty" style="padding:22px"><span>✅</span>바뀔 일정이 없습니다.<br>기존 배정이 최신 명단과 같아요.</div>';
    return '<div class="plan"><div class="prow head"><span class="d">날짜</span><span class="old">기존</span><span></span><span class="new">변경</span></div>' +
      cur.changes.map(c => '<div class="prow"><span class="d">' + shortDate(c.ds) + ' (' + DAYS[new Date(c.ds + "T00:00:00").getDay()] + ')</span>' +
        '<span class="old">' + (c.old ? esc(c.old) : "없음") + "</span><span style=\"color:var(--ink3);text-align:center\">→</span>" +
        '<span class="new">' + esc(c.name) + "</span></div>").join("") + "</div>";
  };

  openSheet({
    title: "당직 재배정",
    body:
      '<div class="notice-bar">시작일과 시작 담당자를 고르면 그날부터 순번을 다시 돌린 결과를 <b>기존 담당자와 비교</b>해 보여줍니다. [적용]을 눌러야 반영됩니다.</div>' +
      '<div class="field"><label>시작 날짜</label><input type="date" id="rbStart" value="' + start + '"></div>' +
      '<div class="field"><label>시작 담당자 (이 사람부터 순서대로 배정)</label><select id="rbWho">' + whoOptions() + "</select></div>" +
      '<div class="sec-title" style="margin-top:0" id="rbSum"></div>' +
      '<div id="rbBox">' + preview() + "</div>" +
      '<div class="notice-bar" style="margin-top:10px;background:#f2f5fb;border-color:#e3e9f4;color:var(--ink2)">주말·공휴일·행사일은 건너뛰고, 고른 담당자부터 명단 ' + rosterMembers().length + '명 순번대로 배정합니다.</div>',
    footer: '<button class="btn" id="rbApply">적용</button>',
    onMount: root => {
      const sum = $("#rbSum", root), box = $("#rbBox", root), btn = $("#rbApply", root), who = $("#rbWho", root);
      const whoName = () => { const m = rosterMember(startUid); return m ? m.name : ""; };
      const sync = () => {
        const n = cur.changes.length;
        sum.textContent = "변경 " + n + "건 · " + (start.slice(5).replace("-", "/")) + " ~ " + (end.slice(5).replace("-", "/")) +
          (whoName() ? " · " + whoName() + "부터" : "");
        box.innerHTML = preview();
        btn.disabled = !n;
        btn.textContent = n ? n + "건 적용" : "변경 없음";
      };
      sync();
      $("#rbStart", root).addEventListener("change", e => {
        start = e.target.value || start;
        end = (lastDutyDs && lastDutyDs > start) ? endOfMonth(lastDutyDs) : endOfMonth(start);
        startUid = defaultStartUid(start);   /* 날짜를 바꾸면 그날 기준 기본 담당자로 */
        if (who) who.innerHTML = whoOptions();
        cur = build();
        sync();
      });
      if (who) who.addEventListener("change", e => {
        startUid = e.target.value;
        cur = build();
        sync();
      });
      btn.addEventListener("click", async () => {
        btn.disabled = true; btn.textContent = "적용 중…";
        try {
          const r = await applyDutyPlan(cur.plan.rows, false);
          closeSheet(); renderDuty();
          toast("재배정 완료 · 변경 " + (r.created + r.replaced) + "건" + (r.kept ? " · 유지 " + r.kept + "건" : ""));
        } catch (e) { btn.disabled = false; toast(fbErrMsg(e)); }
      });
    }
  });
}

/* 명단 저장 — Firestore(duty_roster_config/config) 또는 미리보기 localStorage --------------- */
function rosterPayload(patch) {
  const base = {
    excluded: excludedList().slice(),
    customMembers: customMembers().map(c => ({ id: c.id, name: c.name })),
    msOff: msOffList().slice()
  };
  /* 팀 이름도 같은 문서에 함께 저장합니다(관리자가 바꾸면 전원에게 실시간).
     아직 받은 값이 없으면 넣지 않아, 다른 기기의 이름을 빈 값으로 덮지 않습니다. */
  const tn = (S.roster && typeof S.roster.teamName === "string") ? S.roster.teamName.trim().slice(0, 20) : "";
  if (tn) base.teamName = tn;
  return Object.assign(base, patch || {});
}
async function dbSaveRoster(patch) {
  const next = rosterPayload(patch);
  if (S.mode === "demo") {
    demoMutate(d => { d.roster = Object.assign({}, d.roster || {}, next, { updatedAt: Date.now() }); });
  } else {
    const { doc, setDoc, serverTimestamp } = FB.f;
    /* merge: 명단을 저장해도 같은 문서의 teamName 등 다른 값이 지워지지 않게 */
    await setDoc(doc(FB.db, "duty_roster_config", "config"), Object.assign({}, next, { updatedAt: serverTimestamp(), updatedBy: myUid() }), { merge: true });
    S.roster = Object.assign({}, S.roster, next);
    if (S.tab === "duty") renderDuty();
  }
}

/* 팀 이름 — 화면(상단 헤더·대화방·설정)과 localStorage 에 즉시 반영 ------------------------- */
function setTeamName(name) {

  const changed = v !== S.team;
  S.team = v;

  const ct = $("#chatTeamName"); if (ct) ct.textContent = v + " 단체방";

/* 관리자가 팀 이름을 저장 — duty_roster_config/config.teamName (규칙 그대로, 다시 게시 불필요) */
async function dbSetTeamName(name) {

async function dbSetExcluded(uid, off) {

/* 회원이 아닌 사람을 명단에 직접 추가 */
async function dbAddCustomMember(name) {
  const nm = String(name || "").replace(/\s+/g, " ").trim();
  if (!nm) { toast("이름을 입력해 주세요"); return false; }
  if (nm.length > 12) { toast("이름은 12자 이내로 입력해 주세요"); return false; }
  if (rosterAll().some(m => m.name === nm)) { toast("이미 명단에 있는 이름이에요"); return false; }
  const list = customMembers().map(c => ({ id: c.id, name: c.name }));
  list.push({ id: "cm_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: nm });
  await dbSaveRoster({ customMembers: list });
  return true;
}
/* 직접 추가한 이름 수정 — 배정된 당직 이름도 함께 바꿉니다 */
async function dbRenameCustomMember(id, name) {
  const nm = String(name || "").replace(/\s+/g, " ").trim();
  if (!nm) { toast("이름을 입력해 주세요"); return false; }
  if (nm.length > 12) { toast("이름은 12자 이내로 입력해 주세요"); return false; }
  if (rosterAll().some(m => m.uid !== id && m.name === nm)) { toast("이미 명단에 있는 이름이에요"); return false; }
  const list = customMembers().map(c => c.id === id ? { id: c.id, name: nm } : { id: c.id, name: c.name });
  if (!list.some(c => c.id === id)) return false;
  if (S.mode === "demo") {
    demoMutate(d => {
      d.roster = Object.assign({}, d.roster || {}, { customMembers: list, updatedAt: Date.now() });
      (d.duty || []).forEach(e => { if (e.memberId === id) e.memberName = nm; });
    });
  } else {
    const { doc, setDoc, serverTimestamp } = FB.f;
    await setDoc(doc(FB.db, "duty_roster_config", "config"), Object.assign({}, rosterPayload({ customMembers: list }), { updatedAt: serverTimestamp(), updatedBy: myUid() }), { merge: true });
    S.roster = Object.assign({}, S.roster, { customMembers: list });
    for (const e of S.duty.filter(x => x.memberId === id)) {
      try { await setDoc(doc(FB.db, "duty_schedules", e.id), { memberName: nm }, { merge: true }); } catch (err) {}
    }
    S.duty.forEach(e => { if (e.memberId === id) e.memberName = nm; });
    if (S.tab === "duty") renderDuty();
  }
  return true;
}
/* 직접 추가한 이름 삭제 (이미 배정된 일정은 그대로 둠) */
async function dbRemoveCustomMember(id) {
  const list = customMembers().filter(c => c.id !== id).map(c => ({ id: c.id, name: c.name }));
  const ex = excludedList().filter(x => x !== id);
  await dbSaveRoster({ customMembers: list, excluded: ex });
}
async function dbSaveEvent(ds, title) {
  const data = { date: ds, title: title, createdBy: myUid() };
  if (S.mode === "demo") {
    demoMutate(d => {
      d.events = (d.events || []).filter(e => (e.date || e.id) !== ds);
      d.events.push(Object.assign({ id: ds, createdAt: Date.now() }, data));

    const { doc, setDoc, serverTimestamp } = FB.f;
    await setDoc(doc(FB.db, "team_events", ds), Object.assign({}, data, { createdAt: serverTimestamp() }));
    S.events = S.events.filter(e => e.date !== ds).concat([{ id: ds, date: ds, title: title, createdAt: Date.now() }]);
    if (S.tab === "duty") renderDuty();
  }
}
async function dbDeleteEvent(ds) {
  if (S.mode === "demo") {
    demoMutate(d => { d.events = (d.events || []).filter(e => (e.date || e.id) !== ds); });

}

          (canAssign ? "" : '<div class="hint">본인 일정만 등록할 수 있어요. 다른 팀원 지정은 ' + (isDuty ? "관리자·당직 관리 권한자" : "관리자") + '만 가능합니다.</div>') + "</div>" +
        typeBlock +

          '<label>종료일 <span style="font-weight:500;color:var(--ink3)">(여러 날이면 종료일을 뒤로 · 1박 섬은 다음 날)</span></label>' +
          '<input type="date" id="schEnd" value="' + (curEnd || (curType === "overnight_island" ? addDays(ds, 1) : (curType === "edu" ? ds : ""))) + '" min="' + ds + '"></div>') +
        '<div class="field"><label>메모 (선택)</label><input type="text" id="schMemo" maxlength="40" placeholder="' + esc(MEMO_PH[curType] || "메모를 입력하세요") + '" value="' + esc(baseEntry ? (baseEntry.memo || "") : "") + '"></div>' +
        (isDuty ? '<div class="hint" style="margin:-4px 2px 8px">팀원끼리 상의해 담당자를 바꿀 수 있어요. 담당자를 바꾸면 누가·언제 바꿨는지 이력이 남습니다.</div>' : "") +

  openSheet({
    title: (Number(ds.slice(5, 7))) + "월 " + (Number(ds.slice(8, 10))) + "일 (" + DAYS[new Date(ds + "T00:00:00").getDay()] + ") " + (isDuty ? "당직" : "섬·교육"),
    body:
      (editing ? '<div class="notice-bar" style="margin-bottom:12px">✏️ 기존 일정을 수정하고 있어요.</div>' : "") +
      '<div class="sec-title" style="margin-top:0">이 날의 ' + (isDuty ? "당직" : "섬·교육 일정") + " " + dutyItems.length + "건</div>" +
      '<div id="dayList">' + listHtml + "</div>" +
      (isDuty && dutyItems.length && !dayEv ? '<div class="hint" style="margin:-2px 2px 2px">담당자를 바꾸려면 아래 <b>당직자 변경</b>에서 새 담당자를 골라 저장하세요.</div>' : "") +
      msBlock +
      eventBlock +
      formHtml,
    footer: (isDuty && dayEv && !editing && !replacing) ? "" : '<button class="btn" id="schSave">' + (isDuty
      ? (baseEntry ? "담당자 변경 저장" : "당직 등록")
      : (editing ? "수정 저장" : "일정 등록")) + "</button>",
    onMount: root => {
      let picked = typeKeys.indexOf(curType) >= 0 ? curType : (isDuty ? "duty" : "");
      const endWrap = $("#endWrap", root);
      const endInp = $("#schEnd", root);
      const memoInp = $("#schMemo", root);
      /* 🌙⛴️ 1박 섬을 고르면 종료일을 다음 날로 자동 입력합니다.
         사용자가 종료일을 직접 고쳤거나 기존 일정을 수정하는 중이면 덮어쓰지 않습니다. */
      let endTouched = false;
      if (endInp) {
        const markEndTouched = () => { endTouched = true; };
        endInp.addEventListener("change", markEndTouched);
        endInp.addEventListener("input", markEndTouched);
      }
      $$("#schPick button", root).forEach(b => b.addEventListener("click", () => {
        picked = b.dataset.type;
        $$("#schPick button", root).forEach(x => x.classList.toggle("on", x === b));
        const multi = picked === "overnight_island" || picked === "edu";
        if (endWrap) endWrap.style.display = multi ? "" : "none";
        if (endInp && multi) {
          const keep = !!editing || endTouched;
          if (!keep) {
            if (picked === "overnight_island") {
              /* 종료일이 비었거나 시작일과 같으면 다음 날(+1일)로 */
              if (!endInp.value || endInp.value === ds || endInp.value < ds) endInp.value = addDays(ds, 1);
            } else {
              endInp.value = ds;   /* 교육 = 하루 기본값 */
            }
          } else if (endInp.value && endInp.value < ds) {
            endInp.value = ds;
          }
        }
        if (memoInp && !memoInp.value) memoInp.placeholder = MEMO_PH[picked] || "메모를 입력하세요";
      }));
      $$("[data-ms]", root).forEach(btn => btn.addEventListener("click", async () => {
        if (!canManageDuty()) return toast("관리자·당직 관리 권한자만 바꿀 수 있어요");
        const t = btn.dataset.ms;
        const wasOn = msItems.some(x => x.type === t);
        btn.disabled = true;
        try {
          await msToggle(ds, t, !wasOn);
          closeSheet();
          setTimeout(() => openScheduleSheet(ds, target, null, mode), 90);
          toast(STATUS[t].label + (wasOn ? " · 이 날에서 뺐어요" : " · 이 날에 넣었어요"));
        } catch (e) { btn.disabled = false; toast(fbErrMsg(e)); }
      }));
      $$("[data-del]", root).forEach(b => b.addEventListener("click", async () => {
        if (!confirm("이 일정을 삭제할까요?")) return;
        try { await dbDeleteEntry(b.dataset.del); closeSheet(); openScheduleSheet(ds, target, null, mode); toast("일정을 삭제했습니다"); }
        catch (e) { toast(fbErrMsg(e)); }
      }));
      $$("[data-edit]", root).forEach(b => b.addEventListener("click", () => {
        const e = S.duty.find(x => x.id === b.dataset.edit);
        if (e) { closeSheet(); setTimeout(() => openScheduleSheet(ds, e.memberId, e), 100); }
      }));
      const evSave = $("#evSave", root);
      const evTitleInp = $("#evTitle", root);
      let evBusy = false;
      /* 🎈 행사일 등록 — 버튼 · Enter 둘 다 이 함수 하나로 저장합니다 */
      const saveEvent = async () => {
        if (evBusy) return;
        const title = ((evTitleInp && evTitleInp.value) || "").trim();
        if (!title) { if (evTitleInp) evTitleInp.focus(); return toast("행사 이름을 입력해 주세요"); }
        evBusy = true;
        if (evSave) evSave.disabled = true;
        try {
          await dbSaveEvent(ds, title);
          const had = entriesOn(ds).filter(e => e.type === "duty");
          let failed = 0;
          for (const e of had) {
            try { await dbDeleteEntry(e.id); } catch (err) { failed++; }
          }
          closeSheet();
          if (S.tab === "duty") renderDuty();
          toast(failed
            ? "'" + title + "' 행사일은 등록됐지만 당직 " + failed + "건은 취소하지 못했어요"
            : (had.length ? "'" + title + "' · 행사일로 등록하고 그날 당직을 취소했어요" : "'" + title + "' · 행사일로 등록했어요"));
        } catch (e) {
          evBusy = false;
          if (evSave) evSave.disabled = false;
          toast("행사일 저장 실패 — " + fbErrMsg(e));
        }
      };
      if (evSave) evSave.addEventListener("click", saveEvent);
      if (evTitleInp) evTitleInp.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); saveEvent(); }
      });
      const evDel = $("#evDel", root);
      if (evDel) evDel.addEventListener("click", async () => {
        if (!confirm("행사일 지정을 삭제할까요?")) return;
        evDel.disabled = true;
        try {
          await dbDeleteEvent(ds);
          closeSheet();
          if (S.tab === "duty") renderDuty();
          toast("행사일을 삭제했어요 · 당직은 재배정으로 다시 배정할 수 있어요");
        } catch (e) { evDel.disabled = false; toast(fbErrMsg(e)); }
      });
      const saveBtn = $("#schSave", root);
      if (saveBtn) saveBtn.addEventListener("click", async () => {
        /* 안전장치 — 행사명을 써 두고 아래 '담당자 변경 저장'을 누른 경우,
           행사일 등록이 원래 의도일 수 있으므로 한 번 확인합니다(취소하면 당직 변경으로 진행). */
        const typedEv = evTitleInp ? (evTitleInp.value || "").trim() : "";
        if (typedEv && isDuty && confirm("'" + typedEv + "' 행사명을 입력하셨어요.\n이 날을 행사일로 등록하고 당직을 취소할까요?\n\n[취소]를 누르면 행사명은 버리고 담당자 변경만 저장합니다.")) {
          return saveEvent();
        }
        if (!picked) return toast("일정 종류를 골라주세요");
        const who = canAssign ? ($("#schMember", root).value || myUid()) : myUid();
        const mm = memberOf(who) || rosterMember(who);
        const multi = picked === "overnight_island" || picked === "edu";
        let end = multi ? ((endInp && endInp.value) || (picked === "overnight_island" ? addDays(ds, 1) : ds)) : ds;
        if (end < ds) end = ds;
        /* 1박 섬은 최소 다음 날까지 — 시작일과 같은 날로 저장되면 +1일로 보정 */
        if (picked === "overnight_island" && end <= ds) end = addDays(ds, 1);
        const body = {
          startDate: ds, endDate: end, type: picked,
          memberId: who, memberName: mm ? mm.name : (S.user.name || "팀원"),
          memo: memoInp.value.trim()
        };
        $("#schSave", root).disabled = true;
        try {
          await dbSaveEntry(body, baseEntry ? baseEntry.id : null, baseEntry);
          const swapped = isDuty && baseEntry && baseEntry.memberId !== body.memberId;
          closeSheet();
          if (S.tab === "duty") renderDuty();
          toast(swapped
            ? prevName + " → " + (mm ? mm.name : "팀원") + " 님으로 담당자를 바꿨어요"
            : (mm ? mm.name : "팀원") + " · " + STATUS[picked].label + " 일정을 저장했어요");
        } catch (e) { saveBtn.disabled = false; toast(fbErrMsg(e)); }
      });
    }
  });
}

/* 일정 저장 · 삭제 */
async function dbSaveEntry(data, existingId, prevEntry) {
  const newId = data.startDate + "_" + data.memberId + "_" + data.type;
  /* 담당자를 바꾸면 이력 남김 — 누가·언제·누구를 누구로 */
  let extra = {};
  if (prevEntry && data.type === "duty") {
    const changed = !!prevEntry.memberId && prevEntry.memberId !== data.memberId;
    const hist = (Array.isArray(prevEntry.history) ? prevEntry.history : []).slice(-19);
    if (changed) hist.push({ fromName: prevEntry.memberName || "", toName: data.memberName || "", editedByName: (S.user && S.user.name) || "", editedAt: Date.now() });
    extra = {
      history: hist,
      previousMemberName: changed ? (prevEntry.memberName || "") : (prevEntry.previousMemberName || ""),
      updatedByName: changed ? ((S.user && S.user.name) || "") : (prevEntry.updatedByName || ""),
      updatedAt: changed ? Date.now() : (prevEntry.updatedAt || 0)
    };
  }
  const payload = Object.assign({}, data, extra);
  /* 🛡️ 당직은 하루 1명 — 같은 날짜에 남아 있는 다른 당직 항목도 함께 정리 */
  const dupIds = [];
  if (data.type === "duty") {
    (S.duty || []).forEach(x => {
      if (!x || x.type !== "duty") return;
      if (x.id === newId || x.id === existingId) return;
      if (entryStart(x) === data.startDate) dupIds.push(x.id);
    });
  }
  if (S.mode === "demo") {
    demoMutate(d => {
      d.duty = (d.duty || []).filter(x => x.id !== existingId && x.id !== newId && dupIds.indexOf(x.id) < 0);
      d.duty.push(Object.assign({ id: newId, createdAt: Date.now() }, payload));
    });
  } else {
    const { doc, setDoc, deleteDoc, serverTimestamp } = FB.f;
    if (existingId && existingId !== newId) { try { await deleteDoc(doc(FB.db, "duty_schedules", existingId)); } catch (e) {} }
    for (const id of dupIds) { try { await deleteDoc(doc(FB.db, "duty_schedules", id)); } catch (e) {} }
    await setDoc(doc(FB.db, "duty_schedules", newId), Object.assign({}, payload, { createdBy: myUid(), createdAt: serverTimestamp() }));
  }
}
async function dbDeleteEntry(id) {
  if (S.mode === "demo") {
    demoMutate(d => { d.duty = (d.duty || []).filter(x => x.id !== id); });
  } else {
    const { doc, deleteDoc } = FB.f;
    await deleteDoc(doc(FB.db, "duty_schedules", id));
    S.duty = S.duty.filter(x => x.id !== id);
    if (S.tab === "duty") renderDuty();
  }
}

function todayLineHtml() {
  const now = new Date();
  const ds = ymd(now);
  const ev = eventOf(ds);
  const TORDER = ["duty", "overnight_island", "day_island", "edu"];
  const list = entriesOn(ds)
    .filter(e => TORDER.indexOf(e.type) >= 0)
    .sort((a, b) => TORDER.indexOf(a.type) - TORDER.indexOf(b.type));
  const head = '<span class="tday-d">오늘 ' + (now.getMonth() + 1) + "/" + now.getDate() + " (" + DAYS[now.getDay()] + ")</span>";
  let inner = "";
  if (!ev && !list.length) {
    inner = '<span class="tday-none">✨ 오늘 당직·섬·교육 일정 없음</span>';
  } else {
    const chips = [];
    if (ev) chips.push('<span class="tchip ev">🎈 오늘 행사: ' + esc(ev.title) + "</span>");
    const room = ev ? 1 : 2;
    list.slice(0, room).forEach(e => {
      const s = STATUS[e.type] || STATUS.duty;
      chips.push('<span class="tchip ' + s.cls + '" title="' + esc(s.label + " " + e.memberName) + '"><i>' + (s.mini || s.em) + "</i>" + esc(s.short || s.label) + " " + esc(e.memberName) + "</span>");
    });
    const rest = list.length - Math.min(list.length, room);
    if (rest > 0) chips.push('<span class="tchip more">+' + rest + "</span>");

  return '<button type="button" class="tday" id="todayBar" aria-label="오늘의 팀 일정 · 당직 탭 열기">' + head + inner + '<span class="tday-go">›</span></button>';
}

/* =====================================================================
   10-2. 📊 간단 투표 — 공지에 붙는 선택지 투표
   · poll : announcements/{id}.poll = { question, options:[...], multi }
   · 표   : LIVE = announcements/{id}/votes/{uid} { choices:[i], name, updatedAt }
            DEMO = announcements[i].votes[uid] = [i]
   ===================================================================== */
function pollOf(a) {
  const p = a && a.poll;
  if (!p || !Array.isArray(p.options) || p.options.length < 2) return null;
  return { question: p.question || a.title || "", options: p.options.slice(0, 6), multi: !!p.multi };
}
function votesOf(id) { return S.votes[id] || {}; }
function voteChoices(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return Array.isArray(v.choices) ? v.choices : [];
}
function pollPeople(id) { return Object.keys(votesOf(id)).length; }
function pollCounts(id) {
  const a = S.announcements.find(x => x.id === id);
  const p = pollOf(a);
  const cnt = p ? new Array(p.options.length).fill(0) : [];
  const votes = votesOf(id);
  Object.keys(votes).forEach(uid => voteChoices(votes[uid]).forEach(i => { if (i >= 0 && i < cnt.length) cnt[i]++; }));
  return cnt;
}
function voterName(id, uid) {
  const m = memberOf(uid);
  const v = votesOf(id)[uid];
  return (m && m.name) || (v && v.name) || "팀원";
}
function votersAt(id, idx) {
  const votes = votesOf(id);
  return Object.keys(votes)
    .filter(uid => voteChoices(votes[uid]).indexOf(idx) >= 0)
    .map(uid => voterName(id, uid))
    .sort((a, b) => a.localeCompare(b));
}
function pctOf(n, total) { return total ? Math.round((n / total) * 100) : 0; }

/* 목록 카드용 — 배지 + 선택지별 미니 막대 + 내 선택 */
function pollMiniHtml(a) {
  const p = pollOf(a);
  if (!p) return "";
  const cnt = pollCounts(a.id);
  const people = pollPeople(a.id);
  const mine = voteChoices(votesOf(a.id)[myUid()]);
  const rows = p.options.map((o, i) =>
    '<div class="pm' + (mine.indexOf(i) >= 0 ? " mine" : "") + '">' +
      '<span class="nm">' + (mine.indexOf(i) >= 0 ? "✓ " : "") + esc(o) + "</span>" +
      '<span class="bb"><i style="width:' + pctOf(cnt[i], people) + '%"></i></span>' +
      '<span class="vv">' + cnt[i] + "</span>" +
    "</div>").join("");
  return '<div class="pollbadge">📊 투표 진행중 · ' + people + '명 참여' +
      '<span class="pb-more">' + (mine.length ? "내 선택 " + mine.map(i => esc(p.options[i])).join(", ") : "눌러서 참여") + "</span></div>" +
    '<div class="pollmini">' + rows + "</div>";
}

/* 상세 시트용 — 선택지 버튼 · 득표수/비율 막대 · 참여자 이름 */
function pollDetailHtml(a) {
  const p = pollOf(a);
  if (!p) return "";
  const cnt = pollCounts(a.id);
  const people = pollPeople(a.id);
  const mine = voteChoices(votesOf(a.id)[myUid()]);
  const opts = p.options.map((o, i) => {
    const who = votersAt(a.id, i);
    return '<button type="button" class="pollopt' + (mine.indexOf(i) >= 0 ? " on" : "") + '" data-vote="' + i + '">' +
        '<span class="po-t"><span class="chk' + (p.multi ? "" : " solo") + '">✓</span>' +
          '<span class="lb">' + esc(o) + '</span><span class="ct">' + cnt[i] + '표 · ' + pctOf(cnt[i], people) + '%</span></span>' +
        '<span class="bar"><i style="width:' + pctOf(cnt[i], people) + '%"></i></span>' +
        (who.length ? '<span class="who">' + esc(who.join(", ")) + "</span>" : '<span class="who">아직 없음</span>') +
      "</button>";
  }).join("");
  const myTx = mine.length
    ? "내 선택: <b>" + esc(mine.map(i => p.options[i]).join(", ")) + "</b> · 다시 누르면 취소"
    : (p.multi ? "여러 개를 고를 수 있어요" : "하나만 고를 수 있어요") + " · 선택지를 눌러 참여하세요";
  return '<div class="pollbox" id="pollBox">' +
      '<div class="ph"><b>📊 ' + esc(p.question) + '</b><span class="pn">' + people + "명 참여" + (p.multi ? "<br>복수 선택" : "") + "</span></div>" +
      opts +
      '<div class="pf">' + myTx + "</div>" +
    "</div>";
}

/* ---------- 🔍 공지 검색 (제목·본문·작성자) ---------- */
function noticeHit(a, q) {
  if (!q) return true;
  const s = q.toLowerCase();
  return String(a.title || "").toLowerCase().indexOf(s) >= 0
    || String(a.body || "").toLowerCase().indexOf(s) >= 0
    || String(a.author_name || "").toLowerCase().indexOf(s) >= 0;
}
function filteredNotices() {
  const f = S.noticeFilter, q = String(S.noticeQuery || "").trim();
  let list = S.announcements.slice();
  if (f === "pin") list = list.filter(a => a.is_pinned);
  if (f === "imp") list = list.filter(a => a.is_important);
  if (f === "unread") list = list.filter(a => !isRead(a.id));
  if (q) list = list.filter(a => noticeHit(a, q));
  list.sort((a, b) => ((b.is_pinned ? 1 : 0) - (a.is_pinned ? 1 : 0)) || (b.createdAt - a.createdAt));
  return list;
}
function noticeListHtml(list) {
  const q = String(S.noticeQuery || "").trim();
  if (!list.length) {
    return '<div class="empty"><span>' + (q ? "🔍" : "📭") + "</span>" +
      (q ? "‘<b>" + esc(q) + "</b>’에 해당하는 공지가 없습니다." : (S.noticeFilter === "all" ? "아직 공지가 없습니다." : "해당하는 공지가 없습니다.")) + "</div>";
  }
  return list.map(noteCard).join("");
}

  v.innerHTML =
    '<div class="vhead"><div><h2>공지사항</h2><div class="sub" id="noteSub">' +
      (q ? "‘" + esc(q) + "’ 검색 결과 " + list.length + "건" : (unread ? "안 읽은 공지 " + unread + "건" : "모든 공지를 확인했어요")) + "</div></div>" +
      '<button class="upbtn" id="btnWriteNote">' + ICON.plus + " 작성</button></div>" +
    todayLineHtml() +
    '<div class="searchbar' + (S.noticeQuery ? " has-q" : "") + '" id="noteSearchBar">' +
      '<span class="sicon">🔍</span>' +
      '<input type="search" id="noteSearch" value="' + esc(S.noticeQuery || "") + '" placeholder="공지 제목·내용 검색" aria-label="공지 제목·내용 검색" autocomplete="off">' +
      '<button type="button" class="sclear" id="noteSearchClear" aria-label="검색어 지우기">✕</button>' +
    "</div>" +
    '<div class="chips">' +
      ["all:전체", "pin:📌 고정", "imp:🔴 필독", "unread:안 읽음"].map(s => {
        const [k, lb] = s.split(":");
        return '<button class="chip' + (f === k ? " on" : "") + '" data-nfilter="' + k + '">' + lb + "</button>";
      }).join("") +

  $("#btnWriteNote").addEventListener("click", () => openNoteEditor(null));
  const tb = $("#todayBar");
  if (tb) tb.addEventListener("click", () => setTab("duty"));
  $$("[data-nfilter]", v).forEach(b => b.addEventListener("click", () => { S.noticeFilter = b.dataset.nfilter; renderNotices(); }));

  /* 실시간 검색 — 목록만 다시 그려서 입력 중 포커스·커서를 잃지 않게 합니다 */
  const inp = $("#noteSearch", v);
  const bar = $("#noteSearchBar", v);
  const bindCards = () => $$("[data-note]", $("#noteList", v) || v).forEach(b => b.addEventListener("click", () => openNote(b.dataset.note)));
  bindCards();
  const applyQ = () => {
    S.noticeQuery = inp.value;
    bar.classList.toggle("has-q", !!inp.value);
    const l = filteredNotices();
    $("#noteList", v).innerHTML = noticeListHtml(l);
    const sub = $("#noteSub", v);
    if (sub) {
      const qq = String(inp.value || "").trim();
      sub.textContent = qq ? "‘" + qq + "’ 검색 결과 " + l.length + "건"
        : (unread ? "안 읽은 공지 " + unread + "건" : "모든 공지를 확인했어요");
    }
    bindCards();
  };
  inp.addEventListener("input", applyQ);
  inp.addEventListener("search", applyQ);
  inp.addEventListener("keydown", e => {
    if (e.key === "Escape") { inp.value = ""; applyQ(); }
  });
  $("#noteSearchClear", v).addEventListener("click", () => { inp.value = ""; applyQ(); inp.focus(); });
}

  return '<article class="note ' + (a.is_pinned ? "pinned " : "") + (a.is_important ? "important" : "") + '" data-note="' + a.id + '">' +

      const bindVotes = scope => $$("[data-vote]", scope).forEach(btn => btn.addEventListener("click", async () => {

          if (opts.length <= 2) return;

      $("#ntAddOpt", root).addEventListener("click", () => {

      });

          closeSheet(); toast(a ? "공지를 수정했습니다" : "공지를 등록했습니다");
        } catch (e) { $("#ntSave", root).disabled = false; toast(fbErrMsg(e)); }
      });
    }
  });
}

/* ---- 공지 데이터 계층 ---- */
async function dbCreateNote(data) {
  const doc = { title: data.title, body: data.body, is_pinned: !!data.is_pinned, is_important: !!data.is_important,
    poll: data.poll || null,
    author_id: myUid(), author_name: S.user.name, createdAt: Date.now() };
  if (S.mode === "demo") {
    demoMutate(d => { d.announcements.unshift(Object.assign({ id: uid(), reads: [], comments: [], votes: {} }, doc)); });
  } else {
    const { collection, addDoc, serverTimestamp } = FB.f;
    await addDoc(collection(FB.db, "announcements"), Object.assign({}, doc, { createdAt: serverTimestamp(), author_uid: myUid() }));
  }
}
async function dbUpdateNote(id, data) {
  if (S.mode === "demo") {
    demoMutate(d => { const a = d.announcements.find(x => x.id === id); if (a) Object.assign(a, data, { updatedAt: Date.now() }); });
  } else {
    const { doc, updateDoc } = FB.f;
    await updateDoc(doc(FB.db, "announcements", id), Object.assign({}, data, { updatedAt: Date.now() }));
  }
}
async function dbDeleteNote(id) {
  if (S.mode === "demo") demoMutate(d => { d.announcements = d.announcements.filter(x => x.id !== id); });
  else { const { doc, deleteDoc } = FB.f; await deleteDoc(doc(FB.db, "announcements", id)); }
}
async function dbMarkRead(id) {
  if ((S.reads[id] || []).indexOf(myUid()) >= 0) return;
  if (S.mode === "demo") {
    demoMutate(d => { const a = d.announcements.find(x => x.id === id); if (a) { a.reads = a.reads || []; a.reads.push(myUid()); } });
  } else {
    const { doc, setDoc, serverTimestamp } = FB.f;
    await setDoc(doc(FB.db, "announcements", id, "reads", myUid()), { uid: myUid(), name: S.user.name, at: serverTimestamp() });
    S.reads[id] = (S.reads[id] || []).concat([myUid()]);
    renderNotices(); updateDots();
  }
}
async function dbAddNoteComment(id, body) {
  const c = { id: uid(), author_id: myUid(), author_name: S.user.name, body: body, createdAt: Date.now() };
  if (S.mode === "demo") {
    demoMutate(d => { const a = d.announcements.find(x => x.id === id); if (a) { a.comments = a.comments || []; a.comments.push(c); } });
  } else {
    const { collection, addDoc, serverTimestamp } = FB.f;
    await addDoc(collection(FB.db, "announcements", id, "comments"), {
      author_id: myUid(), author_uid: myUid(), author_name: S.user.name, body: body, createdAt: serverTimestamp()
    });
    S.comments[id] = (S.comments[id] || []).concat([c]);
    renderNotices(); updateDots();
  }
}
/* 📊 투표 — 같은 선택지를 다시 누르면 취소, 복수 선택은 토글 */
async function dbVote(id, idx) {
  const a = S.announcements.find(x => x.id === id);
  const p = pollOf(a);
  if (!p || !(idx >= 0 && idx < p.options.length)) return;
  const cur = voteChoices(votesOf(id)[myUid()]).slice();
  let next;
  if (p.multi) next = cur.indexOf(idx) >= 0 ? cur.filter(i => i !== idx) : cur.concat([idx]).sort((x, y) => x - y);
  else next = (cur.length === 1 && cur[0] === idx) ? [] : [idx];
  if (S.mode === "demo") {
    demoMutate(d => {
      const an = d.announcements.find(x => x.id === id);
      if (!an) return;
      an.votes = an.votes || {};
      if (next.length) an.votes[myUid()] = next; else delete an.votes[myUid()];
    });
    return;
  }
  const { doc, setDoc, deleteDoc, serverTimestamp } = FB.f;
  if (next.length) {
    await setDoc(doc(FB.db, "announcements", id, "votes", myUid()),
      { choices: next, name: S.user.name, updatedAt: serverTimestamp() });
  } else {
    await deleteDoc(doc(FB.db, "announcements", id, "votes", myUid()));
  }
  S.votes[id] = Object.assign({}, S.votes[id] || {});
  if (next.length) S.votes[id][myUid()] = { choices: next, name: S.user.name };
  else delete S.votes[id][myUid()];
  renderNotices();
}

const REST_AREAS = {

/* 🍽️ 지역 — 인천 행정구역 개편(영종구·제물포구)에 맞춘 분류. 음식 종류 자동 분류는 없앴습니다. */
const REST_REGIONS = ["영종구", "제물포구", "옹진군", "기타"];
const REST_REGION_EM = { "영종구": "✈️", "제물포구": "⚓", "옹진군": "⛴️", "기타": "🗺️" };
/* 주소에서 지역을 알아냅니다. (옹진군 → 영종 지역 → 제물포권 순서) */
const REST_RS_YEONGJONG = ["운서", "운남", "운북", "중산", "을왕", "남북", "덕교", "무의", "영종"];
const REST_RS_JEMULPO = ["신포", "신흥", "선린", "북성", "송월", "연안", "항동", "율목", "도원", "인현",
  "내동", "경동", "중앙동", "관동", "해안동", "사동", "답동", "송학동", "전동", "월미"];
function restRegionFromAddress(addr) {
  const a = String(addr == null ? "" : addr).replace(/[,·]/g, " ").replace(/\s+/g, " ").trim();

async function kakaoKeywordSearch(q, key) {
  const url = "https://dapi.kakao.com/v2/local/search/keyword.json?query=" + encodeURIComponent(q) + "&size=8";
  const rr = await fetch(url, { headers: { Authorization: "KakaoAK " + key } });
  if (rr.status === 401 || rr.status === 403) { const e = new Error("kakao auth"); e.code = "kakao-auth"; throw e; }

  const js = await rr.json();
  const docs = (js && Array.isArray(js.documents)) ? js.documents : [];

const FALLBACK_TILES = [
  { url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    attr: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> · Esri, HERE, Garmin, &copy; OpenStreetMap' },
  { url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    attr: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }
];
function addFallbackTiles(L, map) {
  let idx = 0, errors = 0, layer = null;
  const add = () => {
    const t = FALLBACK_TILES[idx];
    layer = L.tileLayer(t.url, { maxZoom: 19, attribution: t.attr });
    layer.on("tileerror", () => {
      if (++errors >= 3 && idx < FALLBACK_TILES.length - 1) {
        idx++; errors = 0;
        try { map.removeLayer(layer); } catch (e) {}
        add();
      }
    });
    layer.addTo(map);
  };
  add();
  return layer;
}

function loadKakaoMaps() {
  if (window.kakao && window.kakao.maps && window.kakao.maps.Map) {
    return new Promise(resolve => window.kakao.maps.load(() => resolve(window.kakao.maps)));
  }
  if (RT.kLoading) return RT.kLoading;
  RT.kLoading = new Promise((resolve, reject) => {
    const key = kakaoJsKey();
    if (!key) { reject(new Error("kakao js key empty")); return; }
    let settled = false;
    const done = (fn, val) => { if (settled) return; settled = true; clearTimeout(timer); fn(val); };
    const fail = err => { RT.kFailedAt = Date.now(); done(reject, err); };
    const timer = setTimeout(() => fail(new Error("kakao sdk timeout")), 8000);
    const s = document.createElement("script");
    s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + encodeURIComponent(key) + "&autoload=false";
    s.async = true;
    s.onload = () => {
      if (!(window.kakao && window.kakao.maps && window.kakao.maps.load)) return fail(new Error("kakao sdk unavailable"));
      try {
        window.kakao.maps.load(() => done(resolve, window.kakao.maps));
      } catch (e) { fail(new Error("kakao maps error")); }
    };
    s.onerror = () => fail(new Error("kakao sdk load error"));
    document.head.appendChild(s);
  });
  RT.kLoading.catch(() => { RT.kLoading = null; });   /* 실패는 캐시하지 않고, 2분 지나면 다시 시도 */
  return RT.kLoading;
