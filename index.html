  renderCurrent();
  updateDots();
}
/* ---------- 부팅(로그인 상태 확인) 화면 ----------
   앱을 켜자마자 로그인 폼이 먼저 번쩍이면 '로그인이 풀렸다'고 느끼게 됩니다.
   첫 인증 판정이 끝날 때까지 이 화면을 유지하고, 오래 걸리면 다시 시도할 수 있게 합니다. */
let bootDone = false, bootTimer = null, bootBound = false;
function bindBootOnce() {
  if (bootBound) return; bootBound = true;
  const rb = $("#bootRetryBtn");
  if (rb) rb.addEventListener("click", () => location.reload());
  const lb = $("#bootLoginBtn");
  if (lb) lb.addEventListener("click", () => { endBoot(); showAuthLogin(); });
}
function bootOnly() {
  $$(".screen").forEach(s => s.classList.toggle("active", s.id === "scr-boot"));
  bindBootOnce();
}
function showBoot(msg) {
  if (bootDone) return;
  if (!$("#scr-boot")) return;
  bootOnly();
  if (msg) { const m = $("#bootMsg"); if (m) m.textContent = msg; }
  if (!bootTimer) bootTimer = setTimeout(bootSlow, 9000);
}
function bootSlow() {
  bootTimer = null;
  if (bootDone) return;
  const sp = $("#bootSpin"); if (sp) sp.classList.add("hidden");
  const r = $("#bootRetry"); if (r) r.classList.remove("hidden");
  const m = $("#bootMsg"); if (m) m.textContent = "연결이 조금 느립니다";
  const rm = $("#bootRetryMsg"); if (rm) rm.innerHTML = "휴대폰 네트워크를 확인한 뒤 다시 시도해 주세요.";
}
/* 세션은 살아 있는데 프로필을 못 불러온 경우 — 로그인 화면으로 보내지 않습니다 */
function bootNetFail(msg) {
  bootDone = false;
  clearTimeout(bootTimer); bootTimer = null;
  if (!$("#scr-boot")) { showAuthLogin(); if (msg) toast(msg); return; }
  bootOnly();
  const sp = $("#bootSpin"); if (sp) sp.classList.add("hidden");
  const r = $("#bootRetry"); if (r) r.classList.remove("hidden");
  const m = $("#bootMsg"); if (m) m.textContent = "로그인은 그대로 유지돼요";
  const rm = $("#bootRetryMsg"); if (rm) rm.innerHTML = (msg ? esc(msg) + "<br>" : "") + "네트워크를 확인한 뒤 다시 시도해 주세요.";
}
function endBoot() {
  bootDone = true;
  clearTimeout(bootTimer); bootTimer = null;
  const el = $("#scr-boot"); if (el) el.classList.remove("active");
}

function show(id) {
  if (id !== "scr-boot") endBoot();
  $$(".screen").forEach(s => s.classList.toggle("active", s.id === id));
}
function showAuthLogin() {
  show("scr-auth");
  $$("#authSeg button").forEach(x => x.classList.toggle("on", x.dataset.mode === "login"));
  $("#formLogin").classList.remove("hidden");
  $("#formSignup").classList.add("hidden");
  $("#loginErr").textContent = "";
  $("#signupErr").textContent = "";
}

let pendingPoll = null;
function showPending() {
  show("scr-pending");
  clearInterval(pendingPoll);
  if (S.mode === "live") {
    pendingPoll = setInterval(async () => {
      try {
        const { doc, getDoc } = FB.f;
        const snap = await getDoc(doc(FB.db, "users", myUid()));
        if (snap.exists() && snap.data().status === "approved") {
          clearInterval(pendingPoll);
          await loadProfile(FB.auth.currentUser);

    "<span>사번 " + esc(u.empId || "-") + "</span><br>" +

function route() {
  clearInterval(pendingPoll);
  if (!S.user) { showAuthLogin(); return; }
  if (S.user.status !== "approved") { showPending(); return; }
  show("scr-main");
  $("#hdrSub").textContent = S.team;
  renderMyAvatar();
  $("#modeBadge").textContent = S.mode === "live" ? "실시간 연결" : "미리보기 모드";
  $("#modeBadge").className = "badge" + (S.mode === "live" ? " live" : "");
  if (!S.seenChatAt) S.seenChatAt = Date.now();
  renderAll();
  /* 매월 24일 00:00(KST) 이후 첫 접속이면 다음 달 당직을 자동 배정 */

function demoLogin(empId, pw) {
  const d = demoGet();
  const key = normEmp(empId);
  const u = d.users.find(x => normEmp(x.empId) === key) || d.users.find(x => String(x.email || "").toLowerCase() === String(empId || "").toLowerCase());
  if (!u) throw new Error("등록되지 않은 사번입니다. 아래 체험 버튼을 이용해 보세요.");
  if (String(u.pw) !== String(pw)) throw new Error("비밀번호가 맞지 않습니다. (체험 계정 비밀번호: 123456)");
  localStorage.setItem(SESSION_KEY, u.uid);
  S.user = Object.assign({}, u);
  syncDemo();
  route();
}

function demoSignup(name, empId, pw) {
  const d = demoGet();
  const key = normEmp(empId);
  if (d.users.some(x => normEmp(x.empId) === key || String(x.email || "").toLowerCase() === empToEmail(empId))) throw new Error("이미 가입된 사번입니다.");
  const u = { uid: "u_" + uid(), empId: empId, email: empToEmail(empId), pw: pw, name: name, position: "", role: "member", canManageDuty: false, status: "pending", avatarData: "", createdAt: Date.now(), workStatus: "", statusNote: "", statusUpdatedAt: Date.now() };

}

/* 가벼운 비밀번호(4~5자리) — Firebase Auth 는 6자 미만을 거부(auth/weak-password)합니다.
   · 6자 이상: 그대로 넘겨 기존 계정이 100% 동일하게 로그인됩니다.
   · 4~5자: 고정 접미사 PW_SUFFIX 를 붙여 6자 이상으로 만들어 넘깁니다. (가입·로그인 모두 같은 규칙)
   · 4자 미만: 그대로 넘겨 Firebase 가 거절하게 둡니다. */
const PW_SUFFIX = "__th";
function authPassword(pw) {
  const s = String(pw == null ? "" : pw);
  return (s.length >= 4 && s.length < 6) ? s + PW_SUFFIX : s;
}

async function doLogin(empId, pw) {
  if (S.mode === "demo") { demoLogin(empId, pw); return; }
  const { signInWithEmailAndPassword } = FB.a;
  await signInWithEmailAndPassword(FB.auth, empToEmail(empId), authPassword(pw));
}
/* 회원가입 — 직책은 받지 않고 빈 값("")으로 저장합니다.
   직책은 가입 후 [내 정보]·[팀원관리]에서 관리자가 설정합니다. */
async function doSignup(name, empId, pw) {
  if (S.mode === "demo") { demoSignup(name, empId, pw); return; }
  signingUp = true;
  try {
    const email = empToEmail(empId);
    const { createUserWithEmailAndPassword, updateProfile } = FB.a;
    const cred = await createUserWithEmailAndPassword(FB.auth, email, authPassword(pw));
    try { await updateProfile(cred.user, { displayName: name }); } catch (e) { /* noop */ }
    const { doc, setDoc, serverTimestamp, getDoc } = FB.f;
    const ref = doc(FB.db, "users", cred.user.uid);
    const existing = await getDoc(ref);   // trigger 가 먼저 만들었을 수 있음
    if (!existing.exists()) {
      await setDoc(ref, Object.assign(newUserDoc(empId, email, name, ""), {
        workStatus: "", statusNote: "", statusUpdatedAt: serverTimestamp(), createdAt: serverTimestamp()
      }));
    }
    signingUp = false;
    await loadProfile(cred.user);
  } catch (e) { signingUp = false; throw e; }
}
async function loadProfile(fbUser) {
  const { doc, getDoc, setDoc, serverTimestamp } = FB.f;
  const ref = doc(FB.db, "users", fbUser.uid);
  let snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, Object.assign(newUserDoc(
      emailToEmp(fbUser.email), fbUser.email || "",
      fbUser.displayName || String(fbUser.email || "").split("@")[0], ""), {
      workStatus: "", statusNote: "", statusUpdatedAt: serverTimestamp(), createdAt: serverTimestamp()
    }));
    snap = await getDoc(ref);
  }
  S.user = Object.assign({ uid: fbUser.uid }, snap.data());
  if (typeof S.user.avatarData !== "string") S.user.avatarData = "";
  if (S.user.status === "approved") { startSubs(); route(); }
  else { showPending(); }
}
const isNetErr = e => {
  const c = (e && e.code) || "";
  if (c === "unavailable" || c === "auth/network-request-failed" || c === "auth/timeout" || c === "deadline-exceeded") return true;
  try { return typeof navigator !== "undefined" && navigator.onLine === false; } catch (err) { return false; }
};
async function onAuthState(fbUser) {
  FB.user = fbUser;
  if (signingUp) { endBoot(); return; }
  if (!fbUser) {
    S.user = null; stopSubs(); isSubbed = false; showAuthLogin(); return;
  }
  /* 프로필 조회는 네트워크에 기대므로 몇 번 더 시도합니다.
     로그인 자체는 살아 있으니, 조회가 잠깐 실패해도 로그인 화면으로 보내지 않습니다. */
  for (let i = 0; i < 3; i++) {
    try { await loadProfile(fbUser); return; }
    catch (e) {
      if (isNetErr(e)) {
        if (i < 2) { showBoot("연결을 다시 확인하는 중…"); await sleep(500 * (i + 1)); continue; }
        bootNetFail(fbErrMsg(e)); return;
      }
      toast(fbErrMsg(e)); showAuthLogin(); return;
    }
  }
}
async function doLogout() {
  if (!confirm("로그아웃할까요?")) return;
  if (S.mode === "demo") {
    localStorage.removeItem(SESSION_KEY);
    S.user = null; showAuthLogin(); return;
  }
  try { await FB.a.signOut(FB.auth); } catch (e) { toast(fbErrMsg(e)); }
  stopSubs(); isSubbed = false; S.user = null; showAuthLogin();
}

/* =====================================================================
   16. 실시간 구독
   ===================================================================== */
let isSubbed = false;
function stopSubs() {
  S.subs.forEach(u => { try { u(); } catch (e) {} });
  S.subs = []; S.commentSubs = {};
}
function startSubs() {
  if (S.mode !== "live" || !FB.ready) return;
  if (isSubbed) return;
  isSubbed = true;
  stopSubs();
  const { collection, query, orderBy, limit, onSnapshot, doc } = FB.f;

  S.subs.push(onSnapshot(collection(FB.db, "users"), snap => {
    S.members = snap.docs.map(d => {
      const v = d.data() || {};
      return { uid: d.id, empId: v.empId || emailToEmp(v.email), email: v.email || "", name: v.name || "(이름 없음)", position: v.position || "",
        role: v.role || "member", status: v.status || "pending", canManageDuty: v.canManageDuty === true, createdAt: toMs(v.createdAt),
        avatarData: v.avatarData || "",
        workStatus: v.workStatus || "", statusNote: v.statusNote || "", statusUpdatedAt: toMs(v.statusUpdatedAt) };
    });
    const me = memberOf(myUid());
    if (me) { S.user = Object.assign({}, S.user, { name: me.name, position: me.position, role: me.role, status: me.status, canManageDuty: me.canManageDuty, avatarData: me.avatarData, workStatus: me.workStatus, statusNote: me.statusNote }); }
    LOADED.members = true;
    if (S.user && S.user.status === "approved") renderAll();
    else if (S.user && S.user.status === "pending" && $("#scr-pending").classList.contains("active")) { route(); }
    autoAssignNextMonth();
  }, e => console.warn("users:", e && e.code)));

  S.subs.push(onSnapshot(query(collection(FB.db, "announcements"), orderBy("createdAt", "desc")), snap => {
    S.announcements = snap.docs.map(d => {
      const v = d.data() || {};
      return { id: d.id, title: v.title || "", body: v.body || "", is_pinned: !!v.is_pinned, is_important: !!v.is_important,
        author_id: v.author_id || v.author_uid || "", author_name: v.author_name || "", createdAt: toMs(v.createdAt),
        poll: (v.poll && Array.isArray(v.poll.options) && v.poll.options.length >= 2)
          ? { question: v.poll.question || v.title || "", options: v.poll.options.map(String).slice(0, 6), multi: !!v.poll.multi }
          : null };
    });
    snap.docs.forEach(d => subExtras(d.id));
    if (S.tab === "notices") renderNotices();
    updateDots();
  }, e => console.warn("announcements:", e && e.code)));

  S.subs.push(onSnapshot(collection(FB.db, "duty_schedules"), snap => {
    S.duty = snap.docs.map(d => {
      const v = d.data() || {};
      return { id: d.id, startDate: v.startDate || v.duty_date || "", endDate: v.endDate || v.startDate || v.duty_date || "",
        type: v.type || "duty", memberId: v.memberId || v.member_id || "", memberName: v.memberName || v.member_name || "",
        memo: v.memo || "", createdAt: toMs(v.createdAt),
        history: Array.isArray(v.history) ? v.history : [],
        previousMemberName: v.previousMemberName || "", updatedByName: v.updatedByName || "",
        updatedAt: v.updatedAt ? toMs(v.updatedAt) : 0 };
    });
    LOADED.duty = true;
    if (S.tab === "duty") renderDuty();
    autoAssignNextMonth();
  }, e => console.warn("duty:", e && e.code)));

  S.subs.push(onSnapshot(doc(FB.db, "duty_roster_config", "config"), snap => {
    applyRosterDoc(snap.exists() ? (snap.data() || {}) : {});
  }, e => console.warn("roster:", e && e.code)));

  S.subs.push(onSnapshot(collection(FB.db, "team_events"), snap => {
    S.events = snap.docs.map(d => {
      const v = d.data() || {};
      return { id: d.id, date: v.date || d.id, title: v.title || "", createdAt: toMs(v.createdAt) };
    });
    if (S.tab === "duty") renderDuty();
  }, e => console.warn("events:", e && e.code)));

  S.subs.push(onSnapshot(query(collection(FB.db, "photos"), orderBy("createdAt", "desc"), limit(60)), snap => {
    S.photos = snap.docs.map(d => {
      const v = d.data() || {};
      return { id: d.id, imageData: v.imageData || "", caption: v.caption || "", folder: typeof v.folder === "string" ? v.folder : "", tag: v.tag || "", author_id: v.author_id || v.author_uid || "",
        author_name: v.author_name || "", likes: v.likes || [], comments: v.comments || [], createdAt: toMs(v.createdAt) };
    });
    if (S.tab === "photos") renderPhotos();
  }, e => console.warn("photos:", e && e.code)));

  /* 🍽️ 맛집 공유 지도 */
  S.subs.push(onSnapshot(query(collection(FB.db, "restaurants"), orderBy("createdAt", "desc"), limit(100)), snap => {
    S.restaurants = snap.docs.map(d => {
      const v = d.data() || {};
      return { id: d.id, name: v.name || "", area: v.area || "", region: v.region || "", cat: v.cat || "", category: v.category || "", menu: v.menu || "",
        review: v.review || "", rating: Number(v.rating) || 0,
        lat: (v.lat == null || v.lat === "") ? null : Number(v.lat),
        lng: (v.lng == null || v.lng === "") ? null : Number(v.lng),
        address: v.address || "", author_id: v.author_id || v.author_uid || "", author_name: v.author_name || "",
        likes: Array.isArray(v.likes) ? v.likes : [], createdAt: toMs(v.createdAt) };
    });
    if (S.tab === "rest") renderRest();
  }, e => console.warn("restaurants:", e && e.code)));

  S.subs.push(onSnapshot(query(collection(FB.db, "chat_messages"), orderBy("createdAt", "asc"), limit(300)), snap => {
    S.messages = snap.docs.map(d => {
      const v = d.data() || {};
      return { id: d.id, author_id: v.author_id || v.author_uid || "", author_name: v.author_name || "", body: v.body || "", createdAt: toMs(v.createdAt) };
    });
    renderMessages(); updateDots();
  }, e => console.warn("chat:", e && e.code)));
}
/* 당직 명단·팀 이름 문서 반영 — 모든 팀원이 같은 값을 실시간으로 봅니다 ------------------ */
function applyRosterDoc(v) {
  const d = v || {};
  S.roster = {
    excluded: Array.isArray(d.excluded) ? d.excluded : [],
    customMembers: Array.isArray(d.customMembers) ? d.customMembers : [],
    msOff: Array.isArray(d.msOff) ? d.msOff : [],
    teamName: typeof d.teamName === "string" ? d.teamName.trim().slice(0, 20) : "",
    kakaoRestKey: typeof d.kakaoRestKey === "string" ? d.kakaoRestKey.trim().slice(0, 100) : "",
    kakaoJsKey: typeof d.kakaoJsKey === "string" ? d.kakaoJsKey.trim().slice(0, 100) : "",
    photoFolders: Array.isArray(d.photoFolders) ? d.photoFolders.filter(f => f && typeof f.name === "string") : []
  };
  LOADED.roster = true;
  /* 관리자가 바꾼 팀 이름이 오면 상단 헤더·설정·대화방을 바로 갱신 */
  if (S.roster.teamName) setTeamName(S.roster.teamName);
  if (S.tab === "duty") renderDuty();
  if (S.tab === "team") renderTeam();
  if (S.tab === "photos") renderPhotos();
  autoAssignNextMonth();
}

function subExtras(id) {
  if (S.commentSubs[id]) return;
  const { collection, onSnapshot } = FB.f;
  const cu = onSnapshot(collection(FB.db, "announcements", id, "comments"), s => {
    S.comments[id] = s.docs.map(d => {
      const v = d.data() || {};
      return { id: d.id, author_id: v.author_id || v.author_uid || "", author_name: v.author_name || "", body: v.body || "", createdAt: toMs(v.createdAt) };
    });
    if (S.tab === "notices") renderNotices();
  }, e => console.warn("cmt:", e && e.code));
  const ru = onSnapshot(collection(FB.db, "announcements", id, "reads"), s => {
    S.reads[id] = s.docs.map(d => d.id);
    if (S.tab === "notices") renderNotices();
    updateDots();
  }, e => console.warn("reads:", e && e.code));
  /* 📊 투표 — votes/{uid} 를 실시간 구독해 모든 팀원 화면에 즉시 집계 */
  const vu = onSnapshot(collection(FB.db, "announcements", id, "votes"), s => {
    const m = {};
    s.docs.forEach(d => {
      const v = d.data() || {};
      const ch = Array.isArray(v.choices) ? v.choices.map(Number).filter(n => !isNaN(n)) : [];
      if (ch.length) m[d.id] = { choices: ch, name: v.name || "" };
    });
    S.votes[id] = m;
    if (S.tab === "notices") renderNotices();
  }, e => console.warn("votes:", e && e.code));
  S.commentSubs[id] = [cu, ru, vu];
  S.subs.push(cu, ru, vu);
}

function demoMutate(fn) {

function bindGlobal() {
  /* 로그인 / 회원가입 탭 */
  $$("#authSeg button").forEach(b => b.addEventListener("click", () => {
    $$("#authSeg button").forEach(x => x.classList.toggle("on", x === b));
    const login = b.dataset.mode === "login";
    $("#formLogin").classList.toggle("hidden", !login);
    $("#formSignup").classList.toggle("hidden", login);
  }));

  $("#formLogin").addEventListener("submit", async e => {
    e.preventDefault();
    const emp = $("#liEmp").value.trim(), pw = $("#liPw").value;
    $("#loginErr").textContent = "";
    if (!emp || !pw) { $("#loginErr").textContent = "사번과 비밀번호를 입력해 주세요."; return; }
    const b = $("#btnLogin"); b.disabled = true; b.textContent = "로그인 중…";
    try { await doLogin(emp, pw); }
    catch (err) { $("#loginErr").textContent = S.mode === "demo" ? err.message : fbErrMsg(err); }
    finally { b.disabled = false; b.textContent = "로그인"; }
  });

  $("#formSignup").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#suName").value.trim(), emp = $("#suEmp").value.trim();
    const pw = $("#suPw").value;
    $("#signupErr").textContent = "";
    if (!name) { $("#signupErr").textContent = "이름을 입력해 주세요."; return; }
    if (!/^[0-9A-Za-z_-]{2,20}$/.test(emp)) { $("#signupErr").textContent = "사번은 영문·숫자 2~20자로 입력해 주세요."; return; }
    if (!pw || pw.length < 4) { $("#signupErr").textContent = "비밀번호는 4자 이상이어야 합니다."; return; }
    const b = $("#btnSignup"); b.disabled = true; b.textContent = "가입 중…";
    try { await doSignup(name, emp, pw); $("#formSignup").reset(); }
    catch (err) { $("#signupErr").textContent = S.mode === "demo" ? err.message : fbErrMsg(err); }
    finally { b.disabled = false; b.textContent = "가입 신청하기"; }
  });

  $$("[data-demo]").forEach(b => b.addEventListener("click", () => {
    const map = { admin: "1001", member: "1002", pending: "1009" };
    try { demoLogin(map[b.dataset.demo], "123456"); } catch (e) { toast(e.message); }
  }));

  $("#openCfgFromAuth").addEventListener("click", openCfgSheet);

  $("#btnCheckApproval").addEventListener("click", async () => {
    if (S.mode === "demo") {
      syncDemo();
      const u = S.user ? demoGet().users.find(x => x.uid === S.user.uid) : null;
      if (u && u.status === "approved") { S.user = Object.assign({}, u); route(); toast("승인되었습니다! 환영합니다"); }
      else toast("아직 승인 대기 중입니다");
    } else {
      try {
        const { doc, getDoc } = FB.f;
        const snap = await getDoc(doc(FB.db, "users", myUid()));
        if (snap.exists() && snap.data().status === "approved") { await loadProfile(FB.auth.currentUser); toast("승인되었습니다! 환영합니다"); }
        else toast("아직 승인 대기 중입니다");
      } catch (e) { toast(fbErrMsg(e)); }
    }
  });

  $("#btnPendingAdmin").addEventListener("click", () => {
    try { demoLogin("1001", "123456"); setTab("team"); toast("관리자 계정입니다. 아래 승인 대기에서 승인해 보세요"); } catch (e) { toast(e.message); }
  });
  $("#btnLogout2").addEventListener("click", doLogout);

  $$("#tabbar button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

  /* 상단 프로필 아이콘 → 팀원관리(내 프로필 · 승인 대기). 프로필 변경은 그 안의 [프로필 변경]에서 */
  $("#btnProfile").addEventListener("click", () => { setTab("team"); const v = $("#view-team"); if (v) v.scrollTop = 0; });

  window.addEventListener("storage", e => {
    if (S.mode === "demo" && (e.key === DEMO_KEY || e.key === SESSION_KEY)) {
      syncDemo();
      if (S.user && S.user.status !== "approved") showPending();
      renderAll();
    }
  });

  window.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); $("#layer").innerHTML = ""; } });
}

function applyModeUI() {
  const live = S.mode === "live";
  const box = $("#demoBox"); if (box) box.classList.toggle("hidden", live);
  const cfgLink = $("#openCfgFromAuth"); if (cfgLink) cfgLink.classList.toggle("hidden", live);
  const foot = $("#authFoot");
  if (!foot) return;
  /* 실서버 모드에서는 하단 체험 모드 문구/링크를 아예 그리지 않습니다. */
  foot.classList.toggle("hidden", live);
  foot.innerHTML = live
    ? ""
    : (cfgComplete(FIREBASE_CONFIG)
        ? '<a href="#" id="authBackLive">실시간 연결로 돌아가기</a>'
        : "체험 모드 · 이 기기에만 저장");
  const bl = $("#authBackLive");
  if (bl) bl.addEventListener("click", e => {
    e.preventDefault();
    try { sessionStorage.removeItem(DEMO_TRY_KEY); } catch (err) {}
    location.reload();
  });
}

async function boot() {
  holApplyCache(holCacheRead());
  const c = loadConfig();
  S.cfg = c.cfg; S.team = c.team; S.mode = c.live ? "live" : "demo";
  $("#hdrSub").textContent = S.team;

  bindGlobal();
  applyModeUI();

  /* 첫 인증 판정 전까지는 로그인 폼 대신 부팅 화면을 보여 줍니다 */
  showBoot();

  if (S.mode === "demo") {
    syncDemo();
    const sess = localStorage.getItem(SESSION_KEY);
    if (sess) {
      const u = demoGet().users.find(x => x.uid === sess);
      if (u) { S.user = Object.assign({}, u); route(); return; }
    }
    showAuthLogin();
    return;
  }

  /* live */
  try {
    await initFirebase(S.cfg);
  } catch (e) {
    S.mode = "demo"; syncDemo(); applyModeUI();
    toast("Firebase 연결 실패 — 미리보기 모드로 실행합니다");
    showAuthLogin();
  }
}

document.addEventListener("DOMContentLoaded", boot);
window.addEventListener("error", e => { console.warn("window error:", e.message); });
</script>
</body>
</html>
