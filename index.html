  return out;
}

async function seaLoad() {
  if (seaBusy) return;
  seaBusy = true;
  seaError = "";
  paintSea();
  try {
    const nowMs = Date.now();
    const sb = seaKmaShortBase(nowMs);
    const mb = seaKmaMidBase(nowMs);
    /* ① 기상청 단기예보 8콜(3개씩 물결+재시도) · ② 중기예보 3콜 · ③ Open-Meteo 2콜
       하나가 타임아웃·실패해도 나머지는 그대로 보여 주려고 allSettled를 씁니다. */
    const shortUrls = SEA_ISLANDS.map(isl => seaKmaUrl(SEA_KMA_SHORT, 1000,
      "base_date=" + sb.d8 + "&base_time=" + sb.hh + "&nx=" + isl.nx + "&ny=" + isl.ny));
    const shortP = seaGetWaves(shortUrls, 3);
    const extraP = Promise.allSettled([
      seaGet(seaUrl("marine")),
      seaGet(seaUrl("weather")),
      seaGet(seaKmaUrl(SEA_KMA_MIDSEA, 10, "regId=" + SEA_MID_SEA_REG + "&tmFc=" + mb.d8 + mb.hh)),
      seaGet(seaKmaUrl(SEA_KMA_MIDTA, 10, "regId=" + SEA_MID_TA_REG + "&tmFc=" + mb.d8 + mb.hh)),
      seaGet(seaKmaUrl(SEA_KMA_MIDLAND, 10, "regId=" + SEA_MID_LAND_REG + "&tmFc=" + mb.d8 + mb.hh))
    ]);
    const settledShort = await shortP;
    const settledExtra = await extraP;
    const val = i => (settledExtra[i] && settledExtra[i].status === "fulfilled") ? settledExtra[i].value : null;

    /* 기상청 단기예보 — 섬별 파싱 (한 섬이 실패해도 다른 섬은 그대로) */
    const shorts = [];
    let shortOk = 0;
    for (let i = 0; i < SEA_ISLANDS.length; i++) {
      let r = null;
      const j = settledShort[i] && settledShort[i].status === "fulfilled" ? settledShort[i].value : null;
      if (j) { try { r = seaKmaShort(seaKmaItems(j)); } catch (e) { r = null; } }
      if (r && Object.keys(r.days).length) shortOk++;
      shorts.push(r);
    }
    /* 기상청 중기예보 — 3~10일 뒤 (해상 파고·해상날씨 · 중기기온 · 강수확률) */
    const jSea = val(2), jTa = val(3), jLand = val(4);
    let mid = null;
    if (jSea) {
      try {
        mid = seaKmaMid(seaKmaItems(jSea), jTa ? seaKmaItems(jTa) : [], jLand ? seaKmaItems(jLand) : [], mb);
      } catch (e) { mid = null; }
    }
    const midOk = !!(mid && Object.keys(mid).length);

    /* Open-Meteo — 11~16일을 잇고, 기상청이 실패한 자리의 대체값 */
    const mRes = val(0), wRes = val(1);
    const mOk = !!mRes, wOk = !!wRes;
    if (!mOk && !wOk && !shortOk && !midOk) throw new Error("기상 데이터를 하나도 받지 못했어요");
    const mArr = mOk ? (Array.isArray(mRes) ? mRes : [mRes]) : [];
    const wArr = wOk ? (Array.isArray(wRes) ? wRes : [wRes]) : [];

    /* 날짜 축 — 오늘(KST)부터 16일. API 응답이 없어도 축은 그대로 만듭니다. */
    const kstNow = seaKstParts(nowMs);
    const days = [];
    for (let k = 0; k < SEA_DAYS; k++) days.push(seaAddDays(kstNow.ds, k));

    const items = SEA_ISLANDS.map((isl, i) => {
      const m = mArr[i] || {}, w = wArr[i] || {};
      const cur = m.current || {}, wc = w.current || {};
      const times = (m.hourly && m.hourly.time) || [];
      const waves = (m.hourly && m.hourly.wave_height) || [];
      const wtime = (w.hourly && w.hourly.time) || [];
      const wspeed = (w.hourly && w.hourly.wind_speed_10m) || [];
      const wgust = (w.hourly && w.hourly.wind_gusts_10m) || [];
      const wmap = {};
      for (let k = 0; k < wtime.length; k++) wmap[String(wtime[k])] = { w: wspeed[k], g: wgust[k] };
      /* 날짜별 기온(최고·최저) · 날씨 코드 · 강수량·강수확률 — 파고가 없는 뒤쪽 날짜의 참고값 */
      const dtime = (w.daily && w.daily.time) || [];
      const dmax = (w.daily && w.daily.temperature_2m_max) || [];
      const dmin = (w.daily && w.daily.temperature_2m_min) || [];
      const dcode = (w.daily && w.daily.weather_code) || [];
      const drain = (w.daily && w.daily.precipitation_sum) || [];
      const dprob = (w.daily && w.daily.precipitation_probability_max) || [];
      const tmap = {};
      for (let k = 0; k < dtime.length; k++) tmap[String(dtime[k])] = {
        max: dmax[k], min: dmin[k],
        code: typeof dcode[k] === "number" ? dcode[k] : null,
        rain: typeof drain[k] === "number" ? drain[k] : null,
        prob: typeof dprob[k] === "number" ? dprob[k] : null
      };
      /* 날짜별: 그날 최고 파고 · 오전(06~12시) 최고 · 오후(12~18시) 최고 · 최대 풍속·돌풍 · 기온 */
      const per = {};
      days.forEach(ds => {
        let mx = null, am = null, pm = null, wmx = null, gmx = null, nhr = 0;
        for (let k = 0; k < times.length; k++) {
          const t = String(times[k]);
          if (t.slice(0, 10) !== ds) continue;
          const hh = Number(t.slice(11, 13));
          const v = waves[k];
          if (typeof v === "number" && isFinite(v)) {
            if (mx === null || v > mx) mx = v;
            nhr++;
            if (hh >= 6 && hh < 12 && (am === null || v > am)) am = v;
            if (hh >= 12 && hh < 18 && (pm === null || v > pm)) pm = v;
          }
          const ww = wmap[t];
          if (ww && typeof ww.w === "number" && isFinite(ww.w) && (wmx === null || ww.w > wmx)) wmx = ww.w;
          if (ww && typeof ww.g === "number" && isFinite(ww.g) && (gmx === null || ww.g > gmx)) gmx = ww.g;
        }
        per[ds] = {
          max: mx, am: am, pm: pm, wind: wmx, gust: gmx, n: nhr,
          tmax: tmap[ds] && typeof tmap[ds].max === "number" ? tmap[ds].max : null,
          tmin: tmap[ds] && typeof tmap[ds].min === "number" ? tmap[ds].min : null,
          code: tmap[ds] && typeof tmap[ds].code === "number" ? tmap[ds].code : null,
          rain: tmap[ds] && typeof tmap[ds].rain === "number" ? tmap[ds].rain : null,
          prob: tmap[ds] && typeof tmap[ds].prob === "number" ? tmap[ds].prob : null,
          src: "om"
        };
      });
      /* 기상청 단기예보 — 오늘~5일 (중기보다 상세하므로 우선) */
      const sh = shorts[i] || null;
      if (sh) {
        days.forEach(ds => {
          const d = sh.days[ds];
          if (!d) return;
          const o = per[ds];
          if (typeof d.wavMax === "number") { o.max = d.wavMax; o.am = d.am; o.pm = d.pm; o.n = d.n; }
          if (typeof d.wind === "number") o.wind = d.wind;
          if (typeof d.tmax === "number") o.tmax = d.tmax;
          if (typeof d.tmin === "number") o.tmin = d.tmin;
          if (d.code !== null && d.code !== undefined) o.code = d.code;
          if (d.rain !== null) o.rain = d.rain;
          if (d.prob !== null) o.prob = d.prob;
          if (typeof d.wavMax === "number" || d.code !== null || d.wind !== null) o.src = "kma";
        });
      }
      /* 기상청 중기예보 — 6~10일 (단기예보가 있는 날은 건너뜀) */
      if (mid) {
        days.forEach(ds => {
          const d = mid[ds];
          if (!d || per[ds].src === "kma") return;
          const o = per[ds];
          o.max = d.wmax; o.wmin = d.wmin;
          o.amMin = d.amMin; o.amMax = d.amMax; o.pmMin = d.pmMin; o.pmMax = d.pmMax;
          o.am = d.amMax; o.pm = d.pmMax; o.n = null;
          o.wind = null; o.gust = null; o.rain = null;
          if (d.prob !== null) o.prob = d.prob;
          if (d.code !== null) o.code = d.code;
          o.wtext = d.wtext;
          if (d.tmax !== null) o.tmax = d.tmax;
          if (d.tmin !== null) o.tmin = d.tmin;
          o.src = "mid";
        });
      }
      /* 지금 값 — 단기예보의 현재 시각에 가장 가까운 시간값, 없으면 Open-Meteo current */
      const nowHr = seaKmaHourNear(sh, kstNow.ds, kstNow.h * 60 + kstNow.mi);
      const tdy = sh && sh.days[kstNow.ds] ? sh.days[kstNow.ds] : null;
      const maxOf = ds => (per[ds] && typeof per[ds].max === "number") ? per[ds].max : null;
      return {
        name: isl.name, area: isl.area,
        wave: nowHr && typeof nowHr.wav === "number" ? nowHr.wav : (typeof cur.wave_height === "number" ? cur.wave_height : null),
        period: typeof cur.wave_period === "number" ? cur.wave_period : null,
        temp: nowHr && typeof nowHr.tmp === "number" ? nowHr.tmp : (typeof wc.temperature_2m === "number" ? wc.temperature_2m : null),
        wind: nowHr && typeof nowHr.wind === "number" ? nowHr.wind : (typeof wc.wind_speed_10m === "number" ? wc.wind_speed_10m : null),
        gust: typeof wc.wind_gusts_10m === "number" ? wc.wind_gusts_10m : null,
        code: nowHr && (typeof nowHr.pty === "number" || typeof nowHr.sky === "number")
          ? seaKmaCode(nowHr.pty, nowHr.sky)
          : (typeof wc.weather_code === "number" ? wc.weather_code : null),
        rain: tdy && tdy.rain !== null ? tdy.rain : (typeof wc.precipitation === "number" ? wc.precipitation : null),
        prob: tdy && tdy.prob !== null ? tdy.prob : null,
        days: per,
        todayMax: maxOf(days[0]), tomMax: maxOf(days[1])
      };
    });

    /* 안내 문구 — 어떤 자료를 못 받았는지 */
    const warns = [];
    if (shortOk === 0) warns.push("기상청 단기예보를 받지 못해 1~5일은 Open-Meteo 값으로 대신했어요.");
    else if (shortOk < SEA_ISLANDS.length) warns.push("일부 섬(" + (SEA_ISLANDS.length - shortOk) + "곳)의 기상청 단기예보를 받지 못해 Open-Meteo 값으로 대신했어요.");
    if (!midOk) warns.push("기상청 중기예보를 받지 못해 6~10일도 Open-Meteo 값으로 대신했어요.");
    if (!mOk || !wOk) warns.push("Open-Meteo " + (!mOk ? "해양(파고)" : "기상(기온·풍속)") + " 정보를 받지 못해 11일 이후가 비어 있을 수 있어요.");

    const stamp = sb.ds + " " + sb.hh.slice(0, 2) + ":" + sb.hh.slice(2);
    seaCache = { at: Date.now(), items: items, stamp: stamp, days: days, warns: warns,
      midStamp: midOk ? (mb.ds + " " + mb.hh.slice(0, 2) + ":" + mb.hh.slice(2)) : "",
      srcs: { kma: shortOk, mid: midOk, om: mOk || wOk } };
  } catch (e) {
    const nm = (e && e.name) || "", msg = (e && e.message) || "";
    if (nm === "AbortError") seaError = "응답이 늦어 시간 초과";
    else if (/Failed to fetch|NetworkError|ERR_/i.test(msg)) seaError = "네트워크 연결을 확인해 주세요";
    else seaError = msg || "네트워크 오류";
  }
  seaBusy = false;
  paintSea();
}

/* 전체(오늘) — 섬 카드를 누르면 그 섬의 16일 리스트로 이동 */
function seaCardHtml(i, idx) {
  const b = seaBadge(i.wave);
  const wx = seaWx(i.code);
  const wind = i.wind !== null && i.wind !== undefined ? seaNum(i.wind) + " m/s" : "–";
  const rainTxt = (i.code !== null && i.code !== undefined)
    ? wx.em + " " + wx.label + (i.rain !== null && i.rain !== undefined ? " · 💧 " + seaRain(i.rain) : "") +
      (typeof i.prob === "number" ? " " + Math.round(i.prob) + "%" : "")
    : "☁️ 날씨 미제공";
  return '<button type="button" class="sea-card tap ' + b.cls + '" data-si="' + idx + '" aria-label="' + esc(i.name) + ' 16일 파고·날씨 보기">' +
    '<div class="sea-top"><b>' + esc(i.name) + '</b><span class="sea-badge ' + b.cls + '">' + b.label + "</span></div>" +
    '<div class="sea-wave"><b>' + seaNum(i.wave) + "</b>" + (i.wave !== null ? "<i>m</i>" : "") + "<small>지금 파고</small></div>" +
    '<div class="sea-meta">💨 ' + wind + (i.temp !== null && i.temp !== undefined ? ' <span>· ' + seaNum(i.temp) + "°</span>" : "") + "</div>" +
    '<div class="sea-rain' + (i.code !== null && i.code !== undefined && i.rain > 0 ? " wet" : "") + '">' + rainTxt + "</div>" +
    '<div class="sea-max">오늘 최고 <b>' + seaM(i.todayMax) + '</b> · 내일 <b>' + seaM(i.tomMax) + "</b></div>" +
    '<div class="sea-more">16일 보기 ›</div>' +
    "</button>";
}

/* 파고가 없는 날(해양예보 최대 9일 이후)은 풍속 기준 참고 배지 */
function seaWindBadge(w) {
  if (typeof w !== "number") return { cls: "na", label: "정보없음" };
  if (w >= 12) return { cls: "high", label: "강풍 주의" };
  if (w >= 9) return { cls: "warn", label: "바람 약간" };
  return { cls: "ok", label: "바람 양호" };
}
function seaTemp(v) { return (typeof v === "number" && isFinite(v)) ? Math.round(v) + "°" : "–"; }

/* 날짜 표기 — 11/21(토) */
function seaMd(ds) {
  const p = String(ds || "").split("-");
  const dt = new Date(ds + "T12:00:00");
  const wd = SEA_WEEK.charAt(isNaN(dt.getTime()) ? 0 : dt.getDay());
  return Number(p[1]) + "/" + Number(p[2]) + "(" + wd + ")";
}

/* 선택한 섬의 하루 = 한 줄 — 날짜 / 최고 파고·오전·오후 / 최대 풍속 / 배지 */
function seaRowHtml(it, ds, k) {
  const s = (it.days && it.days[ds]) || {};
  const hasWave = typeof s.max === "number";
  const isMid = s.src === "mid" && hasWave;
  const b = hasWave ? seaBadge(s.max) : seaWindBadge(s.wind);
  const badge = hasWave && b.cls === "high" && !isMid ? "높음·결항주의" : b.label;
  /* 해양예보 마지막 날처럼 파고가 하루 일부 시간만 있는 경우 */
  const partial = hasWave && !isMid && k > 0 && typeof s.n === "number" && s.n < 24;
  const tag = k === 0 ? "오늘" : k === 1 ? "내일" : (isMid ? "중기" : "");
  const windTxt = typeof s.wind === "number" ? seaNum(s.wind) + " m/s" : "–";
  let l1, l2, wxTxt, wet = false;
  if (isMid) {
    /* 6~10일째 — 기상청 중기해상예보: 최저~최고 파고 · 해상날씨·강수확률 + 중기기온 */
    l1 = '<span class="sr-w"><b class="rng">' + seaNum(s.wmin) + "~" + seaNum(s.max) + '</b><i>m</i></span>' +
      '<span class="sr-split">오전 ' + seaNum(s.amMin) + "~" + seaNum(s.amMax) + " · 오후 " + seaNum(s.pmMin) + "~" + seaNum(s.pmMax) + "</span>";
    l2 = typeof s.tmax === "number"
      ? "🌡 최저 " + seaTemp(s.tmin) + " · 최고 " + seaTemp(s.tmax)
      : "🌡 기온 자료 없음";
    const wm = seaWx(s.code);
    wxTxt = (s.code !== null && s.code !== undefined ? wm.em + " " + (s.wtext || wm.label) : "날씨 미제공") +
      (typeof s.prob === "number" ? ' · 💧 <em>' + Math.round(s.prob) + "%</em>" : "");
    wet = seaKmaWxRank(s.wtext) === 3;
  } else if (hasWave) {
    const splitTxt = (s.am === null || s.am === undefined) && (s.pm === null || s.pm === undefined)
      ? (typeof s.n === "number" ? s.n + "시간만 예보" : "")
      : "오전 " + seaNum(s.am) + " · 오후 " + seaNum(s.pm) + (partial ? " <em>＊</em>" : "");
    l1 = '<span class="sr-w"><b>' + seaNum(s.max) + "</b><i>m</i></span>" +
      '<span class="sr-split">' + splitTxt + "</span>";
    l2 = "💨 최대 " + windTxt;
  } else {
    l1 = '<span class="sr-nw">파고 미제공</span><span class="sr-split"></span>';
    l2 = "💨 최대 " + windTxt +
      (typeof s.tmax === "number" ? " · 🌡 " + seaTemp(s.tmax) + "/" + seaTemp(s.tmin) : "");
  }
  if (!isMid) {
    /* 날씨·강수 — 기상 API가 실패한 날짜는 미제공으로 */
    const wx = seaWx(s.code);
    wxTxt = (s.code !== null && s.code !== undefined)
      ? wx.em + " " + wx.label + " · 💧 " + seaRain(s.rain) + (typeof s.prob === "number" ? ' <em>' + Math.round(s.prob) + "%</em>" : "")
      : "날씨·강수 미제공";
    wet = s.code !== null && s.code !== undefined && typeof s.rain === "number" && s.rain > 0;
  }
  return '<div class="sr ' + b.cls + (k === 0 ? " today" : "") + '">' +
    '<div class="sr-d"><b>' + seaMd(ds) + "</b>" + (tag ? "<span>" + tag + "</span>" : "") + "</div>" +
    '<div class="sr-m"><div class="sr-l1">' + l1 +
      '<span class="sea-badge ' + b.cls + '">' + badge + "</span></div>" +
      '<div class="sr-l2">' + l2 + "</div>" +
      '<div class="sr-l3' + (wet ? " wet" : "") + '">' + wxTxt + "</div></div>" +
    "</div>";
}

/* 선택한 섬 — 지금 상태 + 16일 날짜 리스트 */
function seaIslandHtml(it, d) {
  const days = d.days || [];
  const b = seaBadge(it.wave);
  let ok = 0, warn = 0, high = 0, na = 0;
  const rows = days.map((ds, k) => {
    const s = (it.days && it.days[ds]) || {};
    if (typeof s.max === "number") {
      const bb = seaBadge(s.max);
      if (bb.cls === "ok") ok++; else if (bb.cls === "warn") warn++; else if (bb.cls === "high") high++;
    } else na++;
    return seaRowHtml(it, ds, k);
  }).join("");
  const cur = "지금 파고 <b>" + seaM(it.wave) + "</b>" +
    (typeof it.wind === "number" ? " · 💨 " + seaNum(it.wind) + " m/s" : "") +
    (typeof it.temp === "number" ? " · 🌡 " + seaTemp(it.temp) : "") +
    (it.code !== null && it.code !== undefined
      ? " · " + seaWx(it.code).em + " " + seaWx(it.code).label +
        (typeof it.rain === "number" && it.rain > 0 ? " " + seaRain(it.rain) : "")
      : "");
  return '<div class="sea-cur"><div class="ct"><b>' + esc(it.name) + "</b><small>" + esc(it.area) + "</small>" +
      '<span class="sea-badge ' + b.cls + '">' + b.label + "</span></div>" +
      '<div class="cm">' + cur + "</div></div>" +
    '<div class="sea-cc">' +
      '<span class="ok">파고 양호 <b>' + ok + "</b></span>" +
      '<span class="warn">주의 <b>' + warn + "</b></span>" +
      '<span class="high">높음 <b>' + high + "</b></span>" +
      '<span class="na">파고 미제공 <b>' + na + "일</b></span></div>" +
    '<div class="sea-list">' + rows + "</div>";
}

/* 전체(오늘) — 8개 섬의 지금 파고·풍속·오늘/내일 최고 */
function seaAllHtml(d) {
  const cnt = { ok: 0, warn: 0, high: 0, na: 0 };
  d.items.forEach(i => { cnt[seaBadge(i.wave).cls]++; });
  let cards = "";
  SEA_GROUPS.forEach(g => {
    const list = d.items.map((i, idx) => ({ i: i, idx: idx })).filter(o => o.i.area === g);
    if (!list.length) return;
    cards += '<div class="sea-grp">' + esc(g) + "<em>" + list.length + "곳</em></div>" +
      '<div class="sea-grid">' + list.map(o => seaCardHtml(o.i, o.idx)).join("") + "</div>";
  });
  return '<div class="sea-cc">' +
      '<span class="ok">양호 <b>' + cnt.ok + "</b></span>" +
      '<span class="warn">주의 <b>' + cnt.warn + "</b></span>" +
      '<span class="high">높음 <b>' + cnt.high + "</b></span>" +
      (cnt.na ? '<span class="na">정보없음 <b>' + cnt.na + "</b></span>" : "") + "</div>" +
    cards +
    '<div class="sea-tip">섬 카드를 누르면 그 섬의 16일 파고·날씨·강수로 바로 넘어갑니다.</div>';
}

function seaBodyHtml() {
  const d = seaCache;
  const stale = d && Date.now() - d.at > SEA_TTL;
  let hd = '<div class="sea-hd"><span class="dot"></span>';
  if (seaBusy) hd += d ? "새로 받는 중… (" + seaClock(d.stamp) + " 기준)" : "파고·풍속을 받아오는 중…";
  else if (d) hd += seaClock(d.stamp) + " 발표 · 기상청 단기예보";
  else hd += "연결하지 못했어요";
  hd += '<button class="rf" id="seaRefresh"' + (seaBusy ? " disabled" : "") + ">" + (seaBusy ? "⏳ 받는 중" : "🔄 새로고침") + "</button></div>";

  /* 출처 표시(상단) — 기상청 공공누리 제1유형(출처표시) · Open-Meteo */
  const srcTop = '<div class="sea-src">자료 출처: ' +
    '<a href="https://www.weather.go.kr/w/index.do" target="_blank" rel="noopener"><b>기상청</b></a>(단기·중기예보, ' +
    '<a href="https://www.kogl.or.kr" target="_blank" rel="noopener">공공누리 제1유형</a>) · ' +
    '<b>Open-Meteo</b>(11~16일)</div>';

  /* 선택 상태 — 데이터가 없거나 범위를 벗어나면 첫 번째 섬(백령도) */
  let sel = seaSel;
  if (sel !== SEA_ALL && !(sel >= 0 && sel < SEA_ISLANDS.length)) sel = 0;
  const chipOn = n => (sel === n ? " on" : "");
  const chips = '<div class="sea-chips" id="seaChips">' +
    '<button type="button" class="sea-chip all' + chipOn(SEA_ALL) + '" data-si="-1">전체(오늘)</button>' +
    SEA_ISLANDS.map((s, i) => '<button type="button" class="sea-chip' + chipOn(i) + '" data-si="' + i + '">' + esc(s.name) + "</button>").join("") +
    "</div>";

  let main = "";
  if (d && sel === SEA_ALL) {
    main = seaAllHtml(d);
  } else if (d && d.items[sel]) {
    main = seaIslandHtml(d.items[sel], d);
  } else if (seaError) {
    main = '<div class="sea-err"><span>📡</span>파고 정보를 받지 못했어요.<br>' + esc(seaError) +
      '<br><button id="seaRetry">다시 시도</button></div>';
  } else {
    main = '<div class="sea-list">' + Array(6).fill('<div class="sea-skel" style="height:48px"></div>').join("") + "</div>";
  }

  const staleBar = (d && stale && !seaBusy)
    ? '<div class="sea-stale">' + (seaError ? "새 정보를 못 받아 지난 값을 보여 줍니다. " : "10분 넘은 값이에요. ") + "[새로고침]을 눌러 주세요.</div>" : "";

  /* 일부 자료를 받지 못한 경우 — 받은 값은 그대로 보여 주고 빠진 것만 알립니다 */
  const partBar = (d && d.warns && d.warns.length && !seaBusy)
    ? '<div class="sea-stale">' + d.warns.map(w => esc(w)).join("<br>") + "</div>" : "";

  const legend = '<div class="sea-legend">' +
      '<span><i style="background:#158f5f"></i>1.0m 미만 양호</span>' +
      '<span><i style="background:#e08a00"></i>1.0~1.9m 주의</span>' +
      '<span><i style="background:#e5484d"></i>2.0m 이상 높음·결항주의</span>' +
      '<span><i style="background:#cbd5e3"></i>파고 미제공 = 풍속·기온 참고</span>' +
    "</div>" +
    (sel === SEA_ALL ? "" : '<div class="sea-legend" style="margin-top:4px"><span>＊ 그날 일부 시간대는 파고 예보 없음</span></div>');

  const links = SEA_LINKS.map(l =>
    '<a class="sea-link cp" href="' + l.url + '" target="_blank" rel="noopener">' +
      '<span class="em">' + l.em + '</span>' +
      '<span class="tx"><b>' + esc(l.label) + '</b></span>' +
      '<span class="ar">›</span></a>').join("");

  return hd + srcTop + partBar + '<div class="sea-links top">' + links + "</div>" + chips + main + staleBar + legend +
    '<div class="sea-note">기상 자료: <b>기상청 단기예보</b>(오늘~5일: 파고·풍속·기온·날씨·강수) + ' +
      "<b>기상청 중기해상예보·중기기온</b>(6~10일: 파고 최저~최고·해상날씨) + " +
      "<b>Open-Meteo</b>(11~16일: 날씨·강수·풍속·기온, 파고는 해양예보 범위까지) · 실제 결항은 운항정보 확인<br>" +
      "💧 강수량은 하루 합계, %는 그날 강수확률(최대) · 비·눈이 예보된 날은 파란색으로 표시합니다.<br>" +
      "6~10일 파고·날씨는 기상청 <b>중기해상예보(서해중부 먼바다)</b> 값이라 8개 섬이 같고, 최저~최고 범위로 나옵니다. 강수확률은 수도권 육상예보, 기온은 백령도 지점 값이에요.<br>" +
      "11일 이후 파고 예보가 없으면 파고 대신 <b>최대 풍속</b> 배지(12.0m/s 이상 강풍 주의 · 9.0~11.9 바람 약간 · 9.0 미만 바람 양호)와 <b>최고/최저 기온</b>을 보여 줍니다.<br>" +
      "파고는 바다 격자 예보값이라 섬 주변 실제 바다와 조금 다를 수 있어요.<br>" +
      '<b>자료 출처: 기상청(단기·중기예보, 공공누리 제1유형) · Open-Meteo(11~16일)</b> — ' +
      '<a href="https://www.weather.go.kr/w/index.do" target="_blank" rel="noopener">기상청</a> · ' +
      '<a href="https://www.kogl.or.kr" target="_blank" rel="noopener">공공누리</a> · ' +
      "공공누리 제1유형은 출처를 밝히면 자유롭게 이용할 수 있습니다.</div>";
}

function paintSea() {
  const wrap = $("#seaWrap");
  if (!wrap) return;
  const bd = $("#sheetBd");
  const st = bd ? bd.scrollTop : 0;
  wrap.innerHTML = seaBodyHtml();
  const rf = $("#seaRefresh", wrap);
  if (rf) rf.addEventListener("click", () => { if (!seaBusy) seaLoad(); });
  const rt = $("#seaRetry", wrap);
  if (rt) rt.addEventListener("click", () => { if (!seaBusy) seaLoad(); });
  /* 섬 칩 · 전체(오늘) 카드 → 그 섬의 16일 리스트로 */
  wrap.querySelectorAll("[data-si]").forEach(el => el.addEventListener("click", () => {
    const n = Number(el.getAttribute("data-si"));
    if (!isFinite(n) || n === seaSel) return;
    seaSel = n;
    paintSea();
  }));
  if (bd) bd.scrollTop = st;
}

function openSeaSheet() {
  seaError = "";
  seaSel = 0;                          /* 기본 진입 = 백령도 16일 리스트 */
  openSheet({
    title: "🌊 섬 파고 · 배편",
    body: '<div id="seaWrap">' + seaBodyHtml() + "</div>",
    onMount: () => {
      paintSea();
      if (seaBusy) return;
      const fresh = seaCache && Date.now() - seaCache.at < SEA_TTL;
      if (!fresh) seaLoad();
    }
  });
}

function renderDuty() {
  const v = $("#view-duty");
  const mode = CAL_MODES[S.calMode] ? S.calMode : "duty";
  S.calMode = mode;
  const isDuty = mode === "duty";
  const cur = S.cursor;
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y, m, 1);
  const todayStr = ymd(new Date());
  /* 🛡️ 당직 달력은 월~금 5열, ⛴️ 섬·교육 달력은 일~토 7열 */
  const days = [];
  if (isDuty) {
    const back = first.getDay() === 0 ? 6 : first.getDay() - 1;   // 1일이 든 주의 월요일까지
    const lastD = new Date(y, m + 1, 0);
    const ld = lastD.getDay();
    const fwd = (ld === 0 || ld === 6) ? 0 : 5 - ld;               // 말일이 든 주의 금요일까지
    const start = new Date(y, m, 1 - back);
    const end = new Date(y, m, lastD.getDate() + fwd);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      if (d.getDay() === 0 || d.getDay() === 6) continue;
      days.push(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
    }
  } else {
    const start = new Date(y, m, 1 - first.getDay());
    const rows = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
    for (let i = 0; i < rows * 7; i++) days.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  }
  if (isDuty) ensureHolidays(y);

  /* 한 날짜 칸 — pad 는 연속 막대 자리만큼 띄우는 위쪽 여백 */
  const dayCell = (d, pad, hideMulti) => {
    const ds = ymd(d);
    const inMonth = d.getMonth() === m;
    const allRaw = inMonth ? calEntriesOn(ds) : [];
    const all = hideMulti ? allRaw.filter(e => entryEnd(e) === entryStart(e)) : allRaw;
    /* 🛡️ 당직 달력은 맨 위 당직자, 아래에 등판·의소기한·조사기한 */
    const dutyAll = isDuty ? all.filter(e => e.type === "duty") : all;
    const msList = (isDuty && inMonth) ? msOn(ds) : [];
    const list = dutyAll.filter(e => e.memberId === myUid()).concat(dutyAll.filter(e => e.memberId !== myUid()));
    const takes = Math.min(list.length, isDuty ? 1 : 2);
    const shown = list.slice(0, takes).map(e => {
      const s = STATUS[e.type] || STATUS.duty;
      const mine = e.memberId === myUid();
      if (isDuty) return '<span class="dpill duty' + (mine ? " mine" : "") + '">' + esc(e.memberName) + "</span>";
      return '<span class="dpill ' + s.cls + '"><i class="em">' + (s.mini || s.em) + "</i>" + esc(e.memberName) + "</span>";
    }).join("");
    const msTakes = Math.min(msList.length, 2);
    const msShown = msList.slice(0, msTakes).map(x => {
      const s = STATUS[x.type] || STATUS.duty;
      return '<span class="dpill ms ' + s.cls + '" title="' + esc(s.label) + '">' + esc(s.label) + "</span>";
    }).join("");
    const more = (list.length > takes ? '<span class="dpill more">+' + (list.length - takes) + "명</span>" : "") +
      (msList.length > msTakes ? '<span class="dpill more">+' + (msList.length - msTakes) + "</span>" : "");
    const mine = allRaw.some(e => e.memberId === myUid());
    const editedDay = isDuty && inMonth && allRaw.some(e => Array.isArray(e.history) && e.history.length);
    const ev = (isDuty && inMonth) ? eventOf(ds) : null;
    const hol = inMonth ? holidayName(ds) : "";
    return '<div class="day' + (inMonth ? "" : " out") + (ds === todayStr ? " today" : "") + (mine ? " hasmine" : "") + (hol ? " hol" : "") + (ev ? " evday" : "") + (editedDay ? " edited" : "") +
        '" data-day="' + ds + '"' + (ev ? ' data-event="' + esc(ev.title) + '"' : "") + (hol ? ' title="' + esc(hol) + ' (공휴일)"' : "") + ">" +
        '<span class="num">' + d.getDate() + (editedDay ? '<i class="edmark" title="담당자가 바뀐 날">✎</i>' : "") + "</span>" +
        '<div class="dcells"' + (pad ? ' style="padding-top:' + pad + 'px"' : "") + ">" +
          shown + msShown + more +
          (ev ? '<span class="dpill event" title="' + esc(ev.title) + '">🎈 ' + esc(ev.title) + "</span>" : "") +
          (hol && isDuty ? '<span class="dpill hols">' + esc(hol) + "</span>" : "") +
        "</div>" +
      "</div>";
  };

  let gridHtml;
  if (isDuty) {
    gridHtml = days.map(d => dayCell(d, 0, false)).join("");
  } else {
    /* 섬·교육 달력 — 주(일~토) 단위로 묶어 여러 날 일정을 가로 막대로 그립니다 */
    const weeks = [];
    for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));
    gridHtml = weeks.map(week => {
      const spans = islandWeekSpans(week);
      const lanes = spans.reduce((mx, sp) => Math.max(mx, sp.lane + 1), 0);
      const pad = lanes ? 26 + lanes * 15 : 0;
      return '<div class="wk">' +
        '<div class="wkdays">' + week.map(d => dayCell(d, pad, true)).join("") + "</div>" +
        (spans.length ? '<div class="wkbars" style="grid-template-rows:repeat(' + lanes + ',15px)">' + spans.map(islandBarHtml).join("") + "</div>" : "") +
      "</div>";
    }).join("");
  }

  /* 요약은 지금 보고 있는 달력 모드 기준으로 집계 (당직 모드는 당직자만 — 마일스톤 제외) */
  const from = ymd(new Date(y, m, 1)), to = ymd(new Date(y, m + 1, 0));
  const monthRows = calAll()
    .filter(e => entryEnd(e) >= from && entryStart(e) <= to)
    .sort((a, b) => entryStart(a) < entryStart(b) ? -1 : entryStart(a) > entryStart(b) ? 1 : 0);
  const dutyMonthRows = isDuty ? monthRows.filter(e => e.type === "duty") : monthRows;
  const monthEvents = isDuty ? S.events.filter(ev => ev.date >= from && ev.date <= to) : [];
  const wkDuty = isDuty ? dutyMonthRows.filter(e => isWeekendDs(entryStart(e))) : [];
  const tListAll = calEntriesOn(todayStr);
  const tList = isDuty ? tListAll.filter(e => e.type === "duty") : tListAll;
  const msToday = isDuty ? msOn(todayStr) : [];

  let c1val, c1small;
  if (isDuty) {
    c1val = tList.length ? esc(tList.map(e => e.memberName).join(", ")) : "없음";
    c1small = (m + 1) + "월 당직 " + dutyMonthRows.length + "건" + (msToday.length ? " · 오늘 " + msToday.map(x => STATUS[x.type].label).join("·") : "");
  } else {
    c1val = tList.length
      ? esc(tList.slice(0, 2).map(e => e.memberName).join(", ")) + (tList.length > 2 ? " 외 " + (tList.length - 2) + "명" : "")
      : "없음";
    const cnt = {};
    tList.forEach(e => { cnt[e.type] = (cnt[e.type] || 0) + 1; });
    const parts = ["day_island", "overnight_island", "edu"].filter(k => cnt[k]).map(k => STATUS[k].label + " " + cnt[k]);
    c1small = parts.length ? parts.join(" · ") : (m + 1) + "월 " + monthRows.length + "건";
  }

  const myRows = calAll().filter(e => e.memberId === myUid() && entryEnd(e) >= todayStr)
    .sort((a, b) => entryStart(a) < entryStart(b) ? -1 : 1);
  const mineNext = myRows[0];
  const myVal = mineNext
    ? (entryStart(mineNext) === todayStr ? "오늘" : shortDate(entryStart(mineNext)).replace("/", "월 ") + "일")
    : "예정 없음";
  const mySub = mineNext
    ? (STATUS[mineNext.type] || STATUS.duty).label + (mineNext.memo ? " · " + mineNext.memo : "")
    : (isDuty ? "당직 일정을 등록해 보세요" : "섬·교육 일정을 등록해 보세요");

  const legendKeys = isDuty ? ["duty", "board_meeting", "opinion_due", "survey_due"] : ["day_island", "overnight_island", "edu"];

  /* 당직 운영 카드 (관리자) */
  let opsHtml = "";
  if (isDuty && canManageDuty()) {
    const info = nextMonthInfo();
    const exN = excludedList().length;
    opsHtml =
      '<div class="ops">' +
        '<div class="ops-hd"><b>🏢 당직 운영</b><span class="ops-badge">매월 24일 자동 배정</span></div>' +
        '<div class="ops-st"><b>' + info.label + " 당직 " + info.count + '건</b> · 명단 <b>' + info.roster + '명</b>' + (exN ? " (제외 " + exN + ")" : "") + "</div>" +
        '<div class="ops-btns">' +
          '<button id="opsRoster">👥 명단</button>' +
          '<button id="opsRebalance">🔁 재배정</button>' +
        "</div>" +
      "</div>";
  }

  v.innerHTML =
    '<div class="vhead"><div><h2>팀 캘린더</h2><div class="sub">' +
      (isDuty ? "🏢 당직 일정만 모아 봅니다" : "⛴️ 당일·1박 섬과 교육 일정을 모아 봅니다") + "</div></div>" +
      '<button class="btn sm" id="calAdd">' + ICON.plus + " 등록</button></div>" +
    '<div class="cal-tabs">' +
      ["duty", "island"].map(k => '<button data-calmode="' + k + '" class="' + k + (k === mode ? " on" : "") + '"><span class="em">' + CAL_MODES[k].em + "</span>" + CAL_MODES[k].label + "</button>").join("") +
    "</div>" +
    (isDuty ? "" :
    '<button class="wave-strip" id="waveBtn" aria-label="섬 파고와 배편 열기">' +
      '<span class="em">🌊</span>' +
      '<span class="tx"><b>섬 파고 · 배편</b><small>섬을 고르면 16일 파고·날씨·강수 · 여객선 예매</small></span>' +
      '<span class="go">열기 ›</span>' +
    "</button>") +
    '<div class="sum-grid">' +
      '<div class="sum"><div class="lb">' + (isDuty ? "🏢 오늘 당직" : "⛴️ 오늘 섬·교육") + '</div><div class="val">' + c1val +
        "<small>" + esc(c1small) + "</small></div></div>" +
      '<div class="sum mine"><div class="lb">🙋 ' + (isDuty ? "내 다음 당직" : "내 다음 일정") + '</div><div class="val">' + myVal +
        "<small>" + esc(mySub) + "</small></div></div>" +
    "</div>" +
    opsHtml +
    '<div class="cal' + (isDuty ? " fivecol" : "") + '" style="margin-top:11px">' +
      '<div class="cal-head"><b>' + y + "년 " + (m + 1) + "월</b><div class=\"nav\">" +
        (isDuty ? '<button class="prn" id="calPrint" title="이번 달 당직표 인쇄 · 저장">🖨️ 인쇄</button>' : "") +
        '<button class="today-btn" id="calToday">오늘</button>' +
        '<button id="calPrev" aria-label="이전 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m14 6-6 6 6 6"/></svg></button>' +
        '<button id="calNext" aria-label="다음 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m10 6 6 6-6 6"/></svg></button>' +
      "</div></div>" +
      '<div class="dow">' + (isDuty
        ? ["월", "화", "수", "목", "금"].map(d => '<span class="wk">' + d + "</span>").join("")
        : DAYS.map((d, i) => '<span class="' + (i === 0 ? "sun" : i === 6 ? "sat" : "") + '">' + d + "</span>").join("")) + "</div>" +
      '<div class="grid' + (isDuty ? "" : " wklist") + '" id="calGrid">' + gridHtml + "</div>" +
      (isDuty ? '<div class="holnote" id="holNote">' + holidayNoteHtml(y) + (wkDuty.length ? " · 주말 당직 " + wkDuty.length + "건은 아래 목록" : "") + "</div>" : "") +
      '<div class="legend">' + legendKeys.map(k => '<span><i class="' + STATUS[k].cls + '"></i>' + STATUS[k].em + " " + STATUS[k].label + "</span>").join("") +
        (isDuty ? '<span><i style="background:#c4b5fd"></i>🎈 행사일</span>' : "") + "</div>" +
    "</div>" +
    (isDuty ? "" :
      '<div class="sec-title">이번 달 섬·교육 일정 ' + monthRows.length + "건" + "</div>" +
      monthList(monthRows, isDuty, monthEvents)) +
    '<div style="height:6px"></div>';

  $$("[data-calmode]", v).forEach(b => b.addEventListener("click", () => { S.calMode = b.dataset.calmode; renderDuty(); }));
  $("#calAdd").addEventListener("click", () => openScheduleSheet(todayStr));
  const wb = $("#waveBtn"); if (wb) wb.addEventListener("click", () => openSeaSheet());
  $("#calPrev").addEventListener("click", () => { S.cursor = new Date(y, m - 1, 1); renderDuty(); });
  $("#calNext").addEventListener("click", () => { S.cursor = new Date(y, m + 1, 1); renderDuty(); });
  $("#calToday").addEventListener("click", () => { S.cursor = new Date(); renderDuty(); });
  const cp = $("#calPrint"); if (cp) cp.addEventListener("click", printDutySheet);
  const oR = $("#opsRoster"); if (oR) oR.addEventListener("click", openRosterSheet);
  const oB = $("#opsRebalance"); if (oB) oB.addEventListener("click", openRebalanceSheet);
  $$("[data-day]", v).forEach(el => el.addEventListener("click", () => openScheduleSheet(el.dataset.day)));
}

/* =====================================================================
   🖨️ 인쇄 — 지금 보고 있는 연/월 당직표 (A4 가로 한 장)
   · 인쇄에는 당직자 · 공휴일 · 행사일 · 등판만 넣습니다.
   · 의소기한 · 조사기한은 인쇄에서 빼고 앱 화면에서만 보여줍니다.
   ===================================================================== */
/* =====================================================================
   🖨️ 당직표 — 인쇄 · PNG 저장 (아이폰 홈 화면 앱 포함)
   · 인쇄와 이미지 모두 당직자 · 공휴일 · 행사일 · 등판만 넣습니다.
   · 의소기한 · 조사기한은 빼고 앱 화면에서만 보여줍니다.
   · iOS 홈 화면 앱(Standalone)은 window.print()가 막히므로,
     Canvas PNG 미리보기 → '공유 / 아이폰 인쇄'(프린트 · 파일에 저장)로 안내합니다.
   ===================================================================== */
function dutyPrintData() {
  const cur = (S.cursor instanceof Date) ? S.cursor : new Date();
  const y = cur.getFullYear(), m = cur.getMonth();
  ensureHolidays(y);
  const now = new Date();
  const todayStr = ymd(now);
  const team = String(S.team || "우리팀").trim() || "우리팀";
  const first = new Date(y, m, 1);
  const lastD = new Date(y, m + 1, 0);
  const back = first.getDay() === 0 ? 6 : first.getDay() - 1;
  const ld = lastD.getDay();
  const fwd = (ld === 0 || ld === 6) ? 0 : 5 - ld;
  const start = new Date(y, m, 1 - back);
  const end = new Date(y, m, lastD.getDate() + fwd);

  const cells = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const ds = ymd(day), inM = day.getMonth() === m;
    cells.push({
      day: day, ds: ds, inM: inM,
      holiday: inM ? holidayName(ds) : "",
      event: inM ? eventOf(ds) : null,
      names: inM ? entriesOn(ds).filter(e => e.type === "duty").map(e => e.memberName).filter(Boolean) : [],
      board: inM && msOn(ds).some(x => x.type === "board_meeting"),
      today: ds === todayStr
    });
  }

  /* 달력 칸이 없는 주말 당직은 아래 한 줄로 */
  const from = ymd(first), to = ymd(lastD);
  const wk = S.duty.filter(e => e.type === "duty" && isWeekendDs(entryStart(e)) && entryStart(e) >= from && entryStart(e) <= to)
    .sort((a, b) => entryStart(a) < entryStart(b) ? -1 : 1);

  return {
    y: y, m: m, team: team, todayStr: todayStr, cells: cells,
    rows: Math.max(1, Math.ceil(cells.length / 5)),
    wkText: wk.length
      ? "주말 당직 " + wk.map(e => shortDate(entryStart(e)) + "(" + DAYS[new Date(entryStart(e) + "T00:00:00").getDay()] + ") " + e.memberName).join(" · ")
      : "",
    printDate: todayStr + " (" + DAYS[now.getDay()] + ")",
    fileBase: y + "-" + pad2(m + 1) + "-당직표"
  };
}

function dutyPrintHtml() {
  const P = dutyPrintData();
  const rowH = (P.rows <= 5 ? 31 : 26) + "mm";   /* 월별 5~6줄 모두 같은 높이로 A4 한 장에 */

  const cell = c => {
    const cls = "psd" + (c.inM ? "" : " out") + (c.holiday ? " hol" : "") + (c.event ? " ev" : "") + (c.today ? " today" : "");
    return '<td class="' + cls + '">' +
      '<div class="psd-top"><span class="psd-num' + (c.inM ? "" : " dim") + '">' + c.day.getDate() + "</span>" +
        '<span class="psd-wd">' + DAYS[c.day.getDay()] + "</span>" +
        (c.board ? '<span class="psd-badge">📋 등판</span>' : "") + "</div>" +
      (c.holiday ? '<div class="psd-hol">' + esc(c.holiday) + "</div>" : "") +
      (c.event ? '<div class="psd-ev">🎈 ' + esc(c.event.title) + "</div>" : "") +
      (c.names.length ? '<div class="psd-name">' + esc(c.names.join(" · ")) + "</div>"
                      : (c.inM ? '<div class="psd-name none">당직 없음</div>' : "")) +
      "</td>";
  };

  let tbody = "";
  for (let i = 0; i < P.cells.length; i += 5) {
    tbody += '<tr style="height:' + rowH + '">' + P.cells.slice(i, i + 5).map(cell).join("") + "</tr>";
  }

  return '<div class="ps-page">' +
    '<div class="ps-hd"><h1>' + esc(P.team) + " · " + P.y + "년 " + (P.m + 1) + "월 당직표</h1>" +
      '<div class="ps-meta">출력일 ' + P.printDate + "</div></div>" +
    '<table class="ps-cal"><thead><tr><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead><tbody>' +
      tbody + "</tbody></table>" +
    '<div class="ps-foot">' +
      '<div class="ps-legend"><span><i style="background:#e58a09"></i>당직</span>' +
        '<span><i style="background:#dc2626"></i>등판</span>' +
        '<span><i style="background:#c4b5fd"></i>행사일</span>' +
        '<span><i style="background:#fbe0e0"></i>공휴일</span></div>' +
      (P.wkText ? '<div class="ps-wk"><b>' + esc(P.wkText) + "</b></div>" : "") +
    "</div></div>";
}

/* ---------------- Canvas PNG (A4 가로 비율 2200 × 1554) ---------------- */
const DUTY_PNG_W = 2200, DUTY_PNG_H = 1554;
const DUTY_FF = "-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif";

function dutyPrintCanvas() {
  const P = dutyPrintData();
  const W = DUTY_PNG_W, H = DUTY_PNG_H;
  const cvs = document.createElement("canvas");
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext("2d");
  const font = (size, weight) => (weight || 700) + " " + Math.round(size) + "px " + DUTY_FF;

  const rr = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  const clip = (text, maxW) => {
    if (ctx.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t + "…";
  };
  const wrap = (text, maxW, maxLines) => {
    const out = [];
    let line = "";
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ctx.measureText(line + ch).width > maxW && line) {
        out.push(line);
        line = ch;
        if (out.length === maxLines) return out.slice(0, maxLines - 1).concat(clip(out[maxLines - 1] + line + text.slice(i + 1), maxW));
      } else line += ch;
    }
    if (line) out.push(line);
    return out;
  };

  const M = 76, innerW = W - M * 2;
  const hdBase = M + 54;
  const ruleY = hdBase + 34;
  const tableTop = ruleY + 24;
  const footRuleY = H - M - 84;
  const tableBottom = footRuleY - 26;
  const cw = innerW / 5;
  const headH = 56;
  const bodyTop = tableTop + headH;
  const rh = (tableBottom - bodyTop) / P.rows;

  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";

  /* ---- 머리 : 팀 · 연월 + 출력일 ---- */
  ctx.textAlign = "left"; ctx.fillStyle = "#141a24"; ctx.font = font(56, 800);
  ctx.fillText(P.team + " · " + P.y + "년 " + (P.m + 1) + "월 당직표", M, hdBase);
  ctx.textAlign = "right"; ctx.fillStyle = "#5c6577"; ctx.font = font(26, 600);
  ctx.fillText("출력일 " + P.printDate, W - M, hdBase);
  ctx.strokeStyle = "#e58a09"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(M, ruleY); ctx.lineTo(W - M, ruleY); ctx.stroke();

  /* ---- 표 머리 ---- */
  ctx.fillStyle = "#f2f5fa"; ctx.fillRect(M, tableTop, innerW, headH);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#4b5565"; ctx.font = font(27, 800);
  ["월", "화", "수", "목", "금"].forEach((t, i) => ctx.fillText(t, M + cw * (i + 0.5), tableTop + headH / 2 + 1));

  /* ---- 표 본문 ---- */
  const drawCell = (x, y, c, h) => {
    const bg = !c ? "#ffffff" : c.event ? "#f6f2ff" : c.holiday ? "#fff7f7" : (c.inM ? "#ffffff" : "#fbfcfe");
    ctx.fillStyle = bg; ctx.fillRect(x, y, cw, h);
    ctx.strokeStyle = "#cfd6e2"; ctx.lineWidth = 1.6;
    ctx.strokeRect(x + 0.8, y + 0.8, cw - 1.6, h - 1.6);
    if (!c) return;

    const px = x + 20, pTop = y + 15, maxW = cw - 40;
    const fNum = Math.max(30, Math.min(46, h * 0.205));
    const fWd = Math.max(19, Math.min(25, h * 0.112));
    const fMeta = Math.max(18.5, Math.min(24.5, h * 0.108));
    const lineH = fMeta * 1.3;

    /* 날짜 + 요일 */
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = font(fNum, 800);
    const numTxt = String(c.day.getDate());
    const numW = ctx.measureText(numTxt).width;
    const numBase = pTop + fNum * 0.94;
    ctx.fillStyle = c.inM ? (c.today ? "#1f52cf" : "#141a24") : "#c3cad8";
    ctx.fillText(numTxt, px, numBase);
    ctx.font = font(fWd, 700); ctx.fillStyle = c.inM ? "#8a93a6" : "#c9d0dd";
    const wdTxt = DAYS[c.day.getDay()];
    const wdX = px + numW + 10;
    ctx.fillText(wdTxt, wdX, numBase);
    const wdW = ctx.measureText(wdTxt).width;

    /* 📋 등판 — 날짜·요일 바로 옆(칸 상단)에 붙여, 칸 아래쪽은 이름 자리로 비워 둡니다 */
    if (c.board) {
      const label = "📋 등판";
      const badgeH = Math.max(26, Math.min(33, h * 0.132));
      const fB = Math.max(17, badgeH * 0.60);
      ctx.font = font(fB, 800);
      const bw = Math.ceil(ctx.measureText(label).width) + 22;
      let bx = wdX + wdW + 14;
      if (bx + bw > x + cw - 16) bx = x + cw - 16 - bw;   /* 자리가 모자라면 칸 오른쪽 끝에 */
      const by = pTop + fNum * 0.58 - badgeH / 2;          /* 날짜 숫자와 같은 줄 가운데 */
      rr(bx, by, bw, badgeH, 7);
      ctx.fillStyle = "#fee2e2"; ctx.fill();
      ctx.strokeStyle = "#fecaca"; ctx.lineWidth = 2; ctx.stroke();
      ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.fillStyle = "#b91c1c";
      ctx.fillText(label, bx + 11, by + badgeH / 2 + 1);
    }

    /* 이름은 칸 아래쪽에 맞춰 이름끼리 줄이 서도록 — 등판이 위로 빠져 이름을 크게 */
    const nameBottom = y + h - Math.max(14, h * 0.072);
    let fName = Math.max(30, Math.min(66, h * 0.29));
    const nameTxt = c.names.length ? c.names.join(" · ") : "";
    if (nameTxt) {
      ctx.font = font(fName, 800);
      while (fName > 23 && ctx.measureText(nameTxt).width > maxW) { fName -= 1; ctx.font = font(fName, 800); }
    }
    const nameTop = nameBottom - fName;

    /* 공휴일 · 행사일 */
    ctx.textBaseline = "top";
    let my = pTop + fNum * 0.94 + 9;
    const metaLimit = nameTop - 6;
    if (c.holiday && my + fMeta <= metaLimit) {
      ctx.font = font(fMeta, 800); ctx.fillStyle = "#c8323a";
      ctx.fillText(clip(c.holiday, maxW), px, my); my += lineH;
    }
    if (c.event) {
      ctx.font = font(fMeta, 800); ctx.fillStyle = "#5b46c9";
      const lines = wrap("🎈 " + c.event.title, maxW, 2);
      for (let i = 0; i < lines.length; i++) {
        if (my + fMeta > metaLimit) break;
        ctx.fillText(lines[i], px, my); my += lineH;
      }
    }

    /* 당직자 이름 */
    ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    if (c.names.length) {
      ctx.font = font(fName, 800); ctx.fillStyle = "#0f1722";
      ctx.fillText(clip(nameTxt, maxW), px, nameBottom - fName * 0.17);
    } else if (c.inM) {
      ctx.font = font(Math.max(18, fName * 0.38), 700); ctx.fillStyle = "#b6bdc9";
      ctx.fillText("당직 없음", px, nameBottom - fName * 0.17);
    }
  };

  for (let r = 0; r < P.rows; r++) {
    for (let cix = 0; cix < 5; cix++) {
      const idx = r * 5 + cix;
      drawCell(M + cw * cix, bodyTop + rh * r, P.cells[idx] || null, rh);
    }
  }

  /* ---- 하단 : 범례 + 주말 당직 ---- */
  ctx.strokeStyle = "#cfd6e2"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(M, footRuleY); ctx.lineTo(W - M, footRuleY); ctx.stroke();

  const lgY = footRuleY + 34;
  let lx = M;
  ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.font = font(24, 700);
  [["#e58a09", "당직"], ["#dc2626", "등판"], ["#c4b5fd", "행사일"], ["#fbe0e0", "공휴일"]].forEach(it => {
    ctx.fillStyle = it[0]; rr(lx, lgY - 10, 18, 18, 4); ctx.fill();
    ctx.strokeStyle = "rgba(20,26,36,.12)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#4b5565"; ctx.font = font(24, 700);
    const tW = ctx.measureText(it[1]).width;
    ctx.fillText(it[1], lx + 26, lgY + 1);
    lx += 26 + tW + 34;
  });

  if (P.wkText) {
    ctx.textAlign = "right"; ctx.fillStyle = "#4b5565"; ctx.font = font(23, 700);
    const lines = wrap(P.wkText, Math.max(400, W - M - lx - 30), 2);
    lines.forEach((ln, i) => ctx.fillText(ln, W - M, lgY + i * 30));
  }

  return cvs;
}

function isStandaloneApp() {
  try {
    return (window.navigator.standalone === true) ||
      window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches;
  } catch (e) { return false; }
}

function printDutySheet() {
  const P = dutyPrintData();
  const cvs = dutyPrintCanvas();
  const dataUrl = cvs.toDataURL("image/png");
  const fname = P.fileBase + ".png";
  const title = P.team + " " + P.y + "년 " + (P.m + 1) + "월 당직표";
  const standalone = isStandaloneApp();

  /* 공유 시트에 바로 넘길 File 을 미리 만들어 둡니다(아이폰은 클릭 순간의 사용자 동작이 필요). */
  let shareFile = null, shareBlob = null;
  if (typeof cvs.toBlob === "function") {
    try {
      cvs.toBlob(blob => {
        if (!blob) return;
        shareBlob = blob;
        try { shareFile = new File([blob], fname, { type: "image/png" }); } catch (e) { shareFile = null; }
      }, "image/png");
    } catch (e) { /* Blob 미지원 — dataURL 로 대체 */ }
  }

  const body =
    '<div class="dsp">' +
      '<div class="dsp-cap"><b>A4 가로 미리보기</b><span>PNG ' + DUTY_PNG_W + "×" + DUTY_PNG_H + "</span></div>" +
      '<div class="dsp-prev"><img id="dspImg" src="' + dataUrl + '" alt="' + esc(title) + ' 미리보기"></div>' +
      '<div class="dsp-note">' +
        (standalone
          ? "홈 화면 앱에서는 <b>🖨️ 바로 인쇄</b>가 열리지 않아요. <b>공유 / 아이폰 인쇄</b>를 누른 뒤 <b>프린트</b> 또는 <b>파일에 저장</b>을 골라 주세요."
          : "미리보기를 길게 누르면 사진에 저장할 수 있어요. 인쇄는 <b>바로 인쇄</b> 또는 <b>공유</b>에서 프린트를 고르세요.") +
      "</div>" +
    "</div>";

  const footer =
    '<div class="dsp-ft">' +
      '<button class="btn" id="dspShare">📤 공유 / 아이폰 인쇄</button>' +
      '<div class="row">' +
        '<button class="btn ghost" id="dspSave">🖼️ 이미지 저장</button>' +
        '<button class="btn ghost-line" id="dspPrint">🖨️ 바로 인쇄</button>' +
      "</div>" +
    "</div>";

  openSheet({
    title: "🖨️ 당직표 인쇄 · 저장",
    body: body,
    footer: footer,
    onMount: () => {
      /* 1) 공유 / 아이폰 인쇄 — 네이티브 공유 시트(프린트 · 파일에 저장 · 카톡) */
      $("#dspShare").addEventListener("click", () => {
        const file = shareFile;
        if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          navigator.share({ files: [file], title: title }).catch(err => {
            if (err && err.name === "AbortError") return;
            openPngTab();
          });
          return;
        }
        if (!file) { toast("이미지를 준비하고 있어요. 잠시 뒤 다시 눌러 주세요."); return; }
        openPngTab();
      });

      /* 2) 이미지 저장 — PNG 다운로드 */
      $("#dspSave").addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = dataUrl; a.download = fname; a.rel = "noopener";
        document.body.appendChild(a); a.click(); a.remove();
        toast("PNG로 저장했어요 · 안 되면 미리보기를 길게 눌러 저장해 주세요");
      });

      /* 3) 바로 인쇄 — 일반 브라우저 · PC */
      $("#dspPrint").addEventListener("click", () => {
        const box = $("#printSheet");
        if (!box) { toast("이 기기에서는 인쇄 창을 열 수 없어요"); return; }
        box.innerHTML = dutyPrintHtml();
        try { window.print(); } catch (e) { /* 아래 안내로 대신 */ }
        if (standalone) toast("홈 화면 앱에서는 위 '공유 / 아이폰 인쇄'로 프린트해 주세요");
      });
    }
  });

  function openPngTab() {
    try {
      if (shareBlob) {
        const url = URL.createObjectURL(shareBlob);
        const w = window.open(url, "_blank");
        if (w) { setTimeout(() => URL.revokeObjectURL(url), 60000); toast("새 탭에서 이미지를 길게 눌러 저장·공유하세요"); return; }
      }
    } catch (e) { /* 아래 안내 */ }
    toast("공유를 열 수 없어요. 미리보기를 길게 눌러 저장해 주세요");
  }
}

function monthList(rows, isDuty, events) {
  const items = rows.map(e => ({ kind: "duty", date: entryStart(e), e: e }));
  (events || []).forEach(ev => items.push({ kind: "event", date: ev.date, ev: ev }));
  items.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (!items.length) return '<div class="empty" style="padding:24px"><span>📅</span>이번 달 ' + (isDuty ? "당직" : "섬·교육") + ' 일정이 아직 없습니다.<br>날짜나 [등록] 버튼을 눌러 추가해 보세요.</div>';
  return items.map(it => {
    if (it.kind === "event") {
      return '<div class="mem" style="background:#f8f5ff;border-color:#e6e0ff">' +
        '<span class="avatar" style="background:#7c5cf0">🎈</span>' +
        '<div class="mi"><b>' + esc(it.ev.title) + ' <span class="pill" style="background:#ede9fe;color:#5b46c9">행사일</span></b>' +
        "<p>" + shortDate(it.ev.date) + " · 당직 없음</p></div></div>";
    }
    const e = it.e;
    const s = STATUS[e.type] || STATUS.duty;
    const mm = memberOf(e.memberId);
    const span = entryEnd(e) !== entryStart(e) ? shortDate(entryStart(e)) + "~" + shortDate(entryEnd(e)) : shortDate(entryStart(e));
    return '<div class="mem">' + avatarHtml(mm ? mm.name : e.memberName, "", mm ? mm.uid : "") +
      '<div class="mi"><b>' + esc(mm ? mm.name : e.memberName) + ' <span class="pill ' + (s.cls === "island-night" ? "admin" : "approved") + '" style="background:' + (s.cls === "island-night" ? "#e8eafc;color:#2f3391" : s.cls === "island-day" ? "#e4f7fd;color:#0b6d8f" : s.cls === "duty" ? "#fff3dd;color:#96590a" : "#e8f8f1;color:#0d7a55") + '">' + s.label + "</span></b>" +
      "<p>" + span + (e.memo ? " · " + esc(e.memo) : "") + "</p></div></div>";
  }).join("");
}
</script>
<script>
/* =====================================================================
   11. 사진공유
   ===================================================================== */
/* 📸 사진 앨범 — 사용자가 직접 만든 앨범(갤러리 스타일 2열 커버 그리드)으로 사진을 정리합니다.
   · 사진 문서의 folder 필드(앨범 이름) 하나로 전 팀원에게 공유됩니다. (보안 규칙 변경·재게시 불필요)
   · 관리자·당직 관리 권한자가 만든 앨범은 duty_roster_config/config.photoFolders 에 들어가
     사진이 한 장도 없어도 승인된 팀원 모두에게 바로 보입니다.
   · 일반 팀원이 만든 앨범은 이 기기에 먼저 남고, 그 앨범으로 사진을 올리면 folder 필드로 공유됩니다.
   · 화면: 앨범 목록(전체 사진 · 앨범들 · 미정리 카드) ↔ 앨범 안(3열 사진 그리드).
   · 앨범이 없던 예전 사진(folder 없는 사진)은 '전체 사진'과 '미정리'에 그대로 보입니다. */
const PF_LOCAL_KEY = "teamhub.photoFolders.v1";
const PF_MAX = 40;
function pfClean(n) { return String(n == null ? "" : n).replace(/\s+/g, " ").trim().slice(0, 24); }
function photoFolderOf(p) { return String((p && p.folder) || "").trim(); }
/* 팀 공유 앨범 목록 — duty_roster_config/config.photoFolders (필드명은 보안 규칙 호환을 위해 그대로) */
function pfCfg() {
  const a = S.roster && S.roster.photoFolders;
  return Array.isArray(a) ? a.filter(f => f && pfClean(f.name)) : [];
}
/* 이 기기에서만 만든 앨범 목록(일반 팀원이 만든 앨범) — localStorage */
function pfLocal() {
  try {
    const a = JSON.parse(localStorage.getItem(PF_LOCAL_KEY) || "[]");
    return Array.isArray(a) ? a.filter(f => f && pfClean(f.name)) : [];
  } catch (e) { return []; }
}
function pfSetLocal(arr) {
  try { localStorage.setItem(PF_LOCAL_KEY, JSON.stringify(arr)); } catch (e) {}
}
/* 지금 보이는 앨범 = 공유 앨범 + 이 기기 앨범 + 사진에 붙은 앨범 (이름 가나다순) */
function photoFolders() {
  const map = {};
  const put = (name, meta) => {
    const n = pfClean(name);
    if (!n) return;
    if (!map[n]) map[n] = { name: n, by: "", at: 0, count: 0 };
    if (meta && meta.by && !map[n].by) { map[n].by = String(meta.by); map[n].at = Number(meta.at) || 0; }
  };
  pfCfg().forEach(f => put(f.name, f));
  pfLocal().forEach(f => put(f.name, f));
  S.photos.forEach(p => put(photoFolderOf(p), null));
  const list = Object.keys(map).map(k => map[k]);
  S.photos.forEach(p => { const n = photoFolderOf(p); if (n && map[n]) map[n].count++; });
  list.sort((a, b) => a.name.localeCompare(b.name, "ko"));
  return list;
}
/* 앨범 이름 변경·비우기·삭제는 관리자 또는 그 앨범을 만든 사람만 */
function pfCanEdit(f) {
  if (!f) return false;
  if (canManageDuty() || isAdmin()) return true;
  return !!(f.by && f.by === myUid());
}
/* 공유 앨범 목록 저장 — 관리자·당직 관리 권한자만 (duty_roster_config/config.photoFolders) */
async function pfSaveCfg(list) {
  const arr = list.map(f => ({ name: pfClean(f.name), by: String(f.by || ""), at: Number(f.at) || Date.now() }))
    .filter(f => f.name).slice(0, PF_MAX);
  if (S.mode === "demo") {
    demoMutate(d => { d.roster = Object.assign({}, d.roster || {}, { photoFolders: arr, updatedAt: Date.now() }); });
    S.roster = Object.assign({}, S.roster, { photoFolders: arr });
  } else {
    const { doc, setDoc, serverTimestamp } = FB.f;
    const payload = { photoFolders: arr, updatedAt: serverTimestamp(), updatedBy: myUid() };
    /* 이 기기가 설정 문서를 아직 받지 못했으면 새로 만들 때도 규칙(excluded is list)을 통과하도록 */
    if (!LOADED.roster) payload.excluded = [];
    await setDoc(doc(FB.db, "duty_roster_config", "config"), payload, { merge: true });
    S.roster = Object.assign({}, S.roster, { photoFolders: arr });
  }
}
/* 앨범 만들기 — 관리 권한자는 전 팀원에게 공유, 일반 팀원은 이 기기 + 업로드 앨범으로 */
async function pfCreate(name) {
  const n = pfClean(name);
  if (!n) { toast("앨범 이름을 입력해 주세요"); return ""; }
  if (photoFolders().some(f => f.name === n)) { toast("이미 있는 앨범이에요"); return n; }
  if (photoFolders().length >= PF_MAX) { toast("앨범은 " + PF_MAX + "개까지 만들 수 있어요"); return ""; }
  const entry = { name: n, by: myUid(), at: Date.now() };
  try {
    if (canManageDuty()) {
      await pfSaveCfg(pfCfg().concat([entry]));
      toast("‘" + n + "’ 앨범을 만들었어요 · 팀원 모두에게 보여요");
    } else {
      pfSetLocal(pfLocal().concat([entry]));
      toast("‘" + n + "’ 앨범을 만들었어요 · 사진을 올리면 팀원에게도 보여요");
    }
  } catch (e) {
    /* 저장에 실패해도 이 기기 앨범으로는 바로 쓸 수 있게 */
    pfSetLocal(pfLocal().concat([entry]));
    toast(fbErrMsg(e));
  }
  return n;
}
/* 사진 한 장의 앨범 바꾸기 — 올린 사람·관리자만 (보안 규칙과 같은 조건) */
async function dbSetPhotoFolder(id, folder) {
  const f = pfClean(folder);
  const p = S.photos.find(x => x.id === id);
  if (!p) return false;
  if (!(p.author_id === myUid() || isAdmin())) { toast("올린 사람·관리자만 앨범을 바꿀 수 있어요"); return false; }
  if (S.mode === "demo") {
    demoMutate(d => { const q = d.photos.find(x => x.id === id); if (q) q.folder = f; });
  } else {
    const { doc, updateDoc } = FB.f;
    await updateDoc(doc(FB.db, "photos", id), { folder: f });
    p.folder = f;
  }
  return true;
}
/* 앨범에 담긴 내가 바꿀 수 있는 사진을 다른 앨범(기본: 미정리)으로 옮깁니다 */
async function pfMoveOut(name, to) {
  const list = S.photos.filter(p => photoFolderOf(p) === name);
  let ok = 0, no = 0;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    if (!(p.author_id === myUid() || isAdmin())) { no++; continue; }
    try { if (await dbSetPhotoFolder(p.id, to)) ok++; else no++; }
    catch (e) { no++; }
  }
  return { ok: ok, no: no };
}
async function pfRename(oldName, newName) {
  const n = pfClean(newName);
  if (!n) { toast("앨범 이름을 입력해 주세요"); return false; }
  if (n === oldName) return false;
  if (photoFolders().some(f => f.name === n)) { toast("같은 이름의 앨범이 이미 있어요"); return false; }
  const r = await pfMoveOut(oldName, n);
  const cfg = pfCfg();
  if (cfg.some(f => f.name === oldName) && canManageDuty()) {
    await pfSaveCfg(cfg.map(f => f.name === oldName ? Object.assign({}, f, { name: n }) : f));
  }
  const lc = pfLocal();
  if (lc.some(f => f.name === oldName)) pfSetLocal(lc.map(f => f.name === oldName ? Object.assign({}, f, { name: n }) : f));
  if (r.no) toast(r.ok + "장을 옮겼어요 · " + r.no + "장은 올린 사람만 바꿀 수 있어 이름이 남습니다");
  else toast("앨범 이름을 ‘" + n + "’(으)로 바꿨어요");
  return true;
}
async function pfEmpty(name) {
  const r = await pfMoveOut(name, "");
  if (!r.ok && !r.no) { toast("옮길 사진이 없어요"); return; }
  toast("사진 " + r.ok + "장을 미정리로 옮겼어요" + (r.no ? " · " + r.no + "장은 올린 사람만 옮길 수 있어요" : ""));
}
async function pfDelete(name) {
  const r = await pfMoveOut(name, "");
  const cfg = pfCfg();
  if (cfg.some(f => f.name === name) && canManageDuty()) await pfSaveCfg(cfg.filter(f => f.name !== name));
  const lc = pfLocal();
  if (lc.some(f => f.name === name)) pfSetLocal(lc.filter(f => f.name !== name));
  if (S.photoFolder === name) S.photoFolder = "all";
  if (r.no) toast("앨범을 지웠지만 " + r.no + "장은 올린 사람만 옮길 수 있어 ‘" + name + "’에 남아 있어요");
  else toast("‘" + name + "’ 앨범을 지웠어요" + (r.ok ? " · 사진 " + r.ok + "장은 미정리로 옮겼어요" : ""));
}
/* 앨범 관리 버튼(이름 변경·사진 비우기·앨범 삭제) */
function pfAction(kind, f) {
  if (!f) return;
  if (!pfCanEdit(f)) return toast("만든 사람·관리자만 바꿀 수 있어요");
  if (kind === "rename") return pfRenameSheet(f.name);
  if (kind === "empty") {
    if (!f.count) return toast("이 앨범에는 사진이 없어요");
    if (!confirm("‘" + f.name + "’ 앨범의 사진 " + f.count + "장을 미정리로 옮길까요?\n(앨범은 그대로 남습니다)")) return;
    pfEmpty(f.name).then(() => renderPhotos()).catch(e => toast(fbErrMsg(e)));
    return;
  }
  if (kind === "del") {
    if (!confirm("‘" + f.name + "’ 앨범을 지울까요?" + (f.count ? "\n사진 " + f.count + "장은 미정리로 옮겨집니다." : ""))) return;
    /* 지운 앨범 안에 머물지 않고 앨범 목록으로 돌아갑니다 */
    pfDelete(f.name).then(() => { S.photoView = "albums"; S.photoFolder = "all"; renderPhotos(); }).catch(e => toast(fbErrMsg(e)));
  }
}
function pfNewSheet() {

          : "이 기기에 먼저 만들어 두고, 그 앨범으로 사진을 올리면 팀원 모두에게 보여요.") + "</div>",

      const btn = $("#pfNameSave", root);

function pfRenameSheet(oldName) {
  openSheet({
    title: "앨범 이름 바꾸기",
    body:
      '<div class="field"><label>앨범 이름</label>' +
        '<input type="text" id="pfRnIn" maxlength="24" value="' + esc(oldName) + '" autocomplete="off"></div>' +
      '<div class="hint" style="margin:2px 2px 0;line-height:1.65">이 앨범에 담긴 사진도 새 이름으로 함께 옮겨집니다. 올린 사람이 다른 사진은 그대로 남습니다.</div>',
    footer: '<button class="btn" id="pfRnSave">이름 바꾸기</button>',
    onMount: root => {
      const inp = $("#pfRnIn", root);
      const btn = $("#pfRnSave", root);
      const save = async () => {
        if (btn.disabled) return;
        btn.disabled = true;
        if (S.photoFolder === oldName) S.photoFolder = pfClean(inp.value);   /* 바뀐 앨범을 그대로 보고 있게 */
        const ok = await pfRename(oldName, inp.value);
        btn.disabled = false;
        if (ok) { closeSheet(); renderPhotos(); }
        else { if (S.photoFolder === pfClean(inp.value)) S.photoFolder = oldName; inp.focus(); }
      };
      btn.addEventListener("click", save);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); save(); } });
      setTimeout(() => { inp.focus(); inp.select(); }, 120);
    }
  });
}

    $("#albNew").addEventListener("click", pfNewSheet);

  }

  /* ---------- ② 앨범 안 — 그 앨범 사진만 3열 그리드 ---------- */
  let sel = S.photoFolder || "all";
  /* 앨범이 사라졌으면(지움·이름 변경) 이번 화면만 전체로 */
  if (sel !== "all" && sel !== "none" && !albums.some(f => f.name === sel)) { sel = "all"; S.photoFolder = "all"; }
  const cur = sel !== "all" && sel !== "none" ? albums.find(f => f.name === sel) : null;
  const list = sel === "all" ? all : sel === "none" ? unfiled : all.filter(p => photoFolderOf(p) === sel);
  const title = sel === "all" ? "🖼️ 전체 사진" : sel === "none" ? "🗂️ 미정리" : cur ? cur.name : sel;
  const sub = sel === "all" ? list.length + "장 · 앨범 " + albums.length + "개" : list.length + "장";
  const manage = cur
    ? '<div class="foldtools"><b>앨범 관리</b>' +
        (pfCanEdit(cur)
          ? '<button data-pfdo="rename">이름 변경</button><button data-pfdo="empty">사진 비우기</button>' +
            '<button data-pfdo="del" class="danger">앨범 삭제</button>'
          : '<span class="hint">만든 사람·관리자만 바꿀 수 있어요</span>') +
      "</div>"
    : "";
  const emptyMsg = sel === "all"
    ? "아직 사진이 없습니다.<br>첫 사진을 올려보세요."
    : sel === "none"
      ? "미정리 사진이 없습니다.<br>모든 사진이 앨범에 정리되어 있어요."
      : "‘" + esc(sel) + "’ 앨범이 비어 있어요.<br>아래 버튼으로 이 앨범에 사진을 담아보세요.";

  v.innerHTML =
    '<button class="team-back" id="albBack">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg> 앨범 목록</button>' +
    '<div class="albhead"><h2>' + esc(title) + '</h2><div class="sub">' + sub + "</div></div>" +
    '<button class="albup" id="btnAlbUp">' + ICON.plus + (cur ? " 이 앨범에 올리기" : " 올리기") + "</button>" +
    manage +
    (list.length ? photoGridHTML(list, sel === "all") : '<div class="empty"><span>' + (sel === "none" ? "🗂️" : "🖼️") + "</span>" + emptyMsg + "</div>");

  $("#albBack").addEventListener("click", () => { S.photoView = "albums"; renderPhotos(); v.scrollTop = 0; });
  $("#btnAlbUp").addEventListener("click", () => openUpload(cur ? cur.name : ""));
  $$("[data-pfdo]", v).forEach(b => b.addEventListener("click", () => pfAction(b.dataset.pfdo, cur)));
  $$("[data-photo]", v).forEach(b => b.addEventListener("click", () => openPhoto(b.dataset.photo)));
}

function compressImage(file, maxW, quality) {
  maxW = maxW || 960; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let scale = Math.min(1, maxW / img.width);
        if (img.height * scale > maxW * 1.4) scale = Math.min(scale, (maxW * 1.4) / img.height);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = quality;
        let data = c.toDataURL("image/jpeg", q);
        while (data.length * 0.75 > 320 * 1024 && q > 0.4) { q -= 0.08; data = c.toDataURL("image/jpeg", q); }
        URL.revokeObjectURL(url);
        resolve({ data: data, w: w, h: h, kb: Math.round((data.length * 0.75) / 1024) });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
    img.src = url;
  });
}

/* 사진 올리기 시트 — album 을 넘기면 그 앨범이 처음부터 선택되어 있습니다. */
function openUpload(album) {
  const MAX = 10;
  openSheet({
    title: "사진 올리기",
    body:
      '<input type="file" id="fileIn" accept="image/*" multiple style="display:none">' +
      '<button class="btn up-pick" id="pickBtn" style="margin-bottom:2px">📷 사진 선택 (여러 장 가능)</button>' +
      '<div id="prevBox"><div class="upempty">아직 선택한 사진이 없습니다.<br>한 번에 ' + MAX + '장까지 고를 수 있어요.</div></div>' +
      '<div class="upprog" id="upProg"></div>' +
      '<div class="field" style="margin-top:14px"><label>앨범</label>' +
        '<div class="chips wrap" id="pfChips" style="padding-bottom:2px"></div>' +
        '<div id="pfNewRow" style="display:none;margin-top:8px;gap:6px;align-items:center">' +
          '<input type="text" id="pfNewIn" maxlength="24" placeholder="새 앨범 이름 (예: 11월 백령도)" autocomplete="off" style="flex:1;min-width:0">' +
          '<button type="button" class="btn" id="pfNewOk" style="padding:9px 12px;font-size:12px;flex-shrink:0">만들기</button>' +
        "</div></div>" +
      '<div class="field" style="margin-top:10px"><label>한 줄 메모 (선택 · 여러 장 공통)</label>' +
        '<input type="text" id="capIn" maxlength="60" placeholder="예: 11월 팀 워크숍"></div>' +
      '<div class="notice-bar">사진은 올릴 때 자동으로 리사이즈·압축되어 저장됩니다. (가로 최대 960px, JPEG 0.72)</div>',
    footer: '<button class="btn" id="upSave" disabled>사진 올리기</button>',
    onMount: root => {
      let picked = [];        // { data, kb, done }
      /* 넘겨받은 앨범이 있으면 그것을, 없으면 지금 보고 있는 앨범을 기본 선택(아니면 미정리) */
      let folder = (typeof album === "string") ? pfClean(album)
        : ((S.photoView === "photos" && S.photoFolder && S.photoFolder !== "all" && S.photoFolder !== "none") ? S.photoFolder : "");
      let busy = false;
      const fi = $("#fileIn", root);
      const box = $("#prevBox", root);
      const prog = $("#upProg", root);
      const saveBtn = $("#upSave", root);
      const capIn = $("#capIn", root);
      const pfChips = $("#pfChips", root);
      const pfNewRow = $("#pfNewRow", root);
      const drawFolders = () => {
        const fs = photoFolders();
        if (folder && !fs.some(f => f.name === folder)) folder = "";
        pfChips.innerHTML =
          '<button type="button" class="chip' + (folder === "" ? " on" : "") + '" data-uf="">🗂️ 미정리</button>' +
          fs.map(f => '<button type="button" class="chip' + (folder === f.name ? " on" : "") + '" data-uf="' + esc(f.name) + '">🖼️ ' + esc(f.name) + "</button>").join("") +
          '<button type="button" class="chip" id="ufNew">＋ 새 앨범 직접 입력</button>';
        $$("[data-uf]", pfChips).forEach(b => b.addEventListener("click", () => {
          if (busy) return;
          folder = b.dataset.uf || "";
          drawFolders();
        }));
        $("#ufNew", pfChips).addEventListener("click", () => {
          if (busy) return;
          pfNewRow.style.display = "flex";
          $("#pfNewIn", root).focus();
        });
      };
      const mkFolder = async () => {
        if (busy) return;
        const inp = $("#pfNewIn", root);
        const n = await pfCreate(inp.value);
        if (!n) { inp.focus(); return; }
        folder = n;
        inp.value = "";
        pfNewRow.style.display = "none";
        drawFolders();
      };
      $("#pfNewOk", root).addEventListener("click", mkFolder);
      $("#pfNewIn", root).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); mkFolder(); } });
      drawFolders();

      const syncBtn = () => {
        const left = picked.filter(p => !p.done).length;
        saveBtn.disabled = busy || left === 0;
        if (!busy) saveBtn.textContent = left > 1 ? left + "장 올리기" : "사진 올리기";
      };
      const drawGrid = () => {
        if (!picked.length) {
          box.innerHTML = '<div class="upempty">아직 선택한 사진이 없습니다.<br>한 번에 ' + MAX + '장까지 고를 수 있어요.</div>';
        } else {
          box.innerHTML = '<div class="upgrid">' + picked.map((p, i) =>
            '<div class="upcell' + (p.done ? " done" : "") + '">' +
              '<img src="' + p.data + '" alt="선택한 사진 ' + (i + 1) + '">' +
              (p.done ? "" : '<button type="button" class="x" data-drop="' + i + '" aria-label="이 사진 빼기">✕</button>') +
              '<span class="kb">' + p.kb + "KB</span>" +
            "</div>").join("") + "</div>";
          $$("[data-drop]", box).forEach(b => b.addEventListener("click", () => {
            if (busy) return;
            picked.splice(Number(b.dataset.drop), 1);
            drawGrid(); syncBtn();
          }));
        }
        syncBtn();
      };

      $("#pickBtn", root).addEventListener("click", () => { if (!busy) fi.click(); });
      fi.addEventListener("change", async () => {
        const files = Array.from(fi.files || []);
        fi.value = "";
        if (!files.length) return;
        const room = MAX - picked.length;
        if (room <= 0) { toast("한 번에 최대 " + MAX + "장까지 올릴 수 있어요"); return; }
        const use = files.slice(0, room);
        if (files.length > room) toast("최대 " + MAX + "장까지 · " + use.length + "장만 담았어요");
        prog.innerHTML = '<span class="spin"></span> 사진을 압축하는 중…';
        for (let i = 0; i < use.length; i++) {
          try {
            const c = await compressImage(use[i]);
            picked.push({ data: c.data, kb: c.kb, done: false });
            prog.textContent = (i + 1) + "/" + use.length + " 압축 중…";
            drawGrid();
          } catch (e) {
            toast("'" + (use[i].name || "사진") + "'을(를) 읽을 수 없어요");
          }
        }
        prog.textContent = "";
        drawGrid();
      });

      saveBtn.addEventListener("click", async () => {
        const todo = picked.filter(p => !p.done);
        if (!todo.length || busy) return;
        const cap = capIn.value.trim();
        busy = true;
        saveBtn.disabled = true;
        let ok = 0, fail = null;
        for (let i = 0; i < todo.length; i++) {
          const label = (i + 1) + "/" + todo.length + " 올리는 중…";
          saveBtn.textContent = label;
          prog.textContent = label;
          try {
            await dbAddPhoto(todo[i].data, cap, folder);
            todo[i].done = true; ok++;
            drawGrid();
          } catch (e) { fail = e; break; }
        }
        busy = false;
        saveBtn.textContent = "사진 올리기";
        if (fail) {
          ghostDone();                    // 이미 올라간 사진은 목록에서 빼고, 남은 것만 다시 시도
          prog.textContent = ok ? ok + "장을 올렸습니다 · 남은 사진을 다시 시도해 주세요" : "";
          syncBtn();
          toast(fbErrMsg(fail));
          return;
        }
        closeSheet();
        openAlbum(folder || "none");   // 올린 사진이 바로 보이도록 그 앨범을 열어 줍니다
        toast(ok > 1 ? ok + "장의 사진을 올렸습니다" : "사진을 올렸습니다");
      });
      const ghostDone = () => { picked = picked.filter(p => !p.done); drawGrid(); syncBtn(); };
      syncBtn();
    }
  });
}

  };

async function dbAddPhoto(imageData, caption, folder) {
  const f = pfClean(folder);
  const doc = { imageData: imageData, caption: caption || "", author_id: myUid(), author_name: S.user.name, likes: [], comments: [], createdAt: Date.now() };
  if (f) doc.folder = f;
  if (S.mode === "demo") {
    demoMutate(d => { d.photos.unshift(Object.assign({ id: uid() }, doc)); });
  } else {
    const { collection, addDoc, serverTimestamp } = FB.f;
    await addDoc(collection(FB.db, "photos"), Object.assign({}, doc, { createdAt: serverTimestamp() }));
  }
}
async function dbDeletePhoto(id) {
  if (S.mode === "demo") demoMutate(d => { d.photos = d.photos.filter(x => x.id !== id); });
  else { const { doc, deleteDoc } = FB.f; await deleteDoc(doc(FB.db, "photos", id)); }
}
async function dbToggleLike(id) {
  const p = S.photos.find(x => x.id === id);
  if (!p) return;
  const liked = (p.likes || []).indexOf(myUid()) >= 0;
  if (S.mode === "demo") {
    demoMutate(d => {
      const q = d.photos.find(x => x.id === id);
      if (!q) return;
      q.likes = q.likes || [];
      if (liked) q.likes = q.likes.filter(u => u !== myUid()); else q.likes.push(myUid());
    });
  } else {
    const { doc, updateDoc, arrayUnion, arrayRemove } = FB.f;
    p.likes = liked ? (p.likes || []).filter(u => u !== myUid()) : (p.likes || []).concat([myUid()]);
    await updateDoc(doc(FB.db, "photos", id), { likes: liked ? arrayRemove(myUid()) : arrayUnion(myUid()) });
  }
}
async function dbAddPhotoComment(id, body) {
  const c = { id: uid(), author_id: myUid(), author_name: S.user.name, body: body, createdAt: Date.now() };
  if (S.mode === "demo") {
    demoMutate(d => { const p = d.photos.find(x => x.id === id); if (p) { p.comments = p.comments || []; p.comments.push(c); } });
  } else {
    const { doc, updateDoc, arrayUnion } = FB.f;
    const p = S.photos.find(x => x.id === id);
    if (p) p.comments = (p.comments || []).concat([c]);
    await updateDoc(doc(FB.db, "photos", id), { comments: arrayUnion(c) });
  }
}

      sendBtn.disabled = !ta.value.trim();
    });
    ta.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
    sendBtn.addEventListener("click", sendChat);

    /* 🔍 대화 검색 — 입력하면 일치 메시지만 추리고, 일치 부분을 강조합니다 */
    const ci = $("#chatSearch", v);
    const cbar = $("#chatSearchBar", v);
    const applyQ = () => {
      S.chatQuery = ci.value;
      cbar.classList.toggle("has-q", !!ci.value);
      renderMessages();
    };
    ci.addEventListener("input", applyQ);
    ci.addEventListener("search", applyQ);
    ci.addEventListener("keydown", e => { if (e.key === "Escape") { ci.value = ""; applyQ(); } });
    $("#chatSearchClear", v).addEventListener("click", () => { ci.value = ""; applyQ(); ci.focus(); });
  }
  renderMessages();
}

async function sendChat() {
  const ta = $("#chatIn");
  if (!ta) return;
  const body = ta.value.trim();
  if (!body) return;
  ta.value = ""; ta.style.height = "auto";
  $("#chatSend").disabled = true;
  try { await dbSendMessage(body); } catch (e) { toast(fbErrMsg(e)); }
}

function renderMessages() {
  const box = $("#msgs");
  if (!box) return;
  const q = String(S.chatQuery || "").trim();
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  let list = S.messages.slice().sort((a, b) => a.createdAt - b.createdAt);
  if (q) {
    const s = q.toLowerCase();
    list = list.filter(m => String(m.body || "").toLowerCase().indexOf(s) >= 0
      || String(m.author_name || "").toLowerCase().indexOf(s) >= 0);
  }
  let html = "", lastDay = "";
  if (q) html += '<div class="mhits"><span>🔍 ‘' + esc(q) + '’ 일치 메시지 ' + list.length + "개</span></div>";
  list.forEach(m => {
    const day = ymd(m.createdAt);
    if (day !== lastDay) { html += '<div class="mday"><span>' + fmtDay(m.createdAt) + "</span></div>"; lastDay = day; }
    const me = m.author_id === myUid();
    html += '<div class="mrow' + (me ? " me" : "") + '">' +
      (me ? "" : avatarHtml(m.author_name, "av", m.author_id)) +
      '<div class="mbody">' +
        (me ? "" : '<span class="mwho">' + hlQ(m.author_name, q) + "</span>") +
        '<div class="bubble">' + hlQ(m.body, q) + "</div>" +
        '<span class="mtime">' + fmtTime(m.createdAt) + "</span>" +
      "</div></div>";
  });
  box.innerHTML = html || '<div class="empty" style="margin:auto"><span>' + (q ? "🔍" : "💬") + "</span>" +
    (q ? "일치하는 메시지가 없어요.<br>다른 말로 검색해 보세요." : "첫 메시지를 보내보세요.") + "</div>";
  if (q) box.scrollTop = 0;
  else if (nearBottom || S.tab === "chat") box.scrollTop = box.scrollHeight;
}

async function dbSendMessage(body) {
  const m = { id: uid(), author_id: myUid(), author_name: S.user.name, body: body, createdAt: Date.now() };
  if (S.mode === "demo") {
    demoMutate(d => { d.messages.push(Object.assign({}, m)); });
  } else {
    const { collection, addDoc, serverTimestamp } = FB.f;
    await addDoc(collection(FB.db, "chat_messages"), { author_id: myUid(), author_uid: myUid(), author_name: S.user.name, body: body, createdAt: serverTimestamp() });
  }
}

  }));

  /* 🚫 거절된 신청 카드 — 왼쪽으로 밀면 삭제 버튼(터치·마우스 드래그) */
  const SWIPE_W = 92;
  const closeOther = keep => $$("[data-swipe]", v).forEach(o => {
    if (o === keep) return;
    o.classList.remove("open");
    const f = $("[data-front]", o);
    if (f) { f.style.transition = ""; f.style.transform = "translateX(0)"; }
  });
  $$("[data-swipe]", v).forEach(w => {
    const front = $("[data-front]", w);
    if (!front) return;
    let x0 = 0, dx = 0, dragging = false, moved = false;
    const base = () => (w.classList.contains("open") ? -SWIPE_W : 0);
    const paint = px => { front.style.transform = "translateX(" + px + "px)"; };
    const start = x => { x0 = x; dx = 0; dragging = true; moved = false; closeOther(w); front.style.transition = "none"; };
    const move = x => {
      if (!dragging) return;
      dx = x - x0;
      if (Math.abs(dx) > 5) moved = true;
      paint(Math.max(-SWIPE_W - 22, Math.min(0, base() + dx)));
    };
    const end = () => {
      if (!dragging) return;
      dragging = false;
      front.style.transition = "";
      const cur = base() + dx;
      if (cur < -SWIPE_W / 2) { w.classList.add("open"); paint(-SWIPE_W); }
      else { w.classList.remove("open"); paint(0); }
    };
    front.addEventListener("touchstart", e => start(e.touches[0].clientX), { passive: true });
    front.addEventListener("touchmove", e => move(e.touches[0].clientX), { passive: true });
    front.addEventListener("touchend", end);
    front.addEventListener("touchcancel", end);
    front.addEventListener("mousedown", e => {
      start(e.clientX);
      const mv = ev => move(ev.clientX);
      const up = () => { document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); end(); };
      document.addEventListener("mousemove", mv);
      document.addEventListener("mouseup", up);
    });
    /* 드래그 직후의 클릭은 무시 (다시 승인 버튼 오작동 방지) */
    front.addEventListener("click", e => {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
    }, true);
  });
  $$("[data-deluser]", v).forEach(b => b.addEventListener("click", async () => {
    const m = memberOf(b.dataset.deluser);
    if (!m) return;
    if (!confirm("‘" + m.name + "’ 님의 가입 신청 기록을 삭제할까요?\n삭제하면 되돌릴 수 없습니다.")) return;
    try { await dbRemoveMember(m.uid); toast("가입 신청을 삭제했습니다"); } catch (e) { toast(fbErrMsg(e)); }
  }));
  $("#btnMyAvatar").addEventListener("click", openAvatarSheet);
  $("#setFb").addEventListener("click", openCfgSheet);
  const setTeamBtn = $("#setTeam");
  if (setTeamBtn) setTeamBtn.addEventListener("click", openTeamNameSheet);   /* 관리자에게만 있는 항목 */
  const setKakaoBtn = $("#setKakao");

  const setKakaoJsBtn = $("#setKakaoJs");
  if (setKakaoJsBtn) setKakaoJsBtn.addEventListener("click", openKakaoJsKeySheet);
  $("#setGuide").addEventListener("click", openGuideSheet);
  $("#setLogout").addEventListener("click", doLogout);
  const rs = $("#setReset");
  if (rs) rs.addEventListener("click", () => {

  });
}

/* ---------- 설정 시트들 ---------- */
/* =====================================================================
   프로필 사진 설정 — 사진(가운데 정사각 크롭 → 160×160 JPEG) 또는 이모티콘
   ===================================================================== */
/* 고른 사진을 가운데 정사각으로 잘라 160×160 JPEG 로 압축 (80KB 미만 목표) */
function avatarFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const side = Math.min(img.width, img.height);
        const sx = Math.round((img.width - side) / 2);
        const sy = Math.round((img.height - side) / 2);
        const c = document.createElement("canvas");
        c.width = 160; c.height = 160;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 160, 160);
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, sx, sy, side, side, 0, 0, 160, 160);
        let q = 0.82;
        let data = c.toDataURL("image/jpeg", q);
        while (data.length * 0.75 > AVATAR_KB_MAX && q > 0.3) { q -= 0.07; data = c.toDataURL("image/jpeg", q); }
        URL.revokeObjectURL(url);
        if (data.length > AVATAR_RULE_MAX) { reject(new Error("사진이 너무 커서 저장할 수 없습니다. 다른 사진을 골라주세요")); return; }
        resolve({ data: data, kb: Math.round((data.length * 0.75) / 1024), q: Math.round(q * 100), src: img.width + "×" + img.height });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
    img.src = url;
  });
}

/* 프로필 저장 — LIVE: users/{uid}.avatarData · DEMO: localStorage */
async function saveAvatar(v) {
  const val = String(v || "");
  if (S.mode === "demo") {
    const d = demoGet();
    const u = (d.users || []).filter(x => x.uid === myUid())[0];
    if (u) { u.avatarData = val; demoWrite(d); }
    syncDemo();
    renderAll();
    return;
  }
  const { doc, setDoc } = FB.f;
  await setDoc(doc(FB.db, "users", myUid()), { avatarData: val }, { merge: true });
  S.user = Object.assign({}, S.user, { avatarData: val });
  const me = memberOf(myUid());
  if (me) me.avatarData = val;
  renderAll();
}

function renderCurrent() {

  else if (S.tab === "photos") renderPhotos();
  else if (S.tab === "rest") renderRest();
  else if (S.tab === "chat") renderChat();

function updateDots() {

function setTab(t) {
  /* 팀원관리로 들어가기 전에 보던 탭을 기억해 두었다가 ← 돌아가기로 되돌아옵니다 */
  if (t !== "team" && S.tab !== t) S.lastMainTab = t;
  /* 사진 탭에 들어올 때는 늘 앨범 목록(2열 커버 그리드)부터 */
