<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리팀 허브">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>우리팀 허브 · 팀 소통·공지</title>
<style>
:root{
  --bg:#eef1f7; --card:#ffffff; --ink:#141a24; --ink2:#5c6577; --ink3:#8a93a6;
  --line:#e7eaf1; --line2:#f1f3f8;
  --brand:#2f6bf6; --brand-d:#1f52cf; --brand-soft:#eaf1ff;
  --danger:#e5484d; --danger-soft:#fdecec; --warn:#e08a00; --warn-soft:#fff5e2;
  --ok:#158f5f; --ok-soft:#e7f7ef;
  --radius:18px; --shadow:0 2px 10px rgba(20,26,36,.05), 0 12px 28px -18px rgba(20,26,36,.22);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; display:flex; justify-content:center;
  min-height:100dvh; letter-spacing:-.012em; font-size:15px; line-height:1.5;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{outline:none}
::-webkit-scrollbar{width:0;height:0}
.hidden{display:none !important}

/* ============ shell ============ */
.app{
  position:relative; width:100%; max-width:460px; background:var(--bg);
  min-height:100dvh; display:flex; flex-direction:column; overflow:hidden;
}
@media (min-width:760px){
  body{
    padding:22px 0; align-items:center;
    background:
      radial-gradient(1200px 600px at 15% -10%, #dee7fb 0%, rgba(222,231,251,0) 60%),
      radial-gradient(900px 500px at 95% 110%, #e6e2fb 0%, rgba(230,226,251,0) 55%),
      #f6f7fb;
  }
  .app{
    min-height:0; height:calc(100dvh - 44px); max-height:920px;
    border-radius:26px; border:1px solid #fff;
    box-shadow:0 30px 70px -30px rgba(20,30,60,.35), 0 2px 0 rgba(255,255,255,.8) inset;
  }
}

/* ============ screens ============ */
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ============ boot (로그인 상태 확인 중) ============ */
#scr-boot{align-items:center;justify-content:center;background:linear-gradient(180deg,#FFFFFF 0%,#F7F9FC 100%)}
.boot-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 28px;width:100%;max-width:340px}
.boot-wrap .mark{
  width:58px;height:58px;border-radius:18px;
  background:linear-gradient(160deg,#1E3A5F 0%,#17304F 52%,#13263F 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 22px -14px rgba(19,38,63,.85), inset 0 1px 0 rgba(255,255,255,.10);
}
.boot-wrap .mark svg{width:31px;height:31px;display:block}
.boot-txt{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.boot-txt b{font-size:19px;font-weight:800;letter-spacing:-.03em;color:#191F28}
.boot-txt span{font-size:12.5px;font-weight:500;letter-spacing:-.01em;color:#94A3B8}
.boot-spin{
  margin-top:26px;width:22px;height:22px;border-radius:50%;
  border:2.5px solid #E3E8EF;border-top-color:#1E3A5F;
  animation:bootspin .8s linear infinite;
}
@keyframes bootspin{to{transform:rotate(360deg)}}
.boot-retry{margin-top:22px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.boot-retry p{margin:0;font-size:12.5px;line-height:1.65;color:#6B7684;letter-spacing:-.01em}
.boot-retry .btn{width:100%;max-width:220px;background:linear-gradient(135deg,#22456B 0%,#1A3355 52%,#13263F 100%);box-shadow:0 12px 24px -14px rgba(19,38,63,.85), inset 0 1px 0 rgba(255,255,255,.12)}
.boot-retry .btn-link{margin-top:2px;text-underline-offset:3px}

/* ============ auth (화이트 미니멀 + 딥 네이비) ============ */
#scr-auth{overflow-y:auto;display:none}
#scr-auth.active{display:block}
.auth-wrap{
  min-height:100%; display:flex; flex-direction:column;
  padding:calc(56px + env(safe-area-inset-top,0px)) 24px calc(30px + var(--safe-b));
  background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 56%,#F8FAFC 100%);
}

/* 상단 브랜드 */
.auth-brand{display:flex;flex-direction:column;align-items:flex-start}
.auth-brand .mark{
  width:58px;height:58px;border-radius:18px;
  background:linear-gradient(160deg,#1E3A5F 0%,#17304F 52%,#13263F 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 22px -14px rgba(19,38,63,.85), inset 0 1px 0 rgba(255,255,255,.10);
}
.auth-brand .mark svg{width:31px;height:31px;display:block}
.auth-brand h1{
  margin:22px 0 0;font-size:31px;line-height:1.22;font-weight:800;
  letter-spacing:-.04em;color:#191F28;
}
.auth-brand p{
  margin:9px 0 0;font-size:13.5px;line-height:1.5;font-weight:500;
  letter-spacing:-.02em;color:#8B95A1;
}

/* ============ 공통 버튼 · 입력칸 (시트·폼에서 함께 사용) ============ */
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 6px 3px;letter-spacing:-.01em}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:#fafbfe;border-radius:12px;
  padding:12px 13px;font-size:16px;transition:.15s;appearance:none;   /* iOS: 16px 미만이면 포커스 시 화면이 확대됩니다 */
}
.field textarea{min-height:96px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{background:#fff;border-color:#b9cbff;box-shadow:0 0 0 3px rgba(47,107,246,.12)}
.hint{font-size:11.5px;color:var(--ink3);margin:5px 0 0 3px;line-height:1.5}
.field .hint{font-size:11.5px;color:var(--ink3);margin:5px 0 0 3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 18px;border-radius:13px;font-weight:700;font-size:14.5px;
  background:var(--brand);color:#fff;transition:.16s;width:100%;
  box-shadow:0 6px 16px -8px rgba(47,107,246,.7);
}
.btn:active{transform:scale(.985)}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:10px;width:auto;box-shadow:none}
.btn.ghost{background:#f2f5fb;color:var(--ink);box-shadow:none}
.btn.ghost-line{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none}
.btn.event{background:#f3f0ff;color:#5b46c9;border:1px solid #ddd5ff;box-shadow:none}
.btn.ok{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-link{display:block;width:100%;text-align:center;font-size:12.5px;color:var(--ink3);margin-top:14px;padding:6px;text-decoration:underline;text-underline-offset:3px}

/* 세그 탭 + 폼 */
.auth-form{margin-top:34px;display:flex;flex-direction:column}
#scr-auth .seg{
  display:flex;gap:4px;padding:4px;background:#F2F4F6;border-radius:14px;margin:0 0 24px;
}
#scr-auth .seg button{
  flex:1 1 0;height:44px;border-radius:11px;background:transparent;
  font-size:15px;font-weight:600;letter-spacing:-.02em;color:#8B95A1;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;
}
#scr-auth .seg button.on{
  background:#FFFFFF;color:#191F28;font-weight:700;
  box-shadow:0 1px 3px rgba(25,31,40,.08), 0 1px 1px rgba(25,31,40,.04);
}

#scr-auth .field{margin-bottom:16px}
#scr-auth .field label{
  display:block;font-size:13px;font-weight:600;color:#6B7684;
  margin:0;padding:0 2px 8px;letter-spacing:-.015em;
}
#scr-auth .field input{
  width:100%;height:56px;border:1px solid transparent;background:#F2F4F6;border-radius:15px;
  padding:0 17px;font-size:16.5px;font-weight:600;letter-spacing:-.02em;color:#191F28;
  transition:background .16s ease,border-color .16s ease,box-shadow .16s ease;appearance:none;
}
#scr-auth .field input::placeholder{color:#B0B8C1;font-weight:500}
#scr-auth .field input:focus{background:#FFFFFF;border-color:#1E3A5F;box-shadow:0 0 0 3px rgba(30,58,95,.10)}
#scr-auth .hint,#scr-auth .field .hint{font-size:11.5px;color:#94A3B8;margin:8px 0 0 2px;line-height:1.5}

/* 풀폭 로그인 / 가입 신청 버튼 */
#scr-auth .btn{
  display:inline-flex;align-items:center;justify-content:center;width:100%;height:56px;
  margin-top:10px;padding:0 18px;border-radius:15px;
  font-size:17px;font-weight:700;letter-spacing:-.02em;color:#FFFFFF;
  background:linear-gradient(135deg,#22456B 0%,#1A3355 52%,#13263F 100%);
  box-shadow:0 12px 24px -14px rgba(19,38,63,.85), inset 0 1px 0 rgba(255,255,255,.12);
}
#scr-auth .btn:active{transform:scale(.99)}
#scr-auth #loginErr,#scr-auth #signupErr{margin:12px 0 0;font-size:12.5px;line-height:1.5;text-align:center}

/* 체험(미리보기) 모드 박스 */
#scr-auth .demo-box{margin-top:22px;border:1px solid #E9EDF2;border-radius:16px;padding:14px;background:#F8FAFC}
#scr-auth .demo-box h4{margin:0 0 4px;font-size:12.5px;font-weight:700;color:#4E5968;display:flex;align-items:center;gap:6px}
#scr-auth .demo-box p{margin:0 0 11px;font-size:11.5px;color:#8B95A1;line-height:1.55}
#scr-auth .demo-box .badge{background:#EDF2F8;color:#3C5A7D;border-color:#DCE5EF}
#scr-auth .demo-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#scr-auth .demo-btns button{
  background:#FFFFFF;border:1px solid #E9EDF2;border-radius:12px;padding:10px 4px;
  font-size:11.5px;font-weight:700;color:#4E5968;line-height:1.35;
}
#scr-auth .demo-btns button span{display:block;font-size:15px;margin-bottom:2px}
#scr-auth .demo-btns button:active{background:#EDF2F8;border-color:#DCE5EF;color:#1E3A5F}
#scr-auth .btn-link{
  display:block;width:100%;text-align:center;font-size:12.5px;color:#94A3B8;margin-top:14px;padding:8px;
  text-decoration:underline;text-underline-offset:3px;
}

/* 작은 화면(예: 667px 높이)에서도 스크롤 없이 들어오도록 */
@media (max-height:720px){
  .auth-wrap{padding-top:calc(34px + env(safe-area-inset-top,0px))}
  .auth-brand h1{font-size:28px;margin-top:18px}
  .auth-form{margin-top:26px}
  #scr-auth .seg{margin-bottom:20px;padding:3px}
  #scr-auth .seg button{height:40px}
  #scr-auth .field{margin-bottom:13px}
  #scr-auth .field input{height:52px}
  #scr-auth .btn{height:52px}
  .auth-foot{padding-top:26px}
}

/* 하단 체험 모드 링크 */
.auth-foot{
  margin:auto 0 0;padding-top:44px;text-align:center;
  font-size:13px;color:#8B95A1;line-height:1.7;letter-spacing:-.015em;
}
.auth-foot b{font-weight:600;color:#64748B}
.auth-foot a{
  display:inline-block;color:#8B95A1;font-weight:500;text-decoration:underline;
  text-decoration-color:rgba(139,149,161,.45);text-underline-offset:3px;padding:8px 6px;
}

/* ============ pending ============ */
#scr-pending{background:var(--bg);align-items:center;justify-content:center;padding:30px 24px calc(30px + var(--safe-b))}
.pending-card{background:#fff;border-radius:24px;padding:30px 22px;text-align:center;box-shadow:var(--shadow);width:100%;max-width:360px}
.pending-ico{
  width:66px;height:66px;border-radius:50%;background:var(--warn-soft);color:var(--warn);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
}
.pending-card h2{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.03em}
.pending-card p{margin:0 0 4px;font-size:13px;color:var(--ink2);line-height:1.6}
.pending-who{
  margin:16px 0 18px;padding:13px;border-radius:14px;background:#f7f9fd;border:1px solid var(--line);
  font-size:13px;text-align:left;
}
.pending-who b{display:block;font-size:14.5px;margin-bottom:2px}
.pending-who span{color:var(--ink3);font-size:12px}
.pending-note{font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.6}

/* ============ main ============ */
#scr-main{display:none}
#scr-main.active{display:flex}
.hdr{
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px; background:rgba(238,241,247,.86);
  backdrop-filter:saturate(160%) blur(14px); border-bottom:1px solid rgba(20,26,36,.05);
  display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:5;
}
.hdr-logo{
  width:34px;height:34px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(145deg,#2f6bf6,#6f46ea);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px -4px rgba(47,107,246,.8);
}
.hdr-txt{flex:1;min-width:0}
.hdr-txt b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.hdr-txt span{display:block;font-size:11px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  padding:3px 7px;border-radius:20px;background:#fff2d9;color:#a06a00;border:1px solid #ffe3ae;
  white-space:nowrap;
}
.badge.live{background:var(--ok-soft);color:var(--ok);border-color:#c9eeda}
.avatar{
  width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.02em;
  overflow:hidden;background:#dfe5f2;
}
.avatar.lg{width:46px;height:46px;border-radius:15px;font-size:16px}
.avatar.sm{width:28px;height:28px;border-radius:9px;font-size:11px}
.avatar.xs{width:20px;height:20px;border-radius:7px;font-size:9.5px}
/* 사진 프로필 — 정사각 크롭 후 동그랗게 */
.avatar.photo{background:#e4e8f1;border-radius:50%}
.avatar.photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
/* 이모티콘 프로필 — 깔끔한 배경 원 안에 중앙 정렬 */
.avatar.emo{background:#eef2fb;color:#26303f;border-radius:50%;font-size:16px;line-height:1}
.avatar.xs.emo{font-size:11px}
.avatar.sm.emo{font-size:14px}
.avatar.av.emo{font-size:15px}
.avatar.lg.emo{font-size:23px}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;padding:16px 16px calc(18px);}
.view.active{display:block}
.view.chat.active{display:flex;flex-direction:column;padding:0;overflow:hidden}

/* ============ common bits ============ */
.team-back{
  display:inline-flex;align-items:center;gap:3px;margin:0 0 10px -6px;padding:5px 8px;border-radius:9px;
  font-size:12.5px;font-weight:800;color:var(--brand-d);letter-spacing:-.02em;
}
.team-back:active{background:rgba(47,107,246,.08)}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 13px}
.vhead h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.035em}
.vhead .sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(20,26,36,.03)}
.sec-title{font-size:12px;font-weight:800;color:var(--ink3);margin:18px 4px 8px;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 10px;margin:0 -1px}
.chip{
  padding:7px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;flex-shrink:0;
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;padding:46px 20px;color:var(--ink3);font-size:13px;line-height:1.7}
.empty span{display:block;font-size:30px;margin-bottom:10px;opacity:.75}

/* ============ notices ============ */
.note{
  padding:14px 15px;margin-bottom:10px;border-radius:var(--radius);background:#fff;
  box-shadow:var(--shadow);border:1px solid rgba(20,26,36,.03);position:relative;
  transition:.15s;
}
.note:active{transform:scale(.993)}
.note.pinned{border-left:3px solid var(--brand)}
.note.important{background:linear-gradient(180deg,#fffdf7,#fff)}
.note .top{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.tag{
  font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;letter-spacing:-.01em;
  display:inline-flex;align-items:center;gap:3px;
}
.tag.pin{background:var(--brand-soft);color:var(--brand-d)}
.tag.imp{background:var(--danger-soft);color:var(--danger)}
.tag.new{background:#eaf7ef;color:#187a52}
.tag.gray{background:#f1f3f8;color:var(--ink2)}
.note h3{margin:0 0 6px;font-size:15.5px;font-weight:750;letter-spacing:-.03em;line-height:1.4}
.note .prev{
  margin:0 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.note .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3)}
.note .meta .dot{width:2px;height:2px;border-radius:50%;background:#ccd3e0}
.note .meta .right{margin-left:auto;display:flex;gap:9px;align-items:center}
.dotread{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block;margin-right:3px}

/* notice detail */
.article{padding:4px 2px 0}
.article h2{font-size:20px;margin:6px 0 10px;font-weight:800;letter-spacing:-.035em;line-height:1.4}
.article .ameta{display:flex;align-items:center;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.article .ameta .who b{font-size:13px;display:block}
.article .ameta .who span{font-size:11px;color:var(--ink3)}
.article .body{font-size:14.5px;line-height:1.78;padding:16px 0;color:#26303f;white-space:pre-wrap;word-break:break-word}
.readbox{
  display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:14px;background:#f7f9fd;
  border:1px solid var(--line);font-size:12px;color:var(--ink2);margin-bottom:8px;
}
.readbox.done{background:var(--ok-soft);border-color:#cfeee0;color:#177a51}
.readbox b{font-size:13px}
.cmt{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--line2)}
.cmt:last-child{border-bottom:0}
.cmt .ct{flex:1;min-width:0}
.cmt .ct .cn{font-size:12px;font-weight:800;margin-bottom:2px;display:flex;gap:6px;align-items:center}
.cmt .ct .cn span{font-weight:500;color:var(--ink3);font-size:10.5px}
.cmt .ct p{margin:0;font-size:13px;line-height:1.6;color:#2a3342;white-space:pre-wrap;word-break:break-word}
.cmt-input{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.cmt-input input{
  flex:1;border:1px solid var(--line);background:#fafbfe;border-radius:12px;padding:11px 12px;font-size:13.5px;
}
.cmt-input button{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ============ duty ============ */
.cal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 12px 10px;border:1px solid rgba(20,26,36,.03)}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-head b{font-size:16px;font-weight:800;letter-spacing:-.03em}
.cal-head .nav{display:flex;gap:2px;align-items:center}
.cal-head .nav button{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.cal-head .nav button:active{background:var(--line2)}
.cal-head .today-btn{font-size:11.5px;font-weight:700;color:var(--brand);padding:6px 9px;border-radius:9px;background:var(--brand-soft);margin-right:2px;white-space:nowrap}
.cal-head .nav button.prn{width:auto;height:28px;padding:0 8px;gap:3px;font-size:11px;font-weight:800;color:#8a4b00;background:#fff4e0;border:1px solid #ffdfa4;border-radius:9px;margin-right:4px;white-space:nowrap;letter-spacing:-.03em}
.cal-head .nav button.prn:active{background:#ffe9c7}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dow span{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink3);padding:4px 0}
.dow span.sun{color:#e04b4b}.dow span.sat{color:#2f6bf6}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{
  height:70px;border-radius:10px;padding:4px 2px 3px;display:flex;flex-direction:column;
  align-items:center;gap:1px;position:relative;transition:.15s;overflow:hidden;
}
.day.hasmine{background:#f5f8ff}
.day:active{background:var(--line2)}
.day .num{font-size:12px;font-weight:700;color:var(--ink);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day.out .num{color:#c3cad8}
.day.today .num{background:var(--brand);color:#fff;box-shadow:0 3px 8px -3px rgba(47,107,246,.9)}
.day.sel{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px #bfd2ff}
.day .dcells{width:100%;display:flex;flex-direction:column;gap:1.5px;align-items:stretch;padding:0 1px}
.day .dpill{
  font-size:7px;font-weight:800;line-height:1.4;padding:1px 1px;border-radius:4px;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;letter-spacing:-.07em;text-align:center;
}
.day .dpill .em{display:inline;font-style:normal;font-size:7.5px;letter-spacing:0;margin-right:1px}
.cal{padding-left:7px;padding-right:7px}
.day .dpill.more{letter-spacing:-.02em;font-size:7px}
.dpill.island-day{background:#0ea5e9}
.dpill.island-night{background:#2b3480}
.dpill.duty{background:#e58a09}
.dpill.edu{background:#059669}
.dpill.board{background:#dc2626}
.dpill.opinion{background:#2563eb}
.dpill.survey{background:#16a34a}
.dpill.more{background:#e9edf6;color:#5b6474}
/* ⛴️ 섬·교육 — 주 단위 연속 막대 */
.grid.wklist{display:block}
.grid.wklist .wk{position:relative}
.grid.wklist .wk + .wk{margin-top:2px}
.wkdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.grid.wklist .day{height:auto;min-height:70px}
.wkbars{position:absolute;left:0;right:0;top:26px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;pointer-events:none;z-index:2}
.wkbars{overflow:visible}
.sbar{display:flex;align-items:center;gap:2px;height:13px;min-width:0;margin:1px 0;border-radius:5px;padding:0 3px;font-size:8px;font-weight:800;color:#fff;letter-spacing:-.05em;overflow:hidden;white-space:nowrap}
.sbar .em{font-style:normal;font-size:8px;letter-spacing:0}
.sbar .rg{font-weight:600;font-size:7px;opacity:.85;margin-left:2px;letter-spacing:0}
.sbar.island-day{background:#0ea5e9}.sbar.island-night{background:#2b3480}.sbar.edu{background:#059669}
.sbar.mine{box-shadow:0 0 0 1.5px #fff inset, 0 2px 6px -3px rgba(20,26,36,.45)}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:9px 6px 4px;border-top:1px solid var(--line2);margin-top:5px}
.legend span{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--ink2)}
.legend i{width:7px;height:7px;border-radius:2px;display:block}
.legend i.island-day{background:#0ea5e9}
.legend i.island-night{background:#2b3480}
.legend i.duty{background:#e58a09}
.legend i.edu{background:#059669}
.legend i.board{background:#dc2626}
.legend i.opinion{background:#2563eb}
.legend i.survey{background:#16a34a}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0 4px}
.sum{padding:13px;border-radius:15px;background:#fff;box-shadow:var(--shadow);border:1px solid rgba(20,26,36,.03)}
.sum .lb{font-size:10.5px;font-weight:800;color:var(--ink3);display:flex;align-items:center;gap:4px;margin-bottom:7px}
.sum .val{font-size:15px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
.sum .val small{font-size:11px;font-weight:600;color:var(--ink3);display:block;margin-top:2px;letter-spacing:-.01em}
.sum.mine{background:linear-gradient(140deg,#2f6bf6,#5a53ec);color:#fff;border:0}
.sum.mine .lb{color:rgba(255,255,255,.82)}
.sum.mine .val small{color:rgba(255,255,255,.8)}
.duty-item{
  display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:13px;background:#f8f9fd;
  border:1px solid var(--line);margin-bottom:7px;
}
.duty-item .di{flex:1;min-width:0}
.duty-item .di b{font-size:13.5px;display:flex;align-items:center;gap:6px}
.duty-item .di p{margin:2px 0 0;font-size:11.5px;color:var(--ink3);white-space:pre-wrap}
.type-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;color:#fff}
/* 당직 담당자 변경 이력 */
.dhist{margin-top:6px;padding:6px 8px;background:#fff;border:1px solid #eaeef8;border-radius:9px;font-size:10.5px;line-height:1.6;color:var(--ink3)}
.dhist .dh-t{display:block;font-size:10px;font-weight:800;color:#96590a;margin-bottom:2px}
.dhist .to{color:var(--ink2);font-weight:800}
.dhist .dh-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin-top:1px}
.dhist .dh-line{font-size:11.5px;color:var(--ink2);font-weight:700}
.dhist .dh-line i{font-style:normal;color:#b9c0cd}
.dhist .dh-meta{font-size:9.5px;color:#9aa3b2;letter-spacing:-.01em}
.dhist .dmore{color:#9aa3b2}
/* 당직자 변경(교체) 안내 */
.duty-swap{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:9px 11px;border-radius:11px;background:#fff8ec;border:1px solid #f3dfb9}
.duty-swap .em{font-size:15px;line-height:1.2}
.duty-swap b{display:block;font-size:12px;color:#8a5a00}
.duty-swap b i{font-style:normal;color:#c79a4e;margin:0 1px}
.duty-swap p{margin:3px 0 0;font-size:11px;line-height:1.55;color:#9a6b1c}
.duty-swap p b{display:inline;font-size:11px;color:#8a5a00}
.edmark{font-style:normal;font-size:9px;color:#e07a00;margin-left:2px;vertical-align:super}
.day.edited .num{color:#96590a}

/* ============ photos ============ */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 -1px}
.pcell{
  position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#e4e8f1;
}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pcell .plike{
  position:absolute;right:5px;bottom:5px;font-size:9.5px;font-weight:800;color:#fff;
  background:rgba(12,16,26,.52);backdrop-filter:blur(3px);padding:2px 5px;border-radius:20px;
  display:flex;align-items:center;gap:2px;
}
.pcell .pcap{
  position:absolute;inset:auto 0 0 0;padding:14px 42px 6px 8px;font-size:9.5px;color:#fff;line-height:1.3;
  background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pcell .pav{position:absolute;left:5px;top:5px;display:flex;line-height:0}
.pcell .pav .avatar{border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.9)}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.phead .cnt{font-size:11.5px;color:var(--ink3)}
.upbtn{
  display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--brand);color:#fff;
  font-size:12.5px;font-weight:800;box-shadow:0 6px 14px -8px rgba(47,107,246,.9);
}
.lightbox{position:fixed;inset:0;z-index:80;background:#0b0e15;display:flex;flex-direction:column;pointer-events:auto}

/* ============ 🔍 검색창 (공지 · 대화) ============ */
.searchbar{
  display:flex;align-items:center;gap:8px;height:42px;padding:0 8px 0 12px;margin:0 0 10px;
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:.15s;
}
.searchbar:focus-within{border-color:#bcd0f7;box-shadow:0 0 0 3px rgba(47,107,246,.10)}
.searchbar .sicon{font-size:13px;line-height:1;opacity:.72;flex-shrink:0}
.searchbar input{
  flex:1;min-width:0;border:0;background:transparent;outline:0;
  font-size:13px;font-weight:600;color:var(--ink);font-family:inherit;
}
.searchbar input::placeholder{color:var(--ink3);font-weight:500}
.searchbar input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.searchbar .sclear{
  display:none;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  background:#eef1f7;color:var(--ink2);font-size:11px;font-weight:800;flex-shrink:0;
}
.searchbar.has-q .sclear{display:flex}
mark.hl{background:#fff0ae;color:inherit;border-radius:3px;padding:0 1px;font-weight:inherit}
.chat-search{padding:9px 14px 1px;flex-shrink:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px)}
.chat-search .searchbar{height:38px;margin:0 0 8px}
.mhits{display:flex;justify-content:center;margin:0 0 4px}
.mhits span{background:#eef3ff;color:var(--brand-d);font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:20px}

/* ============ 📸 사진 앨범 (갤러리 스타일) ============ */
.albtop{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.albtop .newalb{
  flex:1;min-width:0;justify-content:center;background:#eef4ff;color:var(--brand-d);
  border:1px dashed #b9cbff;box-shadow:none;padding:10px 12px;font-size:12.5px;font-weight:800;
}
.albgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 11px}
.albcell{display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.albcell .cov{
  position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:#e6eaf3;
  box-shadow:0 3px 10px -4px rgba(20,26,36,.18);transition:transform .12s;
}
.albcell:active .cov{transform:scale(.982)}
.albcell .cov img{width:100%;height:100%;object-fit:cover;display:block}
.albcell .cov.ph{display:flex;align-items:center;justify-content:center;border:1px solid #dfe6f5}
.albcell .cov.ph span{display:flex;align-items:center;justify-content:center;color:#9aa7bf}
.albcell .cov.ph span svg{width:38px;height:38px;display:block}
.albcell .cov.ph.all{background:linear-gradient(150deg,#dbe6ff,#cfdaf6 58%,#e3defb)}
.albcell .cov.ph.alb{background:linear-gradient(150deg,#eef2fa,#e5ebf7 58%,#f1eefb)}
.albcell .cov.ph.unf{background:linear-gradient(150deg,#fdf0d9,#f8e9df 60%,#eef1f7)}
.albcell .nm{
  font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.02em;padding:0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.albcell .ct{font-size:10.5px;font-weight:700;color:var(--ink3);padding:0 2px;margin-top:-2px}
.albnote{font-size:10.5px;color:var(--ink3);text-align:center;margin:18px 0 0;line-height:1.65}
.albhead{margin:0 2px 12px}
.albhead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.035em;word-break:break-word;line-height:1.28}
.albhead .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.albup{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px 12px;margin:0 0 10px;
  border-radius:13px;background:var(--brand);color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 8px 18px -12px rgba(47,107,246,.95);
}
.albup:active{transform:scale(.99)}
.foldtools{
  display:flex;align-items:center;gap:6px;margin:0 0 11px;padding:8px 10px;border-radius:12px;
  background:#f7f9fd;border:1px solid #e7edf8;flex-wrap:wrap;
}
.foldtools b{font-size:12px;color:var(--ink);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foldtools button{font-size:11.5px;font-weight:800;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:5px 9px;border-radius:9px}
.foldtools button.danger{color:var(--danger);border-color:#f6d4d5}
.foldtools .hint{font-size:10.5px;color:var(--ink3)}
.chips.wrap{flex-wrap:wrap;overflow:visible}

/* ============ 📸 사진 · 여러 장 올리기 ============ */
.chip .cn{font-style:normal;font-size:10.5px;font-weight:800;opacity:.62;margin-left:3px}
.pcell .ptg{
  position:absolute;right:5px;top:5px;font-size:10px;line-height:1;
  background:rgba(12,16,26,.5);backdrop-filter:blur(3px);padding:3px 5px;border-radius:20px;
}
.upempty{text-align:center;color:var(--ink3);font-size:12px;line-height:1.65;padding:14px 6px 4px}
.upgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.upcell{position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#eef1f7}
.upcell img{width:100%;height:100%;object-fit:cover;display:block}
.upcell .x{
  position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;
  background:rgba(12,16,26,.62);color:#fff;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);
}
.upcell .kb{
  position:absolute;right:4px;bottom:4px;padding:2px 6px;font-size:9px;color:#fff;
  background:rgba(12,16,26,.55);backdrop-filter:blur(3px);border-radius:20px;
}
.upcell.done:after{
  content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(15,122,82,.55);color:#fff;font-size:26px;font-weight:800;
}
.upprog{font-size:11.5px;font-weight:700;color:var(--brand-d);text-align:center;padding:8px 0 0;min-height:0}
.upprog:empty{padding:0}
.btn.up-pick{background:#eef4ff;color:var(--brand-d);border:1px dashed #b9cbff;box-shadow:none}

/* ============ chat ============ */
.chat-top{
  padding:11px 16px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-shrink:0;
}
.chat-top b{font-size:14px;font-weight:800}
.chat-top span{font-size:11px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:4px}
.chat-top .dotlive{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:2px}
.mday{text-align:center;font-size:10.5px;color:var(--ink3);margin:12px 0 10px;font-weight:700}
.mday span{background:#e2e7f1;padding:3px 10px;border-radius:20px}
.mrow{display:flex;gap:7px;align-items:flex-start;margin-bottom:7px;max-width:100%}
.mrow.me{flex-direction:row-reverse}
.mrow .av{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:1px}
.mbody{max-width:74%;display:flex;flex-direction:column;gap:3px}
.mrow.me .mbody{align-items:flex-end}
.mwho{font-size:10.5px;color:var(--ink3);margin-left:3px;font-weight:700}
.bubble{
  padding:9px 12px;border-radius:14px;background:#fff;font-size:13.8px;line-height:1.55;
  box-shadow:0 1px 3px rgba(20,26,36,.07);word-break:break-word;white-space:pre-wrap;
  border-top-left-radius:5px;
}
.mrow.me .bubble{background:var(--brand);color:#fff;border-top-left-radius:14px;border-top-right-radius:5px;box-shadow:0 3px 10px -6px rgba(47,107,246,.9)}
.mtime{font-size:9.5px;color:var(--ink3);margin:0 3px}
.composer{
  flex-shrink:0;display:flex;gap:8px;align-items:flex-end;padding:9px 12px calc(10px + var(--safe-b));
  background:#fff;border-top:1px solid var(--line);
}
.composer textarea{
  flex:1;border:1px solid var(--line);background:#f6f8fc;border-radius:19px;padding:10px 14px;
  font-size:16px;line-height:1.45;max-height:120px;min-height:40px;resize:none;overflow-y:auto;
}
.composer textarea:focus{background:#fff;border-color:#c3d3ff}
.composer .send{
  width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px -5px rgba(47,107,246,.9);
}
.composer .send[disabled]{background:#c9d2e4;box-shadow:none}

/* ============ team / admin ============ */
.mem{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;background:#fff;margin-bottom:7px;box-shadow:0 1px 4px rgba(20,26,36,.05);border:1px solid rgba(20,26,36,.03);width:100%;text-align:left}
.mem .mi{flex:1;min-width:0}
.mem .mi b{font-size:13.5px;display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
.mem .mi p{margin:2px 0 0;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:-.01em}
.pill.admin{background:#eef0ff;color:#4b3fd8}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.pending{background:var(--warn-soft);color:#96650a}
.pill.rejected{background:var(--danger-soft);color:var(--danger)}
.pend-card{background:linear-gradient(150deg,#fff8ea,#fff);border:1px solid #ffe6bc;border-radius:16px;padding:13px;margin-bottom:9px}
.pend-card .pt{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pend-card .pt .pi{flex:1;min-width:0}
.pend-card .pt b{font-size:14px;display:block}
.pend-card .pt p{margin:2px 0 0;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend-acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
/* ============ 프로필 사진 ============ */
.myprof{
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:16px;margin-bottom:10px;
  background:linear-gradient(135deg,#eef3ff,#f8faff);border:1px solid #e0e8ff;
}
.myprof .mi{flex:1;min-width:0}
.myprof .mi b{display:block;font-size:13.5px;letter-spacing:-.02em}
.myprof .mi p{margin:2px 0 0;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avprev{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0 12px}
.avprev .avatar{width:86px;height:86px;border-radius:50%!important;font-size:30px;box-shadow:0 6px 18px -8px rgba(20,26,36,.4)}
.avprev .avatar.emo{font-size:42px}
.avprev b{font-size:14.5px;letter-spacing:-.02em;margin-top:2px}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:2px}
.avcell{
  aspect-ratio:1/1;border-radius:13px;background:#f4f7fc;border:1.5px solid transparent;
  display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;transition:.12s;
}
.avcell:active{transform:scale(.94)}
.avcell.on{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(47,107,246,.13)}
.set-item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#fff;border-radius:13px;margin-bottom:7px;border:1px solid rgba(20,26,36,.03);box-shadow:0 1px 3px rgba(20,26,36,.04);width:100%;text-align:left}
.set-item .si{flex:1}
.set-item .si b{font-size:13.5px;display:block;margin-bottom:1px}
.set-item .si p{margin:0;font-size:11px;color:var(--ink3);line-height:1.45}

/* ============ tabbar ============ */
.tabbar{
  flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(255,255,255,.94);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 2px calc(5px + var(--safe-b));
}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink3);position:relative;min-width:0;overflow:visible}
.tabbar button.on{color:var(--brand)}
.tabbar button svg{width:21px;height:21px;flex-shrink:0}
.tabbar button .tl{font-size:9.5px;font-weight:800;letter-spacing:-.045em;white-space:nowrap;line-height:1.1}
.tabbar .dotn{
  position:absolute;top:0;right:calc(50% - 15px);min-width:15px;height:15px;border-radius:20px;
  background:var(--danger);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
  padding:0 4px;border:1.5px solid #fff;
}
/* 상단 프로필 아이콘 오른쪽 위 — 승인 대기 알림 */
#btnProfile{position:relative}
#avatarPendingDot{
  position:absolute;top:-3px;right:-4px;min-width:16px;height:16px;border-radius:20px;
  background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  border:1.5px solid #fff;box-shadow:0 1px 4px rgba(20,26,36,.2);pointer-events:none;
}
#avatarPendingDot.hidden{display:none}

/* ============ 🚫 거절된 신청 — 왼쪽 스와이프 삭제 ============ */
.swipe{position:relative;border-radius:14px;overflow:hidden;margin-bottom:7px;background:#e5484d}
.swipe-front{
  position:relative;z-index:2;margin-bottom:0 !important;background:#fff;
  transition:transform .19s cubic-bezier(.22,1,.36,1);touch-action:pan-y;will-change:transform;
}
.swipe-del{position:absolute;inset:0 0 0 auto;width:92px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e5484d,#c9282d)}
.swipe-del button{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:-.02em}
.swipe-del button:active{background:rgba(0,0,0,.08)}

/* ============ sheet / modal ============ */
.backdrop{
  position:absolute;inset:0;background:rgba(14,20,32,.44);z-index:60;display:flex;align-items:flex-end;
  animation:fade .18s ease; backdrop-filter:blur(2px);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-height:92%;background:#f7f8fc;border-radius:24px 24px 0 0;
  display:flex;flex-direction:column;animation:up .26s cubic-bezier(.22,1,.36,1);overflow:hidden;
  padding-bottom:var(--safe-b);
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sheet-hd{
  padding:15px 16px 11px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  border-bottom:1px solid rgba(20,26,36,.05);background:#fff;
}
.sheet-hd b{font-size:15.5px;font-weight:800;flex:1;letter-spacing:-.03em}
.sheet-hd .x{width:30px;height:30px;border-radius:50%;background:#f1f3f8;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex-shrink:0}
.sheet-bd{flex:1;overflow-y:auto;padding:16px;min-height:0}
.sheet-ft{padding:11px 16px calc(12px + var(--safe-b));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0}
.grab{width:38px;height:4px;border-radius:4px;background:#dfe4ee;margin:8px auto 0;flex-shrink:0}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:200;
  background:rgba(22,28,40,.94);color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;
  border-radius:22px;opacity:0;transition:.24s;pointer-events:none;max-width:82%;text-align:center;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.5);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{ display:flex;align-items:center;justify-content:center;gap:8px;padding:40px;color:var(--ink3);font-size:12.5px}
.spin{width:15px;height:15px;border:2px solid #d8dfec;border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hr{height:1px;background:var(--line);margin:14px 0}
.notice-bar{
  font-size:11.5px;line-height:1.55;color:#8a6414;background:#fff8e8;border:1px solid #ffe7bb;
  border-radius:12px;padding:10px 12px;margin-bottom:12px;
}

/* ============ 일정 종류 칩 · 선택 ============ */
.sc{
  display:flex;align-items:center;gap:5px;padding:5px 9px 5px 5px;border-radius:20px;background:#fff;
  border:1px solid var(--line);flex-shrink:0;font-size:11px;font-weight:700;color:var(--ink2);
}
.sc .em{font-size:12px;line-height:1}
.sc .nm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc.me{border-color:#bfd2ff;background:var(--brand-soft);color:var(--brand-d)}
.sc.island-night{
  background:linear-gradient(120deg,#1b2350 0%,#333a9e 100%);border-color:transparent;color:#fff;
  box-shadow:0 5px 14px -7px rgba(27,35,80,.95);
}
.sc.island-day{
  background:linear-gradient(120deg,#0ea5e9 0%,#33cdee 100%);border-color:transparent;color:#fff;
  box-shadow:0 5px 14px -7px rgba(14,165,233,.95);
}
.sc.duty{
  background:linear-gradient(120deg,#f59e0b 0%,#e07a00 100%);border-color:transparent;color:#fff;
  box-shadow:0 5px 14px -7px rgba(230,130,0,.9);
}
.sc.edu{
  background:linear-gradient(120deg,#10b981 0%,#059669 100%);border-color:transparent;color:#fff;
  box-shadow:0 5px 14px -7px rgba(16,185,129,.9);
}
.sc.island-night .em,.sc.island-day .em{font-size:11px;letter-spacing:-2px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.sc.island-night .nt,.sc.island-day .nt,.sc.duty .nt,.sc.edu .nt{color:rgba(255,255,255,.88)}
.sc .nt{font-size:9.5px;color:var(--ink3);font-weight:600;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-pick button{
  display:flex;align-items:center;gap:9px;padding:11px 10px;border-radius:14px;background:#fff;
  border:1.5px solid var(--line);font-size:13px;font-weight:700;text-align:left;transition:.15s;
}
.stat-pick button .em{
  font-size:16px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:#f2f5fb;flex-shrink:0;
}
.stat-pick button.island-night .em{background:linear-gradient(120deg,#1b2350,#333a9e);color:#fff}
.stat-pick button.island-day .em{background:linear-gradient(120deg,#0ea5e9,#33cdee);color:#fff}
.stat-pick button.duty .em{background:linear-gradient(120deg,#f59e0b,#e07a00);color:#fff}
.stat-pick button.edu .em{background:linear-gradient(120deg,#10b981,#059669);color:#fff}
.stat-pick button.island-day .em,.stat-pick button.island-night .em{
  width:52px;font-size:12px;letter-spacing:-1px;white-space:nowrap;
}
.stat-pick button.duty .em,.stat-pick button.edu .em{font-size:17px}
.stat-pick button.on{box-shadow:inset 0 0 0 1.5px currentColor}
.stat-pick button.island-night.on{border-color:#333a9e;background:#eef0fc}
.stat-pick button.island-day.on{border-color:#0ea5e9;background:#ecfaff}
.stat-pick button.duty.on{border-color:#e07a00;background:#fff8ec}
.stat-pick button.edu.on{border-color:#059669;background:#eefbf5}

/* 달력 모드 전환 세그먼트 */
.cal-tabs{display:flex;gap:5px;background:#e7ecf6;border-radius:14px;padding:4px;margin:0 0 12px}
.cal-tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:11px;font-size:13px;font-weight:800;color:var(--ink2);transition:.18s;letter-spacing:-.02em}
.cal-tabs button .em{font-size:13.5px;line-height:1}
.cal-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(20,26,36,.3)}
.cal-tabs button.on.duty{color:#96590a}
.cal-tabs button.on.island{color:#0b6d8f}

/* 🌊 섬 파고 · 배편 — 달력 상단 진입 카드 */
.wave-strip{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 12px;border-radius:15px;margin:-3px 0 12px;
  background:linear-gradient(118deg,#0b6d8f 0%,#1189b6 58%,#1ba4cd 100%);color:#fff;
  box-shadow:0 10px 22px -16px rgba(11,109,143,.95)}
.wave-strip .em{font-size:18px;line-height:1;flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.wave-strip .tx{display:block;min-width:0;flex:1}
.wave-strip .tx b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.wave-strip .tx small{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.85);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.wave-strip .go{flex-shrink:0;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 9px;white-space:nowrap}
.wave-strip:active{transform:scale(.99)}

/* 🌊 섬 파고 시트 */
.sea-hd{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--ink3);margin:0 2px 9px;letter-spacing:-.01em}
.sea-hd .dot{width:6px;height:6px;border-radius:50%;background:#1189b6;box-shadow:0 0 0 3px rgba(17,137,182,.15);flex-shrink:0}
.sea-hd .rf{margin-left:auto;font-size:10.5px;font-weight:800;color:#0b6d8f;background:#eaf7fc;border:1px solid #d5edf8;border-radius:20px;padding:4px 9px;white-space:nowrap;letter-spacing:-.02em}
.sea-hd .rf[disabled]{opacity:.5}
/* 자료 출처(상단) — 기상청 공공누리 제1유형 */
.sea-src{margin:0 2px 9px;font-size:9.5px;font-weight:700;color:var(--ink3);letter-spacing:-.02em;line-height:1.55}
.sea-src b{color:var(--ink2)}
.sea-src a{color:#0b6d8f;text-decoration:none;border-bottom:1px dotted #9fd3e6}
.sea-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px}
.sea-sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center}
.sea-sum b{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.sea-sum b.ok{color:#158f5f}.sea-sum b.warn{color:#c47c00}.sea-sum b.high{color:#e5484d}.sea-sum b.na{color:var(--ink3)}
.sea-sum span{display:block;font-size:10px;font-weight:700;color:var(--ink3);margin-top:1px}
.sea-na{margin:5px 2px 0;font-size:10px;font-weight:700;color:var(--ink3)}
.sea-grp{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ink2);margin:13px 2px 7px;letter-spacing:-.02em}
.sea-grp em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--ink3)}
.sea-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sea-card{position:relative;background:#fff;border:1px solid rgba(20,26,36,.06);border-radius:14px;padding:9px 10px 9px 12px;
  box-shadow:0 3px 10px -8px rgba(20,26,36,.55);overflow:hidden;text-align:left;font-family:inherit}
.sea-card.tap{width:100%;cursor:pointer;-webkit-appearance:none}
.sea-card.tap:active{transform:scale(.985)}
.sea-more{margin-top:3px;font-size:9px;font-weight:800;color:#0b6d8f;letter-spacing:-.02em}
/* 🌊 섬 선택 칩 — 상단 고정 */
.sea-chips{position:sticky;top:-16px;z-index:6;display:flex;flex-wrap:wrap;gap:5px;margin:-16px -16px 9px;padding:11px 16px 9px;
  background:#f7f8fc;border-bottom:1px solid rgba(20,26,36,.05);box-shadow:0 7px 10px -10px rgba(20,26,36,.55)}
.sea-chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:800;
  color:var(--ink2);letter-spacing:-.03em;white-space:nowrap;line-height:1.15;font-family:inherit;cursor:pointer}
.sea-chip.all{background:#eef7fb;border-color:#d8ecf5;color:#0b6d8f}
.sea-chip.on{background:#0b6d8f;border-color:#0b6d8f;color:#fff;box-shadow:0 2px 6px rgba(11,109,143,.22)}
/* 선택 섬 지금 상태 */
.sea-cur{background:linear-gradient(118deg,#0b6d8f 0%,#1189b6 58%,#1ba4cd 100%);color:#fff;border-radius:14px;padding:9px 12px;margin-bottom:8px;
  box-shadow:0 8px 18px -16px rgba(11,109,143,.95)}
.sea-cur .ct{display:flex;align-items:center;gap:6px}
.sea-cur .ct b{font-size:13.5px;font-weight:800;letter-spacing:-.03em}
.sea-cur .ct small{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:-.02em}
.sea-cur .ct .sea-badge{margin-left:auto;background:rgba(255,255,255,.2);color:#fff}
.sea-cur .cm{margin-top:2px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.92);letter-spacing:-.02em}
.sea-cur .cm b{font-weight:800;color:#fff}
.sea-cc{display:flex;flex-wrap:wrap;gap:3px 9px;margin:0 2px 8px;font-size:10px;font-weight:800;letter-spacing:-.03em;color:var(--ink3)}
.sea-cc b{font-size:11px}
.sea-cc .ok{color:#158f5f}.sea-cc .warn{color:#c47c00}.sea-cc .high{color:#e5484d}.sea-cc .na{color:var(--ink3)}
/* 16일 날짜 리스트 — 한 줄에 하루 */
.sea-list{display:flex;flex-direction:column;gap:5px}
.sr{position:relative;display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:center;background:#fff;
  border:1px solid rgba(20,26,36,.06);border-radius:12px;padding:7px 9px 7px 12px;box-shadow:0 3px 10px -9px rgba(20,26,36,.55);overflow:hidden}
.sr:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#cbd5e3}
.sr.ok:before{background:#158f5f}.sr.warn:before{background:#e08a00}.sr.high:before{background:#e5484d}
.sr.today{background:#f4fbfe;border-color:#d8eef8}
.sr-d{min-width:0}
.sr-d b{display:block;font-size:11.5px;font-weight:800;letter-spacing:-.045em;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr-d span{display:inline-block;margin-top:2px;padding:1px 5px;border-radius:20px;background:#eaf7fc;color:#0b6d8f;font-size:8.5px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.sr-m{min-width:0}
.sr-l1{display:grid;grid-template-columns:58px 1fr auto;gap:5px;align-items:baseline}
.sr-w{font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.04em}
.sr-w b{font-size:16px;font-weight:800;line-height:1.15}
.sr-w i{font-style:normal;font-size:10px;font-weight:800;color:var(--ink2);margin-left:1px}
.sr-w b.rng{font-size:13px;letter-spacing:-.055em}
.sr-nw{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:-.05em;white-space:nowrap}
.sr-split{font-size:9.5px;font-weight:700;color:var(--ink3);letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.sr-split em{font-style:normal;color:#c47c00;font-weight:800}
.sr-l2{margin-top:1px;font-size:10px;font-weight:700;color:var(--ink2);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sr-l3{margin-top:1px;font-size:9.5px;font-weight:700;color:var(--ink3);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sr-l3 em{font-style:normal;color:#0b6d8f;font-weight:800}
.sr-l3.wet{color:#0b6d8f}
.sea-rain{margin-top:1px;font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sea-rain.wet{color:#0b6d8f}
.sea-tip{margin:8px 2px 0;font-size:9.5px;font-weight:700;color:var(--ink3);letter-spacing:-.02em}
.sea-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#cbd5e3}
.sea-card.ok:before{background:#158f5f}
.sea-card.warn:before{background:#e08a00}
.sea-card.high:before{background:#e5484d}
.sea-split{margin-top:1px;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:-.02em;white-space:nowrap}
.sea-split b{font-weight:800;color:var(--ink2)}
.sea-nowave{margin-top:3px;font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:-.02em;line-height:1.25}
.sea-nowave small{display:block;font-size:9px;font-weight:600;color:var(--ink3);margin-top:0}
.sea-top{display:flex;align-items:center;gap:4px}
.sea-top b{font-size:12.5px;font-weight:800;letter-spacing:-.03em}
.sea-badge{margin-left:auto;font-size:9px;font-weight:800;border-radius:20px;padding:2px 6px;white-space:nowrap;letter-spacing:-.02em}
.sea-badge.ok{background:#e7f7ef;color:#158f5f}
.sea-badge.warn{background:#fff5e2;color:#b06f00}
.sea-badge.high{background:#fdecec;color:#d33a3f}
.sea-badge.na{background:#f1f3f8;color:var(--ink3)}
.sea-wave{display:flex;align-items:baseline;gap:2px;margin-top:2px}
.sea-wave b{font-size:20px;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.sea-wave i{font-style:normal;font-size:11px;font-weight:800;color:var(--ink2)}
.sea-wave small{margin-left:3px;font-size:9.5px;font-weight:700;color:var(--ink3)}
.sea-meta{margin-top:2px;font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:-.02em}
.sea-meta span{font-weight:600;color:var(--ink3)}
.sea-max{margin-top:1px;font-size:9.5px;font-weight:600;color:var(--ink3);letter-spacing:-.02em;white-space:nowrap}
.sea-max b{font-weight:800;color:var(--ink2)}
.sea-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin:11px 2px 0;font-size:9.5px;font-weight:700;color:var(--ink3)}
.sea-legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px}
.sea-links{display:grid;gap:8px;margin-top:6px}
/* 상단 배편 바로가기 — 2열 콤팩트 바 */
.sea-links.top{grid-template-columns:1fr 1fr;gap:6px;margin:0 0 9px}
.sea-link{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.sea-link .em{font-size:17px;flex-shrink:0}
.sea-link .tx{flex:1;min-width:0}
.sea-link .tx b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.02em}
.sea-link .tx small{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.sea-link .ar{color:var(--ink3);font-size:13px;flex-shrink:0}
.sea-link.cp{gap:6px;padding:8px 9px;border-radius:11px;box-shadow:0 3px 10px -9px rgba(20,26,36,.55)}
.sea-link.cp .em{font-size:14px}
.sea-link.cp .tx b{font-size:11px;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.sea-link.cp .ar{font-size:11px}
.sea-link.cp:active{transform:scale(.985)}
.sea-note{margin:11px 0 2px;padding:9px 11px;border-radius:12px;background:#f2f5fb;border:1px solid #e5ebf5;font-size:10px;line-height:1.65;color:var(--ink3)}
.sea-note b{color:var(--ink2)}
.sea-skel{height:96px;border-radius:14px;background:linear-gradient(100deg,#eef1f7 18%,#f8fafd 40%,#eef1f7 62%);background-size:220% 100%;animation:seaShimmer 1.15s linear infinite}
@keyframes seaShimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.sea-err{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:center;font-size:11.5px;line-height:1.7;color:var(--ink3)}
.sea-err span{display:block;font-size:26px;margin-bottom:6px;opacity:.8}
.sea-err button{margin-top:10px;background:#eaf7fc;color:#0b6d8f;border:1px solid #d5edf8;border-radius:20px;padding:7px 14px;font-size:11.5px;font-weight:800}
.sea-stale{margin:0 2px 8px;font-size:10px;font-weight:700;color:#b06f00;background:#fff5e2;border:1px solid #ffe3ae;border-radius:10px;padding:6px 9px;line-height:1.5}
.type-fixed{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:12px;background:#fff8ec;border:1.5px solid #ffe2b5;font-size:14px;font-weight:800;color:#96590a}
.type-fixed .em{font-size:16px}

/* 당직 운영 카드 */
.ops{background:#fff;border-radius:15px;box-shadow:var(--shadow);border:1px solid rgba(20,26,36,.03);padding:12px 13px 11px;margin-top:11px}
.ops-hd{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.ops-hd b{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
.ops-badge{margin-left:auto;font-size:10px;font-weight:800;color:#96590a;background:#fff5e2;border:1px solid #ffe3ae;border-radius:20px;padding:2px 7px;white-space:nowrap}
.ops-badge.hot{color:#fff;background:#e58a09;border-color:#e58a09;box-shadow:0 3px 8px -4px rgba(229,138,9,.9)}
.ops-st{font-size:11px;color:var(--ink3);line-height:1.5;margin-bottom:9px}
.ops-st b{color:var(--ink2)}
.ops-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ops-btns button{display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 2px;border-radius:11px;background:#f3f6fc;color:var(--ink2);font-size:11.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.ops-btns button.primary{background:#fff3dd;color:#96590a}
.ops-btns button:active{transform:scale(.98)}

/* 행사일 */
.dpill.event{background:#ede9fe;color:#5b46c9;letter-spacing:-.05em}
.legend i.event{background:#c4b5fd}
.dpill.hols{background:#fdecec;color:#c0392b;letter-spacing:-.06em}
.day.hol .num{color:#e04b4b}

/* 당직 달력 — 월~금 5열 · 큰 이름 배지 */
.cal.fivecol{padding-left:9px;padding-right:9px}
.cal.fivecol .dow{grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}
.cal.fivecol .dow span{font-size:11.5px;padding:5px 0;letter-spacing:-.02em}
.cal.fivecol .grid{grid-template-columns:repeat(5,1fr);gap:4px}
.cal.fivecol .day{height:auto;min-height:94px;padding:5px 4px 5px;border-radius:11px;gap:2px;border:1px solid #eef1f7;background:#fdfdff}
.cal.fivecol .day.out{background:#fcfcfd;border-color:#f4f6fa}
.cal.fivecol .day .num{font-size:14px;font-weight:800;width:24px;height:24px}
.cal.fivecol .day.out .num{color:#cdd3de}
.cal.fivecol .day.hasmine{background:#fffaf0;border-color:#ffe3b0}
.cal.fivecol .day.hol{background:#fffafa;border-color:#fbe0e0}
/* 🎈 행사일 — 칸 전체를 연보라로 음영(공휴일 연분홍과 구분) + 행사명 */
.cal.fivecol .day.evday{background:#f3f0ff;border-color:#ddd6fe}
.cal.fivecol .day.evday .num{color:#5b46c9}
.cal.fivecol .day.hol.evday{background:#f3f0ff;border-color:#ddd6fe}
.cal.fivecol .day .dpill.event{
  font-size:10px;font-weight:800;padding:3px 2px;border-radius:5px;letter-spacing:-.05em;
  background:#ede9fe;color:#5b46c9;border:1px solid #ddd6fe;
  white-space:normal;word-break:keep-all;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  line-height:1.25;max-height:2.9em;
}
.cal.fivecol .day .dcells{gap:3px;padding:0}
.cal.fivecol .day .dpill.duty{font-size:13px;font-weight:800;line-height:1.22;padding:3px 1px;border-radius:7px;background:#fff1d6;color:#8a4b00;border:1px solid #ffdfa4;letter-spacing:-.04em;white-space:normal;word-break:break-all;display:block}
.cal.fivecol .day .dpill.duty.mine{background:#e58a09;color:#fff;border-color:#e58a09;box-shadow:0 2px 6px -3px rgba(229,138,9,.9)}
.cal.fivecol .day .dpill.hols{font-size:10px;font-weight:800;padding:2px 1px;border-radius:5px;letter-spacing:-.05em}
.cal.fivecol .day .dpill.event{font-size:10px;font-weight:800;padding:2px 1px;border-radius:5px;letter-spacing:-.05em}
.cal.fivecol .day .dpill.more{font-size:9.5px;padding:2px}/* 맨 위 당직자 → 아래 등판(빨강) · 의소기한(파랑) · 조사기한(초록) */
.cal.fivecol .day .dpill.ms{font-size:10px;font-weight:800;line-height:1.35;padding:2px 1px;border-radius:5px;letter-spacing:-.05em;display:block}
.cal.fivecol .day .dpill.board{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.cal.fivecol .day .dpill.opinion{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
.cal.fivecol .day .dpill.survey{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}

/* 상세 시트 — 등판·의소기한·조사기한 칩 */
.ms-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ms-chip{
  display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 3px;border-radius:11px;
  border:1px solid var(--line);background:#f8f9fd;font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:-.03em;
}
.ms-chip i.dot{width:7px;height:7px;border-radius:50%;background:#c8cede;flex:none}
.ms-chip em{font-style:normal;font-size:8.5px;font-weight:800;color:#9aa3b2;background:#eef1f7;border-radius:4px;padding:1px 3px}
.ms-chip b.ok{font-size:11px;font-weight:900}
.ms-chip.board i.dot{background:#dc2626}
.ms-chip.opinion i.dot{background:#2563eb}
.ms-chip.survey i.dot{background:#16a34a}
.ms-chip.on{color:#fff}
.ms-chip.board.on{background:#dc2626;border-color:#dc2626}
.ms-chip.opinion.on{background:#2563eb;border-color:#2563eb}
.ms-chip.survey.on{background:#16a34a;border-color:#16a34a}
.ms-chip.on i.dot{background:rgba(255,255,255,.88)}
.ms-chip.on em{background:rgba(255,255,255,.22);color:#fff}
.ms-chip:disabled{opacity:.55}
.holnote{font-size:10px;font-weight:700;color:var(--ink3);padding:7px 4px 0;letter-spacing:-.01em}
.ev-box{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:13px;background:#f7f5ff;border:1px solid #e3ddff;font-size:13px;font-weight:800;color:#4b3fd8;margin-bottom:6px}
.ev-box .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 당직 명단 */
.rrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:6px}
.rrow .no{width:18px;text-align:center;font-size:11px;font-weight:800;color:var(--ink3);flex-shrink:0}
.rrow .nm{flex:1;min-width:0}
.rrow .nm b{font-size:13.5px;display:block}
.rrow .nm p{margin:1px 0 0;font-size:11px;color:var(--ink3)}
.rrow.off{background:#f7f8fc}
.rrow.off .nm b{color:var(--ink3)}
.rrow.off .avatar{filter:grayscale(1);opacity:.55}
.rrow button{font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:9px;background:#eef1f8;color:var(--ink2);flex-shrink:0}
.rrow button.on{background:#e8f8f1;color:#0d7a55}
.rrow .racts{display:flex;align-items:center;gap:4px;flex-shrink:0}
.rrow button.ico{width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#f1f4fa;color:var(--ink2)}
.rrow button.ico.danger{background:#fdf0f0;color:#c0392b}
.rrow button.tog{min-width:42px;text-align:center}
.rrow .cf{font-size:9.5px;font-weight:800;color:#5b46c9;background:#ede9fe;border-radius:5px;padding:1px 4px;vertical-align:1px;letter-spacing:-.02em}
.rrow.editing{background:#f7f9ff;border-color:#cfdcff}
.rrow .rm-edit{flex:1;min-width:0;border:1px solid #cfdcff;background:#fff;border-radius:9px;padding:7px 9px;font-size:13px;font-weight:700;font-family:inherit}
.rrow button.ok{background:var(--brand);color:#fff;padding:7px 9px}
.rrow button.cancel{padding:7px 8px}
.radd{display:flex;gap:6px;margin-top:10px}
.radd input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-size:13px;font-family:inherit}
.radd button{flex-shrink:0;padding:0 15px;border-radius:11px;background:var(--brand);color:#fff;font-size:13px;font-weight:800}
.radd button:active{transform:scale(.98)}

/* 재배정 미리보기 */
.plan{max-height:42vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.prow{display:grid;grid-template-columns:66px 1fr 14px 1fr;gap:5px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line2);font-size:11.5px}
.prow:last-child{border-bottom:0}
.prow .d{font-weight:800;color:var(--ink2);font-size:11px}
.prow .old{color:var(--ink3);text-decoration:line-through}
.prow .new{font-weight:800;color:var(--brand-d)}
.prow.head{background:#f7f9fe;font-size:10px;color:var(--ink3)}
.prow.head .old,.prow.head .new{color:var(--ink3);text-decoration:none}

/* ============ 레이어 (시트가 앱 프레임 안에 오도록) ============ */
#layer{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;justify-content:center}
#layer:empty{display:none}
.backdrop{position:absolute;inset:0;pointer-events:auto;display:flex;justify-content:center;align-items:flex-end}
.sheet{max-width:460px}
@media (min-width:760px){
  .backdrop{align-items:center;padding:22px 0}
  .sheet{border-radius:24px;max-height:calc(100dvh - 44px);box-shadow:0 30px 80px -30px rgba(10,16,30,.55)}
  .sheet.full{height:calc(100dvh - 44px);max-height:calc(100dvh - 44px)}
  .sheet .grab{display:none}
}
/* ============ 🖨️ 인쇄 전용 — 당직표 (화면에서는 숨김) ============ */
#printSheet{display:none}
#printSheet .ps-page{color:#111;font-family:var(--font);letter-spacing:-.01em;width:277mm;height:190mm;display:flex;flex-direction:column}
#printSheet .ps-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10mm;border-bottom:1.6pt solid #e58a09;padding-bottom:2mm;margin-bottom:2.6mm}
#printSheet .ps-hd h1{margin:0;font-size:16pt;font-weight:800;letter-spacing:-.03em;color:#141a24;line-height:1.2}
#printSheet .ps-meta{font-size:8.5pt;font-weight:600;color:#5c6577;text-align:right;white-space:nowrap;line-height:1.5}
#printSheet table.ps-cal{width:100%;flex:0 0 auto;border-collapse:collapse;table-layout:fixed;page-break-inside:avoid}
#printSheet table.ps-cal th{font-size:9pt;font-weight:800;color:#4b5565;letter-spacing:.12em;background:#f2f5fa;border:.6pt solid #cfd6e2;padding:1.6mm 0;text-align:center}
#printSheet table.ps-cal td{border:.6pt solid #cfd6e2;vertical-align:top;padding:1.3mm 1.5mm;position:relative}
#printSheet td.psd.out{background:#fbfcfe}
#printSheet td.psd.hol{background:#fff7f7}
#printSheet td.psd.ev{background:#f6f2ff}
#printSheet .psd-top{display:flex;align-items:center;gap:1.2mm}
#printSheet .psd-num{font-size:12.5pt;font-weight:800;color:#141a24;line-height:1}
#printSheet .psd-num.dim{color:#c3cad8}
#printSheet td.psd.today .psd-num{color:#1f52cf}
#printSheet .psd-wd{font-size:7.6pt;font-weight:700;color:#8a93a6;line-height:1}
#printSheet .psd-hol{font-size:7.8pt;font-weight:800;color:#c8323a;margin-top:.9mm;line-height:1.25}
#printSheet .psd-ev{font-size:8pt;font-weight:800;color:#5b46c9;margin-top:.9mm;line-height:1.25}
/* 이름은 칸 아래쪽에 고정 — 등판이 위로 빠져 이름 자리를 넓게 */
#printSheet .psd-name{position:absolute;left:1.5mm;right:1.5mm;bottom:1.7mm;font-size:20pt;font-weight:800;color:#0f1722;letter-spacing:-.04em;line-height:1.12;word-break:keep-all}
#printSheet .psd-name.none{font-size:8pt;font-weight:700;color:#b6bdc9;letter-spacing:0;bottom:1.9mm}
/* 등판 — 날짜·요일 바로 옆(칸 상단) */
#printSheet .psd-badge{display:inline-block;font-size:7.6pt;font-weight:800;color:#b91c1c;background:#fee2e2;border:.6pt solid #fecaca;border-radius:1.4mm;padding:.5mm 1.6mm;margin-left:.8mm;line-height:1.15}
#printSheet .ps-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:8mm;margin-top:2.4mm;padding-top:1.6mm;border-top:.6pt solid #cfd6e2;font-size:7.8pt;color:#5c6577;line-height:1.55}
#printSheet .ps-legend{display:flex;flex-wrap:wrap;gap:0 4mm;align-items:center}
#printSheet .ps-legend span{display:inline-flex;align-items:center;gap:1.2mm;font-weight:700;color:#4b5565}
#printSheet .ps-legend i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.6mm}
#printSheet .ps-wk{text-align:right}
#printSheet .ps-wk b{font-weight:800;color:#4b5565}

/* ============ 🖨️ 당직표 인쇄·저장 시트 ============ */
.dsp{display:flex;flex-direction:column;gap:10px}
.dsp-cap{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink3);padding:0 2px}
.dsp-cap b{color:var(--ink2);font-size:11.5px}
.dsp-prev{background:#e7ebf3;border:1px solid var(--line);border-radius:14px;padding:9px}
.dsp-prev img{display:block;width:100%;height:auto;border-radius:9px;background:#fff;box-shadow:0 8px 20px -10px rgba(10,16,30,.42)}
.dsp-note{font-size:11px;line-height:1.6;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.dsp-note b{color:var(--ink);font-weight:800}
.dsp-ft{display:flex;flex-direction:column;gap:8px;width:100%}
.dsp-ft .row{display:flex;gap:8px}
.dsp-ft .row .btn{flex:1;min-width:0}
.dsp-ft .btn{font-size:13.5px;padding:13px 10px}
/* 재배정 — 시작 담당자 고르기(select)에 펼침 표시 */
#rbWho{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235c6577' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;background-size:16px 16px;padding-right:40px;font-weight:700;text-overflow:ellipsis}

@media print{
  @page{size:A4 landscape; margin:10mm}
  html,body{background:#fff !important;display:block !important;min-height:0 !important;height:auto !important;margin:0 !important;padding:0 !important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body > *{display:none !important}
  #printSheet{display:block !important}
  #printSheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ============ 오늘의 팀 한 줄 (공지 상단) ============ */
.tday{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:10px 12px;margin:0 0 10px;border-radius:14px;
  background:linear-gradient(115deg,#f2f6ff 0%,#f7f3ff 100%);
  border:1px solid #e2e9fb;box-shadow:0 2px 9px -6px rgba(30,50,110,.5);
  overflow:hidden;transition:.14s;
}
.tday:active{transform:scale(.995)}
.tday-d{font-size:10.5px;font-weight:800;color:var(--brand-d);background:#fff;border-radius:8px;padding:3px 6px;flex-shrink:0;letter-spacing:-.02em}
.tday-none{font-size:12px;font-weight:700;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchips{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto;padding:1px 0}
.tchip{
  display:inline-flex;align-items:center;gap:3px;flex-shrink:0;
  font-size:11px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:3px 8px;white-space:nowrap;letter-spacing:-.02em;
}
.tchip i{font-style:normal;font-size:10px;letter-spacing:-1px}
.tchip.ev{background:#f4efff;border-color:#e3d7ff;color:#5b3fae;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tchip.duty{background:#fff7e8;border-color:#ffe3b8;color:#a16300}
.tchip.island-night{background:#eef0fc;border-color:#d9ddf7;color:#333a9e}
.tchip.island-day{background:#ecf9ff;border-color:#cdeeff;color:#0b7fa8}
.tchip.edu{background:#eefbf4;border-color:#cdeedd;color:#0b7a53}
.tchip.more{background:#eef1f8;border-color:#e2e7f2;color:var(--ink3);font-weight:800}
.tday-go{color:var(--ink3);font-size:16px;line-height:1;flex-shrink:0;margin-left:-2px}

/* ============ 📊 간단 투표 ============ */
.pollbadge{
  display:flex;align-items:center;gap:6px;margin:0 0 8px;padding:7px 10px;border-radius:11px;
  background:#f5f8ff;border:1px solid #e3eafc;font-size:11.5px;font-weight:800;color:var(--brand-d);
}
.pollbadge .pb-more{margin-left:auto;font-weight:700;color:var(--ink3);font-size:10.5px}
.pollmini{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.pollmini .pm{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink2);line-height:1.3}
.pollmini .pm .nm{width:74px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pollmini .pm .bb{flex:1;height:6px;border-radius:6px;background:#eef1f8;overflow:hidden}
.pollmini .pm .bb i{display:block;height:100%;border-radius:6px;background:#9db7f5}
.pollmini .pm.mine .nm{color:var(--brand-d)}
.pollmini .pm.mine .bb i{background:var(--brand)}
.pollmini .pm .vv{width:22px;text-align:right;flex-shrink:0;font-weight:800;color:var(--ink3);font-size:10px}
.pollbox{background:#f7f9ff;border:1px solid #e4eafa;border-radius:16px;padding:13px 13px 11px;margin:14px 0 4px}
.pollbox .ph{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.pollbox .ph b{font-size:13.5px;line-height:1.4;flex:1;letter-spacing:-.02em}
.pollbox .ph .pn{font-size:10.5px;font-weight:700;color:var(--ink3);flex-shrink:0;padding-top:2px;text-align:right;line-height:1.35}
.pollopt{
  display:block;width:100%;text-align:left;position:relative;
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px 8px;margin-bottom:6px;
  transition:.14s;overflow:hidden;
}
.pollopt:active{transform:scale(.994)}
.pollopt.on{border-color:var(--brand);background:#f4f8ff;box-shadow:0 0 0 3px rgba(47,107,246,.09)}
.pollopt .po-t{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:750;position:relative;z-index:1}
.pollopt .po-t .chk{
  width:15px;height:15px;border-radius:5px;border:1.5px solid #cdd5e4;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;background:#fff;
}
.pollopt .po-t .chk.solo{border-radius:50%}
.pollopt.on .po-t .chk{background:var(--brand);border-color:var(--brand);color:#fff}
.pollopt .po-t .lb{flex:1;min-width:0}
.pollopt .po-t .ct{font-size:11px;font-weight:800;color:var(--ink3);flex-shrink:0}
.pollopt .bar{display:block;height:5px;border-radius:5px;background:#eef1f8;margin-top:6px;overflow:hidden;position:relative;z-index:1}
.pollopt .bar i{display:block;height:100%;border-radius:5px;background:#b9cbf6;transition:width .25s}
.pollopt.on .bar i{background:var(--brand)}
.pollopt .who{display:block;font-size:10px;color:var(--ink3);margin-top:5px;line-height:1.45;position:relative;z-index:1}
.pollbox .pf{font-size:10.5px;color:var(--ink3);text-align:center;padding-top:3px;line-height:1.5}
.pollbox .pf b{color:var(--brand-d)}
.pedit{border:1px dashed #cfd8ea;border-radius:14px;padding:11px;background:#fbfcff;margin:2px 0 4px}
.pedit .opt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.pedit .opt-row input{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:13px}
.pedit .opt-row .del{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:#f4f6fb;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.pedit .add-opt{font-size:12px;font-weight:800;color:var(--brand-d);background:var(--brand-soft);border-radius:10px;padding:8px 10px;width:100%}
.pedit .add-opt[disabled]{opacity:.45}

/* ============ 🍽️ 맛집 ============ */
.seg2{display:flex;gap:4px;background:#e7ecf6;border-radius:13px;padding:4px;margin:0 0 8px}
.seg2 button{flex:1;padding:9px 6px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(20,26,36,.3)}
.rt-map{height:380px;border-radius:16px;overflow:hidden;background:#e9eef8;border:1px solid var(--line);position:relative}
.rt-map .mapfall{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;font-size:12px;color:var(--ink2);line-height:1.6}
.rt-map .mapfall .em{font-size:26px}
.rt-map .leaflet-container{font-family:var(--font)}
.rt-pin-wrap{background:none !important;border:0 !important}
.rt-pin{
  width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  background:var(--pc,#2f6bf6);border:2px solid #fff;box-shadow:0 3px 7px rgba(20,26,36,.42);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.rt-pin span{transform:rotate(45deg);display:flex;align-items:center;justify-content:center}
.rt-card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(20,26,36,.03);
  padding:13px 14px;margin-bottom:10px;
}
.rt-card h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-card .rt-top{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.rt-reg{flex-shrink:0;font-size:10px;font-weight:800;color:var(--brand-d);background:#eef3ff;border-radius:7px;padding:3px 7px;letter-spacing:-.02em}
.rt-reg.r-영종구{background:#eef0fd;color:#4b3fa8}
.rt-reg.r-제물포구{background:#e8f4ff;color:#0b5c8a}
.rt-reg.r-옹진군{background:#e8f7f1;color:#0d7a55}
.rt-reg.r-기타{background:#f1f3f8;color:var(--ink2)}
.rt-rate{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#e08a00;flex-shrink:0;letter-spacing:-.02em}
.rt-addr{margin:0 0 8px;font-size:11px;color:var(--ink3);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-quote{display:flex;gap:6px;margin:0 0 9px;padding:8px 10px;background:#f7f9fd;border-radius:11px;font-size:12px;color:var(--ink2);line-height:1.55}
.rt-quote .em{flex-shrink:0;opacity:.85}
.rt-quote .tx{min-width:0;word-break:break-word}
.rt-meta{display:flex;align-items:center;gap:6px;padding-top:9px;border-top:1px solid var(--line2);font-size:11px;color:var(--ink3)}
.rt-meta .who{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
.rt-meta .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.rt-like{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink2);
  background:#f7f8fc;border:1px solid var(--line);border-radius:20px;padding:4px 9px;flex-shrink:0;
}
.rt-like.on{background:#fdeff2;border-color:#f8d3da;color:#d6336c}
.rt-edit{width:27px;height:27px;border-radius:9px;background:#f4f6fb;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rt-links2{display:flex;gap:6px;margin-top:9px}
.rt-links2 .rt-lnk{flex:1;justify-content:center;text-align:center;font-size:11px;padding:7px 0;border-radius:10px}
.rt-lnk{
  display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;border-radius:9px;padding:5px 7px;
  border:1px solid var(--line);color:var(--ink2);background:#fff;white-space:nowrap;text-decoration:none;
}
.rt-lnk.naver{background:#e9f9f0;border-color:#cbebd9;color:#07864a}
.rt-lnk.naver.big{font-size:11.5px;padding:7px 11px}
.rt-lnk.kakao{background:#fdf8e6;border-color:#f0e4bd;color:#7a5b00}
/* 📋 맛집 상세 시트 — 목록 카드·지도 핀에서 엽니다 */
.rt-card{cursor:pointer}
.rd-name{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.rd-name h3{margin:0;flex:1;min-width:0;font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.3;word-break:break-word}
.rd-rate{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:#e08a00;letter-spacing:-.02em;flex-shrink:0}
.rd-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.rd-addr{margin:0 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.55;word-break:break-word}
.rd-quote{margin:0 0 10px;padding:11px 12px;background:#f7f9fd;border-radius:12px;font-size:13px;color:var(--ink2);line-height:1.65;word-break:break-word}
.rd-quote b{display:block;font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.02em;margin-bottom:3px}
.rt-pick{height:190px;border-radius:13px;overflow:hidden;background:#e9eef8;border:1px solid var(--line);margin-top:7px}
.rt-pick.shake,.rt-starbtn.shake,#rtName.shake{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.rt-searchrow{display:flex;gap:6px;align-items:center}
.rt-searchrow input{flex:1;min-width:0;border:1px solid var(--line);background:#fafbfe;border-radius:12px;padding:11px 12px;font-size:13px}
.rt-searchrow .btn{flex:0 0 62px;padding:11px 0}
.rt-locrow{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11px;color:var(--ink3)}
.rt-locrow span{flex:1;min-width:0;line-height:1.5;overflow:hidden;text-overflow:ellipsis}
