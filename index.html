  $$("[data-rest] a", v).forEach(a => a.addEventListener("click", e => e.stopPropagation()));
  $$("[data-rest]", v).forEach(card => card.addEventListener("click", ev => {
    if (ev.target && ev.target.closest && ev.target.closest("a,button")) return;
    const r = S.restaurants.find(x => x.id === card.dataset.rest);
    if (r) openRestDetail(r);
  }));
  $$("[data-rest]", v).forEach(card => card.addEventListener("keydown", ev => {
    if (ev.target !== card || (ev.key !== "Enter" && ev.key !== " ")) return;
    ev.preventDefault();
    const r = S.restaurants.find(x => x.id === card.dataset.rest);
    if (r) openRestDetail(r);
  }));
  if (S.restView === "map") mountRestMap();
}

function destroyRestMap() {
  if (!RT.map) return;
  try {
    if (RT.engine === "kakao" && window.kakao && window.kakao.maps && window.kakao.maps.event && RT.map.remove) {
      RT.markers.forEach(m => { try { m.setMap(null); } catch (e) {} });
    }
    RT.map.remove();
  } catch (e) {}
  RT.map = null; RT.markers = []; RT.engine = null;
}

/* ---- 공유 지도 : 카카오맵 → (실패 시) Leaflet 폴백 ---- */
async function mountRestMap() {
  const box = $("#rtMap");
  if (!box) return;
  const list = restFiltered().filter(hasCoord);
  if (kakaoMapWorthTrying()) {
    try {
      const maps = await loadKakaoMaps();
      const cur = $("#rtMap");
      if (!cur || !document.body.contains(cur)) return;
      mountRestMapKakao(maps, cur, list);
      setMapNote("kakao");
      return;
    } catch (e) {
      console.warn("kakao map:", e && e.message);
    }
  }
  mountRestMapLeaflet(list);
}
function setMapNote(engine) {
  const el = $("#rtMapNote");
  if (!el) return;
  const base = RT.note || "핀을 누르면 별점·한줄평과 지도 열기 버튼이 뜹니다.";
  el.innerHTML = base + (isAdmin()
    ? ' <span style="color:#9aa3b2">(지도: ' + (engine === "kakao" ? "카카오맵" : "기본 지도 — 카카오맵 Web 도메인 등록 필요") + ')</span>'
    : "");
}
function mountRestMapKakao(M, box, list) {
  box.innerHTML = "";
  const center = new M.LatLng(REST_CENTER[0], REST_CENTER[1]);
  const map = new M.Map(box, { center: center, level: 9 });
  RT.map = map; RT.engine = "kakao"; RT.markers = [];
  const iw = new M.InfoWindow({ removable: false, zIndex: 5 });
  const bounds = new M.LatLngBounds();
  const boxH = box.clientHeight || 380;
  const img = new M.MarkerImage(kakaoPinSrc("#2f6bf6"), new M.Size(30, 37), { offset: new M.Point(15, 37) });
  list.forEach(r => {
    const pos = new M.LatLng(Number(r.lat), Number(r.lng));
    let mk = null;
    try { mk = new M.Marker({ position: pos, title: r.name, map: map, image: img }); }
    catch (e) { mk = new M.Marker({ position: pos, title: r.name, map: map }); }
    RT.markers.push(mk);
    M.event.addListener(mk, "click", () => {
      iw.setContent(restPopupHtml(r, true));
      /* 인포윈도우가 지도 위쪽으로 잘리지 않게, 핀이 화면 아래쪽(70%)에 오도록 먼저 이동한 뒤 엽니다 */
      let moved = false;
      try {
        const cp = map.getProjection().containerPointFromCoords(pos);
        const want = Math.round(boxH * 0.7);
        const dy = want - cp.y;
        if (Math.abs(dy) > 24) { map.panBy(0, -dy); moved = true; }
      } catch (e) {}
      if (moved) setTimeout(() => { try { iw.open(map, mk); } catch (e) {} }, 380);
      else iw.open(map, mk);
    });
    bounds.extend(pos);
  });
  if (list.length) {
    /* 핀이 한 지역에 모여 있을 때만 화면을 맞춥니다. (연평도처럼 먼 곳이 섞이면 인천 중심 유지) */
    const lats = list.map(r => Number(r.lat)), lngs = list.map(r => Number(r.lng));
    const latSpread = Math.max.apply(null, lats) - Math.min.apply(null, lats);
    const lngSpread = Math.max.apply(null, lngs) - Math.min.apply(null, lngs);
    if (latSpread <= 0.25 && lngSpread <= 0.4) {
      try { map.setBounds(bounds, 40, 40, 40, 40); } catch (e) {}
    }
  }
  setTimeout(() => { try { map.relayout(); } catch (e) {} }, 120);
  setTimeout(() => { try { map.relayout(); } catch (e) {} }, 520);
}
/* ---- 폴백 : Leaflet + CartoDB Voyager ---- */
async function mountRestMapLeaflet(list) {
  const box = $("#rtMap");
  if (!box) return;
  let L;
  try { L = await loadLeaflet(); }
  catch (e) {
    RT.failed = true;
    const cur = $("#rtMap");
    if (cur) cur.innerHTML = '<div class="mapfall"><span class="em">🚧</span>' +
      '<b>지도를 불러오지 못했어요</b>인터넷 연결이나 CDN 차단 때문일 수 있어요.<br><b>📋 목록</b>에서 맛집을 그대로 볼 수 있습니다.' +
      '<button class="chip on" id="mapFallbackList" style="margin-top:4px">📋 목록으로 보기</button></div>';
    const fb = $("#mapFallbackList");
    if (fb) fb.addEventListener("click", () => { S.restView = "list"; renderRest(); });
    return;
  }
  const cur = $("#rtMap");
  if (!cur || !document.body.contains(cur)) return;
  cur.innerHTML = "";
  const map = L.map(cur, { zoomControl: true, scrollWheelZoom: false, attributionControl: true })
    .setView(REST_CENTER, 11);
  RT.map = map; RT.engine = "leaflet"; RT.markers = [];
  addFallbackTiles(L, map);
  const pins = [];
  list.forEach(r => {
    const icon = L.divIcon({
      className: "rt-pin-wrap",
      html: '<div class="rt-pin" style="--pc:' + restPinColor(r) + '"><span>' + restGlyph(14, "#fff") + "</span></div>",
      iconSize: [30, 30], iconAnchor: [15, 28], popupAnchor: [0, -24]
    });
    const mk = L.marker([Number(r.lat), Number(r.lng)], { icon: icon }).addTo(map);
    mk.bindPopup(restPopupHtml(r), { maxWidth: 250 });
    pins.push(mk);
  });
  if (pins.length) {
    const lats = list.map(r => Number(r.lat)), lngs = list.map(r => Number(r.lng));
    const latSpread = Math.max.apply(null, lats) - Math.min.apply(null, lats);
    const lngSpread = Math.max.apply(null, lngs) - Math.min.apply(null, lngs);
    if (latSpread <= 0.25 && lngSpread <= 0.4) {
      try { map.fitBounds(L.featureGroup(pins).getBounds().pad(0.3), { maxZoom: 14 }); } catch (e) {}
    }
  }
  setMapNote("leaflet");
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 90);
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 500);
}

/* ---- 맛집 등록/수정 시트 ----
   🔍 가게 검색 → 지도(필수) → 가게명·주소 → 별점(필수) → 한줄평(선택) */
function openRestSheet(id) {
  const r = id ? S.restaurants.find(x => x.id === id) : null;
  let rating = r ? Number(r.rating) || 0 : 0;
  let region = r ? restRegionOf(r) : "";   /* 주소로 자동 판별 · 칩으로 직접 바꿔도 됩니다 */
  let loc = { lat: r && hasCoord(r) ? Number(r.lat) : null,
              lng: r && hasCoord(r) ? Number(r.lng) : null,
              address: (r && r.address) || "" };
  let pick = { place: () => {}, clear: () => {} };
  openSheet({
    title: r ? "맛집 수정" : "맛집 등록",
    body:
      '<div class="field"><label>🔍 가게 검색</label>' +
        '<div class="rt-searchrow">' +
          '<input type="text" id="rtSearch" autocomplete="off" spellcheck="false" placeholder="가게 이름 (예: 신포우리만두)">' +
          '<button type="button" class="btn sm" id="rtSearchBtn">검색</button>' +
        "</div>" +
        '<div class="hint">가게 이름으로 찾으면 <b>가게명·주소·지도 위치</b>가 한 번에 채워져요</div>' +
        '<div id="rtSearchRes"></div>' +
      "</div>" +
      '<div class="field"><label>지도 <span class="req">필수</span></label>' +
        '<div class="rt-pick" id="rtPickMap"></div>' +
        '<div class="rt-locrow"><span id="rtLocTx"></span><button type="button" class="rt-lnk" id="rtLocClear">지우기</button></div>' +
      "</div>" +
      '<div class="field"><label>가게명</label><input type="text" id="rtName" maxlength="40" placeholder="검색하면 자동으로 채워져요" value="' + esc(r ? r.name : "") + '"></div>' +
      '<div class="field"><label>주소</label><input type="text" id="rtAddress" maxlength="120" placeholder="검색하면 자동으로 채워져요" value="' + esc(r ? r.address || "" : "") + '"></div>' +
      '<div class="field"><label>지역</label>' +
        '<div class="chips wrap" id="rtRegChips" style="padding-bottom:2px"></div>' +
        '<div class="hint" id="rtRegHint">가게 검색으로 주소를 고르면 지역이 자동으로 정해져요 · 칩을 눌러 직접 바꿀 수도 있어요</div></div>' +
      '<div class="field"><label>별점 <span class="req">필수</span></label><div class="rt-starbtn" id="rtStars">' +
        [1, 2, 3, 4, 5].map(n =>
          '<div class="rt-star" data-i="' + n + '">' +
            '<span class="g"></span>' +
            '<button type="button" class="rt-half l" data-s="' + (n - 0.5) + '" aria-label="' + (n - 0.5) + '점"></button>' +
            '<button type="button" class="rt-half r" data-s="' + n + '" aria-label="' + n + '점"></button>' +
          "</div>").join("") +
      '</div><div class="hint" id="rtStarHint"></div></div>' +
      '<div class="field"><label>한줄평 및 추천메뉴 <span class="opt">선택</span></label><textarea id="rtReview" rows="3" maxlength="200" placeholder="예: 쫄면이랑 비빔만두 추천! 분위기 좋고 깔끔함">' + esc(r ? r.review || "" : "") + "</textarea></div>",
    footer: '<button class="btn" id="rtSave">' + (r ? "수정 저장" : "맛집 등록") + "</button>",
    onMount: root => {
      const locTx = () => {
        const el = $("#rtLocTx", root);
        if (!el) return;
        el.textContent = hasCoord(loc)
          ? "📍 " + (loc.address || (Number(loc.lat).toFixed(5) + ", " + Number(loc.lng).toFixed(5)))
          : "지도를 눌러 가게 위치에 핀을 찍어 주세요";
        el.style.color = hasCoord(loc) ? "var(--ink2)" : "var(--ink3)";
      };
      locTx();

      /* 지역 칩 — 주소로 자동 판별되지만 직접 골라 바꿀 수 있습니다 */
      const regChips = $("#rtRegChips", root);
      const paintRegion = () => {
        if (REST_REGIONS.indexOf(region) < 0) region = "";
        regChips.innerHTML = REST_REGIONS.map(c =>
          '<button type="button" class="chip' + (region === c ? " on" : "") + '" data-rreg2="' + c + '">' + restRegionLabel(c) + "</button>").join("");
        $$("[data-rreg2]", regChips).forEach(b => b.addEventListener("click", () => {
          region = b.dataset.rreg2;
          paintRegion();
        }));
        const hint = $("#rtRegHint", root);
        if (hint) hint.textContent = region
          ? "지역: " + region + " · 다른 지역이면 칩을 눌러 바꿔 주세요"
          : "가게 검색으로 주소를 고르면 지역이 자동으로 정해져요 · 지금은 ‘기타’로 저장됩니다";
      };
      paintRegion();

      /* 별점(필수) — 탭도 드래그(스와이프)도 0.5점 단위. 별 하나를 좌/우 반으로 나눠 고릅니다 */
      const starWrap = $("#rtStars", root);
      const paintStars = () => {
        $$(".rt-star", starWrap).forEach(el => {
          const n = Number(el.dataset.i);
          const g = $(".g", el);
          if (rating >= n) g.innerHTML = '<span style="color:#f5a524">★</span>';
          else if (rating >= n - 0.5) g.innerHTML = '<span class="gf" style="width:50%">★</span><span style="color:#dde1ea">★</span>';
          else g.innerHTML = '<span style="color:#dde1ea">★</span>';
        });
        const h = $("#rtStarHint", root);
        if (h) h.innerHTML = rating
          ? '<b style="color:#e08a00">★ ' + rating.toFixed(1) + '</b> <span style="color:var(--ink3);font-weight:600">/ 5.0</span>'
          : "별을 눌러 점수를 골라 주세요 (필수) — 반 별까지 고를 수 있어요";
      };
      paintStars();

      /* 누른 자리의 X 좌표 → 0.5점 단위 점수 (왼쪽 끝 0.5 ~ 오른쪽 끝 5.0) */
      const setRatingAtX = clientX => {
        const rect = starWrap.getBoundingClientRect();
        if (!rect.width) return;
        const v = Math.min(5, Math.max(0.5, Math.ceil(((clientX - rect.left) / rect.width) * 10) / 2));
        if (v === rating) return;
        rating = v;
        paintStars();
      };

      /* 탭 — 반 별 버튼 */
      $$("[data-s]", root).forEach(b => b.addEventListener("click", () => {
        rating = Number(b.dataset.s);
        paintStars();
      }));

      /* 드래그 — 누른 채 좌우로 밀면 지나가는 자리의 점수로 실시간으로 바뀝니다 */
      let starDrag = false;
      starWrap.addEventListener("pointerdown", e => {
        if (e.button) return;                     /* 오른쪽·가운데 버튼은 무시 */
        starDrag = true;
        starWrap.classList.add("dragging");
        try { starWrap.setPointerCapture(e.pointerId); } catch (err) {}
        setRatingAtX(e.clientX);
      });
      starWrap.addEventListener("pointermove", e => {
        if (!starDrag) return;
        if (e.cancelable) e.preventDefault();
        setRatingAtX(e.clientX);
      });
      const starDragEnd = e => {
        if (!starDrag) return;
        starDrag = false;
        starWrap.classList.remove("dragging");
        try { starWrap.releasePointerCapture(e.pointerId); } catch (err) {}
      };
      starWrap.addEventListener("pointerup", starDragEnd);
      starWrap.addEventListener("pointercancel", starDragEnd);
      starWrap.addEventListener("pointerleave", e => { if (e.buttons === 0) { starDrag = false; starWrap.classList.remove("dragging"); } });
      /* 아이폰 사파리 — 터치 이벤트에서도 같은 계산으로 따라가게 */
      starWrap.addEventListener("touchstart", e => {
        const t = e.touches && e.touches[0];
        if (t) setRatingAtX(t.clientX);
      }, { passive: true });
      starWrap.addEventListener("touchmove", e => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        if (e.cancelable) e.preventDefault();     /* 바텀시트가 같이 스크롤되지 않게 */
        setRatingAtX(t.clientX);
      }, { passive: false });

      const setLoc = (la, ln, addr, fly) => {
        loc.lat = Number(la); loc.lng = Number(ln);
        if (addr != null) {
          loc.address = addr;
          const ai = $("#rtAddress", root);
          if (ai) ai.value = addr;
          region = restRegionFromAddress(addr);   /* 주소로 지역 자동 판별 */
          paintRegion();
        }
        locTx();
        try { pick.place(loc.lat, loc.lng, fly); } catch (e) {}
      };
      /* 지도에서 직접 핀을 찍을 때 — 자동으로 채워진 주소는 지웁니다 */
      const tapLoc = (la, ln) => {
        const ai = $("#rtAddress", root);
        const auto = ai && loc.address && ai.value.trim() === String(loc.address).trim();
        loc.lat = Number(la); loc.lng = Number(ln);
        if (auto) { loc.address = ""; ai.value = ""; }
        locTx();
      };

      /* 지도 — 카카오맵, 키가 없거나 SDK를 못 불러오면 CartoDB 폴백 */
      const box = $("#rtPickMap", root);
      (async () => {
        let ok = false;
        if (kakaoMapWorthTrying()) {
          try {
            const M = await loadKakaoMaps();
            if (!box || !document.body.contains(box)) return;
            pick = mountPickKakao(M, box, loc, tapLoc);
            ok = true;
          } catch (e) { console.warn("kakao pick map:", e && e.message); }
        }
        if (ok) return;
        try {
          const L = await loadLeaflet();
          if (!box || !document.body.contains(box)) return;
          pick = mountPickLeaflet(L, box, loc, tapLoc);
        } catch (e) {
          if (box) box.innerHTML = '<div class="mapfall" style="font-size:11px"><span class="em">🚧</span>지도를 불러오지 못했어요.<br>가게 검색으로 찾으면 위치도 함께 저장됩니다.</div>';
        }
      })();

      /* 가게 검색 — 카카오 장소 검색(키워드). 키가 비어 있을 때만 OpenStreetMap Nominatim */
      const doSearch = async () => {
        const q = ($("#rtSearch", root).value || "").trim() || ($("#rtName", root).value || "").trim();
        const res = $("#rtSearchRes", root);
        if (!q) { toast("가게 이름을 입력해 주세요"); $("#rtSearch", root).focus(); return; }
        res.innerHTML = '<div class="rt-noresult">검색 중…</div>';
        const key = kakaoRestKey();
        if (key) {
          try {
            const docs = await kakaoKeywordSearch(q, key);
            if (!docs.length) { res.innerHTML = '<div class="rt-noresult">검색 결과가 없어요. 다른 이름으로 찾아보거나 지도를 눌러 핀을 찍어 주세요.</div>'; return; }
            res.innerHTML = docs.slice(0, 8).map((x, i) =>
              '<button type="button" class="rt-cand" data-kpick="' + i + '">' +
                "<b>" + esc(String(x.place_name || "이름 없음")) + "</b>" +
                "<span>" + esc(String(x.road_address_name || x.address_name || "주소 없음")) + "</span>" +
                "<i>" + esc(String(x.category_name || "")) + (x.phone ? " · " + esc(String(x.phone)) : "") + "</i>" +
              "</button>").join("");
            $$("[data-kpick]", res).forEach(b => b.addEventListener("click", () => {
              const x = docs[Number(b.dataset.kpick)] || {};
              const nm = String(x.place_name || "").trim();
              const addr = String(x.road_address_name || x.address_name || "").trim();
              if (nm) $("#rtName", root).value = nm.slice(0, 40);
              const la = Number(x.y), ln = Number(x.x);
              if (isFinite(la) && isFinite(ln) && la !== 0 && ln !== 0) setLoc(la, ln, addr.slice(0, 120), true);
              else if (addr) { loc.address = addr.slice(0, 120); const ai = $("#rtAddress", root); if (ai) ai.value = loc.address; locTx(); }
              res.innerHTML = "";
              $("#rtSearch", root).value = "";
              const nmEl = $("#rtName", root);
              try { nmEl.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {}
              toast(hasCoord(loc) ? "가게 정보를 채웠어요" + (region ? " · " + region : "") + " · 별점만 고르면 등록돼요" : "가게 정보를 채웠어요");
            }));
            return;
          } catch (e) {
            const auth = e && e.code === "kakao-auth";
            res.innerHTML = '<div class="rt-noresult">' + (auth
              ? "카카오 키가 올바르지 않거나 사용할 수 없어요. 관리자가 [팀원관리 → 관리 → 카카오 장소 검색 키]에서 확인해 주세요."
              : "카카오 검색에 연결하지 못했어요. 잠시 후 다시 해보거나 지도를 직접 눌러 주세요.") + "</div>";
            return;
          }
        }
        try {
          const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=4&accept-language=ko&q=" + encodeURIComponent(q);
          const rr = await fetch(url, { headers: { "Accept": "application/json" } });
          const arr = await rr.json();
          if (!Array.isArray(arr) || !arr.length) { res.innerHTML = '<div class="rt-noresult">검색 결과가 없어요. 지도를 직접 눌러 핀을 찍어 주세요.</div>'; return; }
          res.innerHTML = arr.map((x, i) =>
            '<button type="button" class="rt-cand" data-pick="' + i + '"><b>' + esc(String(x.display_name).split(",")[0]) + "</b><span>" + esc(x.display_name) + "</span></button>").join("");
          $$("[data-pick]", res).forEach(b => b.addEventListener("click", () => {
            const x = arr[Number(b.dataset.pick)];
            setLoc(Number(x.lat), Number(x.lon), String(x.display_name).slice(0, 120), true);
            res.innerHTML = "";
            $("#rtSearch", root).value = "";
          }));
        } catch (e) { res.innerHTML = '<div class="rt-noresult">검색 서버에 연결하지 못했어요. 지도를 직접 눌러 주세요.</div>'; }
      };
      $("#rtSearchBtn", root).addEventListener("click", doSearch);
      $("#rtSearch", root).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doSearch(); } });

/* ---- 등록 시트의 핀 지도 — 카카오맵 ---- */
function mountPickKakao(M, box, loc, onTap) {
  const has = hasCoord(loc);
  const map = new M.Map(box, {
    center: has ? new M.LatLng(Number(loc.lat), Number(loc.lng)) : new M.LatLng(REST_CENTER[0], REST_CENTER[1]),
    level: has ? 4 : 8
  });
  const img = new M.MarkerImage(kakaoPinSrc("#2f6bf6"), new M.Size(30, 37), { offset: new M.Point(15, 37) });
  let mark = null;
  const place = (la, ln, fly) => {
    const pos = new M.LatLng(Number(la), Number(ln));
    if (!mark) {
      try { mark = new M.Marker({ position: pos, map: map, image: img }); }
      catch (e) { mark = new M.Marker({ position: pos, map: map }); }
    } else mark.setPosition(pos);
    if (fly) { try { map.setLevel(4); } catch (e) {} map.panTo(pos); }
  };
  const clear = () => { if (mark) { try { mark.setMap(null); } catch (e) {} mark = null; } };
  if (has) place(loc.lat, loc.lng, false);
  M.event.addListener(map, "click", e => {
    const la = e.latLng.getLat(), ln = e.latLng.getLng();
    place(la, ln, false);
    onTap(la, ln);
  });
  setTimeout(() => { try { map.relayout(); } catch (e) {} }, 120);
  setTimeout(() => { try { map.relayout(); } catch (e) {} }, 520);
  return { place: place, clear: clear, map: map };
}

/* ---- 등록 시트의 핀 지도 — Leaflet 폴백(CartoDB Voyager) ---- */
function mountPickLeaflet(L, box, loc, onTap) {
  const has = hasCoord(loc);
  const map = L.map(box, { zoomControl: true, scrollWheelZoom: false })
    .setView(has ? [Number(loc.lat), Number(loc.lng)] : REST_CENTER, has ? 16 : 12);
  addFallbackTiles(L, map);
  const icon = L.divIcon({
    className: "rt-pin-wrap",
    html: '<div class="rt-pin" style="--pc:#2f6bf6"><span>' + restGlyph(14, "#fff") + "</span></div>",
    iconSize: [30, 30], iconAnchor: [15, 28]
  });
  let mark = has ? L.marker([Number(loc.lat), Number(loc.lng)], { icon: icon }).addTo(map) : null;
  const place = (la, ln, fly) => {
    const pos = [Number(la), Number(ln)];
    if (!mark) mark = L.marker(pos, { icon: icon }).addTo(map);
    else mark.setLatLng(pos);
    if (fly) map.setView(pos, 16);
  };
  const clear = () => { if (mark) { try { map.removeLayer(mark); } catch (e) {} mark = null; } };
  map.on("click", e => {
    place(e.latlng.lat, e.latlng.lng, false);
    onTap(e.latlng.lat, e.latlng.lng);
  });
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 120);
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 520);
  return { place: place, clear: clear, map: map };
}

/* =====================================================================
   📋 등판 · 💬 의소기한 · 📝 조사기한 — 당직 달력 아래 영역
   · 등판: 2026-12-09(수)부터 격주 수요일
   · 의소기한: 등판 전주 목요일(등판일 -6일)
   · 조사기한: 의소기한 하루 전(등판일 -7일)
   규칙 날짜는 저장 없이도 항상 달력에 뜨고, 관리자·당직 관리 권한자가
   날짜 상세에서 빼면 roster.msOff 에 남겨 그 날짜는 다시 뜨지 않는다.
   규칙 밖 날짜에 직접 넣은 항목만 duty_schedules(id = 날짜_ms_종류)에 저장된다.
   ===================================================================== */
const MS_TYPES = ["board_meeting", "opinion_due", "survey_due"];
const MS_FIRST_BOARD = "2026-12-09";
const isMsType = t => MS_TYPES.indexOf(t) >= 0;
const msKey = (ds, t) => ds + "|" + t;
/* 규칙 날짜 여부 — 12/9 를 기준으로 14일 주기 */
function msRuleTypes(ds) {
  const n = dayDiff(MS_FIRST_BOARD, ds);
  const out = [];
  if (n >= 0 && n % 14 === 0) out.push("board_meeting");
  if (n >= -6 && (n + 6) % 14 === 0) out.push("opinion_due");
  if (n >= -7 && (n + 7) % 14 === 0) out.push("survey_due");
  return out;
}
function msOffList() {
  const l = (S.roster && Array.isArray(S.roster.msOff)) ? S.roster.msOff : [];
  return l.filter(x => typeof x === "string");
}
/* 그 날 저장된(직접 넣은) 마일스톤 항목 */
function msStoredOn(ds) {
  return entriesOn(ds).filter(e => isMsType(e.type));
}
/* 그 날 달력에 보여줄 마일스톤 — 직접 넣은 것 + 규칙(뺀 날짜 제외) */
function msOn(ds) {
  const off = msOffList();
  const stored = msStoredOn(ds);
  const seen = {};
  const list = [];
  stored.forEach(e => {
    if (seen[e.type]) return;
    seen[e.type] = 1;
    list.push({ type: e.type, entry: e, auto: false });
  });
  msRuleTypes(ds).forEach(t => {
    if (seen[t]) return;
    if (off.indexOf(msKey(ds, t)) >= 0) return;
    seen[t] = 1;
    list.push({ type: t, entry: null, auto: true });
  });
  return MS_TYPES.filter(t => list.some(x => x.type === t)).map(t => list.filter(x => x.type === t)[0]);
}
/* 저장 — 규칙 밖 날짜에 직접 넣을 때 */
async function dbSaveMilestone(ds, type) {
  const id = ds + "_ms_" + type;
  const data = { startDate: ds, endDate: ds, type: type, memberId: "ms", memberName: (STATUS[type] || {}).label || "", memo: "" };
  if (S.mode === "demo") {
    demoMutate(d => {
      d.duty = (d.duty || []).filter(x => x.id !== id);
      d.duty.push(Object.assign({ id: id, createdAt: Date.now() }, data));
    });
  } else {
    const { doc, setDoc, serverTimestamp } = FB.f;
    await setDoc(doc(FB.db, "duty_schedules", id), Object.assign({}, data, { createdBy: myUid(), createdAt: serverTimestamp() }));
    S.duty = S.duty.filter(x => x.id !== id).concat([Object.assign({ id: id, createdAt: Date.now() }, data)]);
  }
}
/* 그 날 마일스톤 붙이기/빼기 */
async function msToggle(ds, type, on) {
  if (!canManageDuty()) { toast("관리자·당직 관리 권한자만 바꿀 수 있어요"); return; }
  const rule = msRuleTypes(ds).indexOf(type) >= 0;
  const stored = msStoredOn(ds).filter(e => e.type === type);
  const off = msOffList().slice();
  const key = msKey(ds, type);
  if (on) {
    if (rule) {
      if (off.indexOf(key) >= 0) await dbSaveRoster({ msOff: off.filter(k => k !== key) });
    } else if (!stored.length) {
      await dbSaveMilestone(ds, type);
    }
  } else {
    if (rule && off.indexOf(key) < 0) await dbSaveRoster({ msOff: off.concat([key]) });
    for (const e of stored) await dbDeleteEntry(e.id);
  }
}

/* 주 한 줄 안에서 여러 날 일정(1박 섬·연속 교육)을 가로 막대로 나누고 lane 배치 */
function islandWeekSpans(week) {
  const ty = calTypes();
  const firstDs = ymd(week[0]), lastDs = ymd(week[6]);
  const items = S.duty.filter(e => ty.indexOf(e.type) >= 0 && entryEnd(e) > entryStart(e) && entryEnd(e) >= firstDs && entryStart(e) <= lastDs)
    .map(e => {
      const s = entryStart(e) < firstDs ? firstDs : entryStart(e);
      const t = entryEnd(e) > lastDs ? lastDs : entryEnd(e);
      let c0 = -1, c1 = -1;
      week.forEach((d, i) => { const ds = ymd(d); if (ds === s) c0 = i; if (ds === t) c1 = i; });
      return { e: e, c0: c0, c1: c1 < 0 ? 6 : c1 };
    })
    .filter(x => x.c0 >= 0 && x.c1 >= x.c0)
    .sort((a, b) => a.c0 - b.c0 || (b.c1 - b.c0) - (a.c1 - a.c0));
  const lanes = [];
  items.forEach(sp => {
    let i = 0;
    while (lanes[i] && lanes[i].some(o => !(sp.c1 < o.c0 || sp.c0 > o.c1))) i++;
    (lanes[i] = lanes[i] || []).push(sp);
    sp.lane = i;
  });
  return items;
}
function islandBarHtml(sp) {
  const e = sp.e, s = STATUS[e.type] || STATUS.edu;
  const mine = e.memberId === myUid();
  const range = shortDate(entryStart(e)) + "~" + shortDate(entryEnd(e));
  const cols = sp.c1 - sp.c0 + 1;
  return '<div class="sbar ' + s.cls + (mine ? " mine" : "") + '" style="grid-column:' + (sp.c0 + 1) + " / span " + cols + ";grid-row:" + (sp.lane + 1) + '" title="' + esc(e.memberName + " · " + s.label + " " + range) + '">' +
    '<i class="em">' + (s.mini || s.em) + "</i>" + esc(e.memberName) + (cols > 1 ? '<span class="rg">' + range + "</span>" : "") + "</div>";
}

  if (s.length < 16) return "방금";
  return Number(s.slice(5, 7)) + "/" + Number(s.slice(8, 10)) + " " + s.slice(11, 16);
}
function seaUrl(kind) {
  const lat = SEA_ISLANDS.map(i => i.lat).join(",");
  const lon = SEA_ISLANDS.map(i => i.lon).join(",");
  if (kind === "marine") {
    return "https://marine-api.open-meteo.com/v1/marine?latitude=" + lat + "&longitude=" + lon +
      "&current=wave_height,wave_period&hourly=wave_height&forecast_days=" + SEA_DAYS + "&timezone=Asia%2FSeoul";
  }
  return "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
    "&current=temperature_2m,wind_speed_10m,wind_gusts_10m,weather_code,precipitation&hourly=wind_speed_10m,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum,precipitation_probability_max&wind_speed_unit=ms&forecast_days=" + SEA_DAYS + "&timezone=Asia%2FSeoul";
}
/* 12초 안에 응답이 없으면 중단 */
function seaGet(url) {
  const ac = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ac ? setTimeout(() => ac.abort(), 12000) : null;
  const opt = ac ? { signal: ac.signal, cache: "no-store" } : { cache: "no-store" };
  return fetch(url, opt).then(r => {
    if (!r.ok) throw new Error("연결 오류 " + r.status);
    return r.json();
  }).then(j => { if (timer) clearTimeout(timer); return j; },
         e => { if (timer) clearTimeout(timer); throw e; });
}
/* 여러 콜을 small개씩 나눠 보내고, 실패한 콜은 한 번 더 시도합니다.
   공공데이터포털은 동시 요청이 많으면 일부 응답을 늦게 주거나 붙잡는 경우가 있어
   전부 한꺼번에 보내지 않고 3개씩 물결로 보냅니다. */
async function seaGetWaves(urls, small) {
  const out = [];
  const size = small || 3;
  for (let i = 0; i < urls.length; i += size) {
    const wave = urls.slice(i, i + size);
    const r = await Promise.allSettled(wave.map(u => seaGet(u)));
    for (let k = 0; k < r.length; k++) out[i + k] = r[k];
  }
  for (let i = 0; i < urls.length; i++) {
    if (out[i] && out[i].status === "fulfilled") continue;
    try { out[i] = { status: "fulfilled", value: await seaGet(urls[i]) }; }
    catch (e) { out[i] = { status: "rejected", reason: e }; }
  }
  return out;
}

/* ---------- 기상청 격자·발표시각·값 변환 ---------- */
function seaPad(n) { n = Number(n) || 0; return (n < 10 ? "0" : "") + n; }
/* KST(UTC+9) 기준 날짜·시각 — 기기 시간대와 무관하게 섬 기준으로 맞춥니다 */
function seaKstParts(ms) {
  const t = new Date((typeof ms === "number" ? ms : Date.now()) + 9 * 3600 * 1000);
  const y = t.getUTCFullYear(), mo = t.getUTCMonth() + 1, d = t.getUTCDate();
  return { y: y, mo: mo, d: d, h: t.getUTCHours(), mi: t.getUTCMinutes(),
    ds: y + "-" + seaPad(mo) + "-" + seaPad(d), d8: "" + y + seaPad(mo) + seaPad(d) };
}
function seaAddDays(ds, n) {
  const p = String(ds || "").split("-");
  const t = new Date(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + Number(n || 0)));
  return t.getUTCFullYear() + "-" + seaPad(t.getUTCMonth() + 1) + "-" + seaPad(t.getUTCDate());
}
/* 단기예보 발표시각 02·05·08·11·14·17·20·23시 — 발표 20분 뒤부터 조회 */
function seaKmaShortBase(nowMs) {
  const now = (typeof nowMs === "number" ? nowMs : Date.now()) - 20 * 60 * 1000;
  const p = seaKstParts(now);
  const slots = [23, 20, 17, 14, 11, 8, 5, 2];
  for (let back = 0; back < 3; back++) {
    for (let i = 0; i < slots.length; i++) {
      if (Date.UTC(p.y, p.mo - 1, p.d - back, slots[i] - 9, 0, 0) <= now) {
        const ds = seaAddDays(p.ds, -back);
        return { ds: ds, d8: ds.replace(/-/g, ""), hh: seaPad(slots[i]) + "00" };
      }
    }
  }
  return { ds: p.ds, d8: p.d8, hh: "0200" };
}
/* 중기예보 발표시각 06·18시 — 발표 1시간 뒤부터 조회 */
function seaKmaMidBase(nowMs) {
  const now = (typeof nowMs === "number" ? nowMs : Date.now()) - 60 * 60 * 1000;
  const p = seaKstParts(now);
  if (p.h >= 18) return { ds: p.ds, d8: p.d8, hh: "1800" };
  if (p.h >= 6) return { ds: p.ds, d8: p.d8, hh: "0600" };
  const ds = seaAddDays(p.ds, -1);
  return { ds: ds, d8: ds.replace(/-/g, ""), hh: "1800" };
}
function seaKmaUrl(base, rows, q) {
  return base + "?serviceKey=" + SEA_KMA_KEY + "&pageNo=1&numOfRows=" + rows + "&dataType=JSON&" + q;
}
function seaKmaItems(j) {
  const r = (j && j.response) || {};
  const hd = r.header || {};
  if (hd.resultCode !== undefined && String(hd.resultCode) !== "00") {
    throw new Error("기상청 응답 " + String(hd.resultCode) + (hd.resultMsg ? " " + hd.resultMsg : ""));
  }
  const it = (r.body && r.body.items && r.body.items.item) || [];
  return Array.isArray(it) ? it : [it];
}
/* PCP 문자열 → mm ("강수없음" 0 · "1.0~4.9mm" 2.95 · "50.0mm 이상" 50) */
function seaPcp(v) {
  const s = String(v === null || v === undefined ? "" : v).trim();
  if (!s || s === "0" || s.indexOf("강수없음") >= 0) return 0;
  const nums = (s.replace(/[^0-9.]/g, " ").trim().split(/\s+/) || []).map(Number).filter(n => isFinite(n));
  if (!nums.length) return 0;
  return (Math.min.apply(null, nums) + Math.max.apply(null, nums)) / 2;
}
/* SKY(1 맑음·3 구름많음·4 흐림) + PTY(0 없음·1 비·2 비/눈·3 눈·4 소나기) → WMO 코드 */
function seaKmaCode(pty, sky) {
  const p = Number(pty), s = Number(sky);
  if (p === 1) return 63;
  if (p === 2) return 66;
  if (p === 3) return 73;
  if (p === 4) return 81;
  if (p >= 5) return 61;
  if (s === 1) return 0;
  if (s === 3) return 2;
  if (s === 4) return 3;
  return null;
}
/* 중기 해상날씨 문구("흐리고 비" 등) → 순위·아이콘 코드 */
function seaKmaWxRank(t) {
  const s = String(t || "");
  if (/비|눈|소나기/.test(s)) return 3;
  if (/흐림/.test(s)) return 2;
  if (/구름많/.test(s)) return 1;
  if (/맑음/.test(s)) return 0;
  return -1;
}
function seaKmaWorst(a, b) {
  return seaKmaWxRank(b) > seaKmaWxRank(a) ? String(b) : String(a || b || "");
}
function seaKmaWxCode(t) {
  const s = String(t || "");
  if (!s) return null;
  if (/눈/.test(s)) return /비/.test(s) ? 66 : 73;
  if (/비|소나기/.test(s)) return 63;
  if (/흐림/.test(s)) return 3;
  if (/구름많/.test(s)) return 2;
  if (/맑음/.test(s)) return 0;
  return null;
}
/* 단기예보 응답 → { hrs: {"YYYY-MM-DD HH": {ds,hh,wav,wind,tmp,sky,pty,pop,pcp}}, days: {ds:{...}} } */
function seaKmaShort(arr) {
  const hrs = {}, days = {};
  const dayOf = ds => days[ds] || (days[ds] = {
    ds: ds, wavMax: null, am: null, pm: null, n: 0, wind: null,
    tmax: null, tmin: null, tmx: null, tmn: null,
    rain: null, prob: null, pty: 0, sky: 0, code: null
  });
  (arr || []).forEach(x => {
    const d8 = String(x.fcstDate || "");
    if (!/^\d{8}$/.test(d8)) return;
    const ds = d8.slice(0, 4) + "-" + d8.slice(4, 6) + "-" + d8.slice(6, 8);
    const hh = Number(String(x.fcstTime || "00").slice(0, 2));
    const c = x.category, v = x.fcstValue, n = Number(v);
    const key = ds + " " + seaPad(hh);
    const o = hrs[key] || (hrs[key] = { ds: ds, hh: hh });
    const d = dayOf(ds);
    if (c === "WAV") { if (isFinite(n) && n > 0) o.wav = n; }
    else if (c === "WSD") { if (isFinite(n) && n >= 0) o.wind = n; }
    else if (c === "TMP") { if (isFinite(n)) o.tmp = n; }
    else if (c === "SKY") { if (isFinite(n)) o.sky = n; }
    else if (c === "PTY") { if (isFinite(n)) o.pty = n; }
    else if (c === "POP") { if (isFinite(n)) o.pop = n; }
    else if (c === "PCP") { o.pcp = seaPcp(v); }
    if (c === "TMX" && isFinite(n)) d.tmx = n;
    else if (c === "TMN" && isFinite(n)) d.tmn = n;
    else if (c === "PCP") d.rain = (d.rain === null ? 0 : d.rain) + seaPcp(v);
    else if (c === "POP" && isFinite(n)) d.prob = d.prob === null ? n : Math.max(d.prob, n);
  });
  Object.keys(hrs).forEach(k => {
    const o = hrs[k], d = days[o.ds];
    if (!d) return;
    if (typeof o.wav === "number") {
      if (d.wavMax === null || o.wav > d.wavMax) d.wavMax = o.wav;
      d.n++;
      if (o.hh >= 6 && o.hh <= 12 && (d.am === null || o.wav > d.am)) d.am = o.wav;
      if (o.hh >= 12 && o.hh <= 18 && (d.pm === null || o.wav > d.pm)) d.pm = o.wav;
    }
    if (typeof o.wind === "number" && (d.wind === null || o.wind > d.wind)) d.wind = o.wind;
    if (typeof o.tmp === "number") {
      if (d.tmax === null || o.tmp > d.tmax) d.tmax = o.tmp;
      if (d.tmin === null || o.tmp < d.tmin) d.tmin = o.tmp;
    }
    if (o.hh >= 6 && o.hh <= 18) {
      if (typeof o.pty === "number" && o.pty > d.pty) d.pty = o.pty;
      if (typeof o.sky === "number" && o.sky > d.sky) d.sky = o.sky;
    }
  });
  Object.keys(days).forEach(ds => {
    const d = days[ds];
    d.code = seaKmaCode(d.pty, d.sky);
    if (d.tmx === null) d.tmx = d.tmax;
    if (d.tmn === null) d.tmn = d.tmin;
  });
  return { hrs: hrs, days: days };
}
/* 그날 현재 시각과 가장 가까운 단기예보 시간값 */
function seaKmaHourNear(sh, ds, mins) {
  if (!sh || !sh.hrs) return null;
  let best = null, diff = 1e9;
  Object.keys(sh.hrs).forEach(k => {
    const o = sh.hrs[k];
    if (o.ds !== ds) return;
    const gap = Math.abs(o.hh * 60 - mins);
    if (gap < diff) { diff = gap; best = o; }
  });
  return best;
}
/* 중기예보 3건(해상·기온·육상) → { ds: {wmin,wmax,amMin,amMax,pmMin,pmMax,wtext,code,prob,tmin,tmax} }
   N일째 = 발표일 + (N-1)일. 파고가 없는 날(값 0)은 건너뜁니다. */
function seaKmaMid(seaArr, taArr, landArr, base) {
  const s = (seaArr && seaArr[0]) || {};
  const t = (taArr && taArr[0]) || {};
  const l = (landArr && landArr[0]) || {};
  const out = {};
  const num = v => { const n = Number(v); return isFinite(n) ? n : null; };
  for (let k = 3; k <= 10; k++) {
    const ds = seaAddDays(base.ds, k - 1);
    let amA = null, amB = null, pmA = null, pmB = null, wfAm = "", wfPm = "", prob = null;
    if (k <= 7) {
      amA = num(s["wh" + k + "AAm"]); amB = num(s["wh" + k + "BAm"]);
      pmA = num(s["wh" + k + "APm"]); pmB = num(s["wh" + k + "BPm"]);
      wfAm = String(s["wf" + k + "Am"] || "");
      wfPm = String(s["wf" + k + "Pm"] || "");
      const p1 = num(l["rnSt" + k + "Am"]), p2 = num(l["rnSt" + k + "Pm"]);
      if (p1 !== null || p2 !== null) prob = Math.max(p1 === null ? 0 : p1, p2 === null ? 0 : p2);
    } else {
      amA = num(s["wh" + k + "A"]); amB = num(s["wh" + k + "B"]);
      pmA = amA; pmB = amB;
      wfAm = String(s["wf" + k] || "");
      prob = num(l["rnSt" + k]);
    }
    if (!(amB > 0) && !(pmB > 0)) continue;
    const mins = [amA, pmA].filter(v => typeof v === "number" && v > 0);
    const maxs = [amB, pmB].filter(v => typeof v === "number" && v > 0);
    const wtext = seaKmaWorst(wfAm, wfPm);
    out[ds] = {
      ds: ds,
      wmin: mins.length ? Math.min.apply(null, mins) : null,
      wmax: Math.max.apply(null, maxs),
      amMin: amA, amMax: amB, pmMin: pmA, pmMax: pmB,
      wtext: wtext, code: seaKmaWxCode(wtext), prob: prob,
      tmin: num(t["taMin" + k]), tmax: num(t["taMax" + k])
